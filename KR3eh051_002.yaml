body:
  text: 卷二內傷虛損證治虛勞之證金匱敘於血痹之下可見勞則必傷其精血也營血傷則內熱起五心常熱目眩耳鳴口舌糜爛不知正味鼻乾燥呼吸不利乃至飲食不為肌膚怠倦嗜臥骨軟足痠營行日遲衛行日疾營血為衛氣所迫不能內守而脫出於外或吐或衄或出於二陰之竅血出既多火熱迸入逼迫煎熬漫無休止營血有立盡而已更有勞之之極而血痹不行者血不脫於外而但蓄於內蓄之日久周身血走之隧道悉痹不流惟就乾涸皮鮮滋潤肉無榮澤於是氣之所過血不為動徒蒸血為熱或日晡或子午始必乾熱俟蒸氣散微汗而熱解熱蒸不已不死何待耶亦有始因失血後遂痹者血虛血少難以流布發熱致痹尤易易也內經凡言虛病不及於勞然以大肉枯槁大骨陷下胸中氣高五臟各見危症則固已言之未有勞之之極而真藏脈不見者也秦越人始發虛損之論謂虛而感寒則損其陽陽虛則陰盛損則自上而下一損損於肺皮聚而毛落二損損於心血脈不能榮養臟腑三損損於胃飲食不為肌膚虛而感熱則損其陰陰虛則陽盛損則自下而上一損損於腎骨痿不起於床二損損於肝筋緩不能自收持三損損於脾飲食不能消化自上而下者過於胃則不治自下而上者過於脾則不治蓋飲食多自能生血飲食少則血不生血不生則陰不足以配陽勢必五臟齊損越人歸重脾胃旨哉言矣至仲景金匱之文謂精生於穀谷入少而不生其血血自不能化精內經於精不足者補之以味味者五穀之味也補以味而節其勞則精貯漸富天命不傾所以垂訓十則皆以無病男子精血兩虛為言而虛勞之候煥若指掌矣夫男子平人但知縱欲勞精抑孰知陰精日損飲食無味轉勞轉虛轉虛轉勞脈從內變色不外華津液衰而口渴甚則眼瞑衄血陰精不交自走盜汗淋漓身體振搖心膽驚怯者比比然也故血不化精則血痹矣血痹則新血不生並素有之血亦瘀積不行血瘀則營虛營虛則發熱熱久則蒸其所瘀之血化而為蟲遂成傳尸瘵證矣窮凶極厲竭人之神氣而入蟲之神氣人死則蟲亦死其遊魂之不死者傳親近之一脈閲三傳而非符藥所能制矣醫和視晉平公疾曰是近女室晦而生內熱惑蠱之疾非鬼非食不可為也惑即下唇有瘡蟲食其肛蠱乃三蟲共載一器非鬼非食明指蟲之為厲也以故狐惑之證聲啞嘎勞瘵之證亦聲啞嘎是則聲啞者氣管為蟲所蝕明也巢氏病源不察謂有虛勞有蒸病有注病另各分門異治致令後人以歧路之多茫然莫知所適矣仲景於男子平人諄諄致戒無非謂營衛之道納穀為寶居常調營衛以安其谷壽命之本積精自剛居常節嗜欲以生其精至病之甫成脈才見端惟以建中復脈為主夫建中復脈皆稼穡作甘之善藥一遵精不足者補之以味之旨也及其血痹不行仲景亟驅其舊生其新幾希於勞瘵將成未成之間誠有一無二之聖法第牽常者不能用耳倘有服膺仲景幾先之哲吃力於療病將成未成之界其活人之功皆足豫以生全而為彼蒼所眷注矣夫勞瘵之證無非臟腑之虛損所成也故心勞血損肝勞神損脾勞肉損肺勞氣損腎勞精損其大端也至其見證忽生喜怒大便苦難口內生瘡此為心勞短氣面腫不聞香臭咳嗽唾痰兩脅脹痛喘息不定此為肺勞面目乾黑精神不定不能獨臥目視不明頻頻下淚此為肝勞口苦舌燥嘔逆噁心氣脹唇焦此為脾勞小便赤澀兼有餘瀝腰痛耳鳴夜多異夢此為腎勞然猶未已也曲運神機為心之勞其證血少面無色驚悸盜汗夢遺極則心痛咽腫也盡力謀慮為肝之勞其證筋脈拘攣極則頭目昏眩也意外過思為脾之勞其證脹滿少食四肢倦怠極則吐泄肉削也預事而憂為肺之勞其證氣乏心腹冷痛津枯咳嗽極則毛焦烘熱也矜持志節為腎之勞其證腰背痛遺精白濁極則面垢脊痛也然要不外乎陰陽氣血之虛損焉耳凡見面紅顴赤或唇紅者陰虛於下逼陽於上也仲景曰其面戴陽者下虛故也虛而多渴者腎水不足引水自救也咳嗽聲不出者由腎氣之竭蓋聲出於喉而根於腎經曰內奪而厥則為喑痱此腎虛也虛而喘急者陰虛格肺氣無所歸也喉乾咽痛者真水下虧虛火上浮也不眠恍惚者血不養心神不能藏也時多煩躁者陽中無陰也易生嗔怒或筋急痠痛者水虧木燥肝失所資也飲食不甘肌肉漸削者脾元失守化機日敗也心下跳動怔忡不寧氣不歸精也經曰胃之大絡名曰虛理出於左乳下其動應衣宗氣泄也盜汗不止者有火則陰不能守無火則陽不能固也吐而多痰或如清水或多白沫者此水泛為痰脾虛不能制水也骨痛如折者腎主骨真陰敗竭也腰脅痛者肝腎虛也膝以下冷者命門衰絶火不歸源也小水黃澀淋瀝者真陰虧竭氣不化水也足心如烙者虛火燥陰湧泉涸竭也勞瘵之證千形萬態無非由於內傷虛損也危矣哉王安道云經云有所勞倦形氣衰少穀氣不盛上焦不行下脘不通胃氣熱熱氣蒸胸中故內熱此內傷之說之源乎夫有所勞役者過動屬火也形氣衰少者壯火食氣也穀氣不盛者勞傷元氣則少食而氣衰也上焦不行者清陽不升也下脘不通者濁陰不降也夫胃受水穀故清陽升而陰濁降以傳化出入滋榮一身也今胃不能納而穀氣衰少則清無升而濁無降矣故曰上焦不行下脘不通然非謂絶不行不通也但比之平常無病時則謂之不行不通耳上不行下不通則鬱矣鬱則少火成壯火而胃居上焦下脘兩者之間故胃氣熱則上炎熏胸中而為內熱也東垣所言正與經旨相合固宜引此段經文於內外傷辨以為之主然經曰勞者溫之溫者養也東垣以為溫涼之溫謂用溫藥以補元氣而瀉火邪又改損者益之為損者溫之又以溫能除大熱為內經所云而遍考內經並無此語也然溫藥之補元氣息火邪者亦惟氣溫而味甘者斯可矣蓋溫能益氣甘能助脾而緩火故元氣復而火邪息也虛損傷陰本由五臟雖五臟各有所主然證治有可分有不可分者如諸氣之損其治在肺神明之損其治在心飲食肌肉之損其治在脾諸血筋膜之損其治在肝精髓之損其治在腎此有可分者也然氣主於肺而化於精神主於心而化於氣肌肉主於脾而土生於火諸血藏於肝而血化於脾胃精髓主於腎而受之於五臟此其不可分者也故凡補虛之法但當明其陰陽升降寒熱溫涼之性精中有氣氣中有精之因但上焦陽氣不足者下必陷於腎也當取之至陰之下下焦真陰不足者多飛越於上也可不引之歸源乎所以治必求本方為盡善也越人發明虛損一證優入聖域謂一損損於肺皮聚而毛落二損損於心血脈虛不能榮於臟腑三損損於脾飲食不為肌膚四損損於肝筋緩不能收持五損損於腎骨痿不能起於床反此者至脈之病也從上下者骨痿不能起於床者死從下上者皮聚而毛落者死其論治損之法損其肺者益其氣損其心者調其營衛損其脾者調其飲食適其寒溫損其肝者緩其中損其腎者益其精雖無方可考而治法不大概可知乎張景嶽云按上損下損之說其義極精然猶有未盡悉也蓋凡思慮勞倦外感等證則傷陽傷於陽者病必自上而下也色欲醉飽內傷等證則傷陰傷於陰者病必自下而上也如經云二陽之病發心脾有不得隱曲女子不月之類此即自上而下者也又經曰五臟主藏精者也不可傷傷則失守而陰虛陰虛則無氣無氣則死矣此即自上而下也蓋自上而下者先傷乎氣故一損損於肺則病在聲息膚腠二損損於心則病在血脈顏色三損損於胃則病在飲食不調四損損於肝則病在瘛瘲頭疼五損損於腎則病為骨痿二便不禁此先傷於陽而後及乎陰陽竭於下則孤陰無以獨存不可為也自下而上者先傷於精故一損損於腎則病為泉源乾涸二損損於肝則病為血動筋枯三損損於脾則病為痰涎壅盛四損損於心則病為神魂失守五損損於肺則病為喘急短氣此先傷乎陰而後及乎陽陰竭於上則孤陽無以獨生不可為也故曰心肺損而神衰肝腎虛而形敝脾胃損而飲食不歸血氣凡明哲之士則當察所由而預防其微又何虛損之可慮也元氣虛與虛損不同元氣虛可復虛損難復也至虛損病亦有難復易復兩候因病致虛者緩調自復因虛致損者虛上加虛卒難復也故因病致虛東垣丹溪法在所必用若虛上加虛而致於損元氣索然丹溪每用人參膏至斤余多有得生者其見似出東垣之右然則丹溪補陰之論不過救世人偏於補陽之弊耳豈遇陽虛之病而不捷於轉環耶且丹溪不嘗云虛火可補參耆之屬實火可泄芩連之屬初何嘗拘於滋陰降火之法乎哉飲食勞倦為內傷元氣真陽下陷內生虛熱東垣發補中益氣之論用人參黃耆甘溫等藥大補其氣而提其下陷此用氣藥以補氣之不足也若勞心好色內損傷陰陰血既傷則陽氣偏盛而變為火矣是謂陰虛火旺勞瘵之證故丹溪發陽有餘陰不足之論用四物加知母黃柏補其陰而火自降此用血藥以補血之不足也一則因陽氣下陷而補其氣以升提之一則因陽火上升而濟其陰以降下之一升一降迥然不同亦醫學之兩大法門不可不究悉之也丹溪論勞瘵主乎陰虛者蓋自子至巳屬陽自午至亥屬陰陰虛則熱在午後子前寤屬陽寐屬陰陰虛則汗從寐時盜出也升屬陽降屬陰陰虛則氣不降氣不降則痰涎上逆而連綿不絶也脈浮屬陽沉屬陰陰虛則浮之洪大沉之空虛也此皆陰虛之證用四物湯加黃柏知母主之然用之多不效何哉蓋陰既虛矣火必上炎而當歸川芎皆味辛氣溫非滋陰降火藥又芎辛竄非虛炎短乏者所宜地黃泥膈非胃寒食少痰多者所宜黃柏知母苦辛大寒雖曰滋陰其實燥而損血雖曰降火其實苦先入心久而增氣反能助火至其敗胃所不待言不若用薏苡仁百合天冬麥冬桑白皮地骨皮牡丹皮五味子酸棗仁之屬佐以生地黃汁藕汁人乳童便等以保肺而滋生化之源往往應手而效虛勞之病百脈空虛非濡黏之物填之不能實也精血枯槁非滋潤之藥濡之不能潤也宜用人參黃耆地黃二冬枸杞五味之屬各煎膏另用青蒿以童便熬膏及生地汁藕汁乳汁薄荷汁隔湯煉過酌定多少並糜角膠霞天膏和合成劑再用一匙湯化服之如欲行瘀血加入醋製大黃汁桃仁泥韭汁之屬欲止血加入荊京墨之屬欲行痰加入竹瀝之屬欲降火加入童便之屬凡虛勞之症大抵心下引脅疼蓋滯血不消新血無以養之宜用膏子加韭汁桃仁泥呼吸少氣懶於言語無力動作目無精光面色㿠白皆兼氣虛用麥冬人參各二錢陳皮桔梗炙草各半兩五味子二十一粒為極細末水浸油餅為丸如豆大每服十丸細嚼津唾下名補腎丸氣虛則用生脈散不用白朮血虛則三才丸不用四物前言薏苡仁之屬治肺虛後言地黃參耆膏子之屬治腎虛蓋肝心屬陽肺腎屬陰陰虛則肺腎虛矣故補肺腎即是補陰非四物知柏之謂也勞瘵治法當以脾腎二臟為要腎乃系元氣者也脾乃養形體者也經曰形不足者溫之以氣氣謂真氣有少火之溫以生育形體然此火不可使之熱熱則壯壯則反耗真氣也候其火之少壯皆在兩腎間經又曰精不足者補之以味五味入胃各從所喜之臟以歸之以生津液輸納於腎者若五味一有過節反成其臟有餘勝克之患起矣候其五味之寒熱初在脾胃次在其所歸之臟即當補其不足泄其有餘謹守精氣調其陰陽夫是故天樞開發而胃和脈生矣東垣所論飲食勞倦內傷元氣則胃脘之陽不能升舉並心肺之氣陷入於中焦而用補中益氣治之方中佐以柴胡升麻二味一從右旋一從左旋旋轉於胃之左右升舉其上焦所陷之氣非自腹中而升舉之也其清氣下入腹中久為飧泄並可多用升柴從腹中而升舉者矣若陽氣未必下陷反升舉其陰氣干犯陽位為變豈小哉更有陰氣素慣上干清陽而胸中之肉隆聳為䐜胸間之氣漫散為脹者而誤施此法天翻地覆九道皆塞有瀕於死而坐困耳後人相傳謂此方能升清降濁有識者亦咸信之醫事尚可言哉夫補其中氣以聽中氣自為升降不用升柴可也用之亦可若以升清之藥責其降濁之能豈不病乎經云勞風法在肺下其為病也強上冥視唾出若涕惡風而振寒治之奈何曰以救俯仰巨陽引精者三日中年者五日不精者七日咳出青黃涕其狀如膿大如彈丸從口中或鼻中出不出則傷肺傷肺則死矣讀此可悟傷風不解成癆之故勞風者既勞而又傷風也勞則火動於上而風又乘之風火相摶氣湊於上故云法在肺下也肺主氣而司呼吸風熱在肺其液必結其氣必壅是以俯仰皆不順利故曰當救俯仰也救俯仰者即利肺氣散邪氣之謂乎然散邪氣之散與否在乎正氣之盛與衰若陽氣旺而精氣引者三日次五日又次七日則青黃之涕從咳而出出則風熱俱去而肺無恙矣設不出則風火留積肺中而肺傷傷則喘咳聲嘶漸及五臟而虛勞之病成矣今人治勞日用滋養而不少益者非以邪氣未出之故歟而久留之邪補之固無益清之亦不解虛勞之病所以難治也又按脈解篇云太陽所謂強上引背者陽氣大上而爭故強上也勞風之病火在上而風乘之風火皆陽也風性善行火性炎上非所謂陽氣大上而爭者乎又按虛勞之人氣血枯耗生氣不榮則內生寒冷所謂冷勞是也宜建中復脈八味腎氣之屬甘溫辛潤具生陽化陰之能者治之亦有邪氣淹滯經絡瘀郁者元珠所謂體虛最易感邪當先和解次則調之倘遽用補使邪氣不解往往致死是故治虛勞故不可專以補陰降火為事也又按有寒從中生者是人多痹氣也又腎者水也而生於骨腎不生則髓不能滿故寒盛至骨也是故氣痹精少皆能生寒不必其定責陽虛也薛立齊曰癆瘵之證大抵屬足三陰虧損虛熱無火之症故晝發夜止夜熱晝止不時而作當用六味地黃丸為主以補中益氣湯調補脾胃若脾胃先損者當以補中益氣湯為主以六味地黃溫存肝腎多有得生者若誤用黃柏知母之類則復傷脾胃飲食日少諸臟日虛元氣下陷腹痞作泄則不可救矣夫吐血衄血之類因虛火妄動血隨火而泛行或陽氣虛而不能攝血歸經而妄行其脈洪弦乃無根之火浮於外也大抵此證多因火土太旺金水衰涸之際不知保養及三冬火氣漸藏不遠幃幕戕賊真元故至春末夏初患頭疼腳軟食少體熱而為注夏之病或少有老態不耐寒暑不勝勞役四時迭病此時血氣方長而勞心虧損精神未滿而早為斫喪故其見證難以名狀者左尺脈虛弱或細數是左腎之真陰不足也用六味丸右尺脈遲軟或沉細而數欲絶是命門之相火不足也用八味丸至於兩尺微弱是陰陽俱虛也用十補丸此皆滋其化源也仍須參前後發熱咳嗽諸症治之李士材曰夫人之虛非氣即血五臟六腑莫能外焉而血之源頭在乎腎氣之源頭在乎脾脾為肝母肺為主氣之官故肺氣受傷者必求助於脾土腎為肺母肝為藏血之地故肝血受傷者必藉資於腎水補腎補脾法當並行然以甘寒補腎恐妨胃氣以辛溫補脾恐妨腎水須辨緩急而為之施治或補腎而助以沉香砂仁或扶脾而雜以山藥五味機用不可不活也虛勞之症扶脾保肺多不可缺然脾性喜溫喜燥而溫燥之劑不利於保肺肺性喜涼喜潤而涼潤之劑不利於扶脾兩者並列而論脾有生肺之機肺無扶脾之力故曰土旺而生金勿拘拘於保肺瀉火之亢以全陰氣壯水之主以制陽光法當並行然瀉火之劑多寒而損陽氣壯水之劑多平而損陰血兩者並列而論苦寒過投將有敗胃之憂甘平常用卻無傷中之害故曰水盛而火自熄勿汲汲乎寒涼凡陰虛多熱最嫌辛燥恐助陽邪也尤忌寒涼恐伐生氣也惟喜純甘壯水之劑補陰以配陽虛火自降而陽歸於陰矣陽虛多寒者最嫌涼潤恐妨陰邪也尤忌辛散恐傷陰氣也只宜甘溫益火之品補陽以消陰沉寒自斂而陰從乎陽矣不知者惟知以熱治寒以寒治熱所以陰虛不宜降者則服寒反熱陽虛不宜耗者則服熱反寒此無他皆以專治旺氣故病反如此春夏之令主生長秋冬之令主肅殺人知之矣殊不知藥之溫者行天地發育之德藥之寒者象天地肅殺之刑如四物湯加黃柏知母名坎離丸舉世奉之以為滋陰上劑降火神丹不知涼血之藥常滯膩非痰多食少者所宜涼血之藥多滋潤多用必至泄瀉嘗見虛勞之死多死於泄瀉而泄瀉之因多因於清潤況黃柏苦寒苦先入心久而增氣反能助火至其敗胃所不待言川芎上竄非火痰上氣者所宜知母滑腸豈元氣下陷者可服丹溪云實火可瀉芩連之屬虛火可補參耆之屬知柏之藥如病初起而相火正旺口舌燥渴而右尺滑暫投亦自無妨久用斷乎不可故用溫補病不增即是減內已受補故也用寒涼病不減即是增內已受伐故也虛勞精滑無度或交寅刻夢泄氣少力微日漸瘦削目視不明者因房勞太過督任不交不能制約陰火也陽虛者鹿茸丸龜鹿二仙膠陰虛者六味丸加鰾膠五味或六味丸雜聚精丸一分合服脾胃陰陽俱虛者宜兼補先後天藥也男子精未充滿色欲過度泄出多有半精半血者此竭力傷肝不能藏血也蓋少陰常少血多氣厥陰常多血少氣少陰之精氣既竭則厥陰之血氣亦傷是以並血泄出腎主閉藏肝主疏泄氣竭肝傷中空無主所以二臟俱閉其治總不出上法也若夫思欲不遂鬱火無下精為火擾而亡脫者又當清利瀉火為主設與固澀其滑愈甚矣凡虛損有不能受補藥者此為虛不受補何以復生若勞損失血之後嗽不能止而痰多甚者此以脾肺虛極飲食無能化血而隨食成痰此雖非血而實血之類也經曰血出者死故凡痰之最多最濁者不可治人身之左右為陰陽之道路而一邊難轉者此其陰陽之氣有所偏竭而然多不可治凡病虛損者原無外邪所以病雖至困終不憤亂其患虛證別無邪熱而譫妄失倫者此心臟之敗神去之兆也勞嗽喑啞聲不能出或喘息氣促者此肺臟之敗也勞損肌肉脫盡者此脾臟之敗也凡虛損有筋骨疼痛至極者乃血竭不能榮筋此肝藏之敗也虛損既久而泄瀉不禁者此腎臟之敗也皆為必死不救矣劉默生曰虛勞多起於郁鬱則其熱內蒸內蒸則生蟲蟲侵蝕臟則咳初起早為杜絶不致蔓延若遷延日久咳嗽不止痰如白沫聲啞喉痛不可治矣脾胃泄瀉六脈細數而堅極久臥床褥煩躁血多者不治如六脈平緩重按有神飲食不減大肉未削二便調骨痿而熱甚泄瀉無度而畏寒失血而脈數實咳吐白痰及嘔血聲散陽事不禁暮熱如焚面色夭然白及衄下血寒熱脫形脈堅搏者皆不可治如病久痞悶忽得氣血沖和心腎交媾陽事必舉尤宜切戒房室犯之必復愈難調治也大抵虛勞起於斫散者肝腎過勞多致亡血失精強中陰竭而死起於鬱結者內火爍津多致血竭乾咳嗜食發癰而死起於藥誤者脾肺受病居多多致飲食少減咳嗽瀉泄而死此證多患於膏粱不但所稟柔脆且性喜服藥小病必然變重展轉戕賊必至傷殘不已也面色不衰肌膚日瘦常如無病內實虛傷俗名桃花證其證蒸而咳嗽或多汗或無汗或多痰或無痰或經閉或泄精或吐血或衄血或善食或泄瀉須察其所見何證何臟受傷而治之然此皆為陰火煎熬之證治多不效室女過時不嫁男子過時不娶及少寡者皆犯此證以陰火雖乘陽位非但不能消爍陽分之津液陰分之津液竭力上供陽火之消爍故肢體日削而面色愈加鮮澤也輕者嫁娶漸愈重者雖暫流通即不能留而下下後半月十日自愈下血時能食者不死不能飲食精神倦怠者必死吐血後反驟能食者亦不可治凡虛損脈六七至在春夏火令津液枯槁腎水正行死絶之鄉肺絶脾燥無有不死者若秋冬火令已退金水正旺脈雖數可治也設病者骨立聲啞喉痛寒熱腹疼作瀉而脈細數亦屬不治凡病延至三四月服藥已多其不效者必過用寒涼五臟愈虛邪火愈熾初用補藥數劑邪火一退反覺頭眩噁心骨疼足痿神氣昏倦不思飲食倘脈見和緩用保元四君大劑連服便安寢半日覺時精神頓爽再服亦然飲食漸增則為可治倘脈細如絲腹痛昏憒者難治凡久病脈大小浮沉滑弦而三部不勻或寸浮尺沉或尺浮寸沉但見病脈反屬可治如久病浮中沉俱和緩細察無神而體倦甚者必死更看其面色光潤此精神皆發於外死期速矣凡久病元氣虛而脈反和緩假氣也遇七八月間服補劑病得漸減此生機也或延至十一月一陽初動陽氣漸升內氣空虛無以動生髮之氣則變增寒壯熱服補藥十餘劑寒熱漸退猶可延捱調理至二三月不變則生有變則不治勞損久而嗽血咽痛失音此為下傳上若不嗽不痛久而溺濁脫精此為上傳下皆死證也
