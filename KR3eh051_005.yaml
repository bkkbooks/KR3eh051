body:
  text: 卷五內傷虛損方法桂枝龍骨牡蠣湯全匱失精家少腹弦急陰頭痛目眩發落脈極虛芤遲為消穀亡血失精脈得諸芤動微緊男子失精女子夢交此湯主之桂枝二兩芍藥二兩生薑二兩甘草二兩大棗十二枚龍骨煅牡蠣煅分三服脈虛芤遲者亡血失精本虛之脈也芤動微緊者本虛中伏有微邪肝氣內動所以魂夢不寧也夫亡血失精皆虛勞內因之症仲景獨用桂枝湯其義何居蓋人身之氣血全賴後天水穀以資生水穀入胃其清者為營濁者為衛營氣不營則上熱而血溢衛氣不衛則下寒而精亡是以調和營衛為主營衛和則三焦各司其職而火自歸根熱者不熱寒者不寒水穀之精微輸化而精血之源有賴矣以其亡血既潰恐下焦虛滑不禁乃加龍骨牡蠣以固斂之蓋龍骨入肝斂魂牡蠣入腎固精後世每疑其止澀而非之殊不知二味入於石脂鍾乳蓯蓉金櫻之類則為劫劑入於桂枝湯則為固蟄封藏之本藥也至虛勞失精悸衄腹痛煩躁則於本方加飴糖為小建中虛勞裡急為營衛枯槁更加黃耆為黃耆建中此皆後天不足所致故以調和營衛為主治也後人專用滋陰降火誤治貽害未至於劇者用此悉可挽回若夫腎虛致病者又當八味腎氣丸以虛煩不得眠主以酸棗湯內有乾血勞者主以大黃䗪蟲丸以上諸治除酸棗湯外後世皆所切禁可慨已夫小建中湯金匱虛勞悸衄裡急腹痛夢遺失精四肢痠疼手足煩熱咽乾口燥此湯主之桂枝去皮三兩甘草炙三兩大棗十二枚芍藥六兩生薑二兩飴糖一升日三服黃耆建中湯虛勞裡急諸不足此湯主之桂枝三兩甘草炙三兩大棗十二枚芍藥六兩生薑二兩飴糖一升黃耆兩半氣短胸滿加生薑腹滿去棗加茯苓兩半肺虛損不足補氣加半夏二兩上條明系陽氣內奪之證下條較上虛證更劇故加黃耆以大補衛中陽氣也按虛勞至於亡血失精消耗精液枯槁四出難為力矣金匱用小建中黃耆建中湯以急建其中氣後人樂令建中並用前胡細辛以退表熱十四味建中兼用熟附蓯蓉以補下虛均失建中之義八味腎氣丸虛勞腰痛少腹拘急小便不利此方主之熟地淮藥茯苓棗皮澤瀉制附上桂除桂附即六味地黃湯按腰痛少腹拘急純屬肝腎虛寒而小便不利又似虛中有熱豈桂附所宜用乎殊不知肝既失其疏泄之權腎亦傷其生髮之氣水道自難流利故以桂附導火歸源設非辛溫蒸其至極之陽則沉洹有加無已乃於補陰藥中稍加陽藥使陰陽適中無偏勝之虞斯其為至治也按此即八味地黃丸用桂附乃補兩腎之陽非補命門也附子補氣中之陽由肺以入於腎故陽虛肺氣喘急者服之即止肉桂補血中之陽由肝以入於腎故陽虛肝火上浮者服之則納如以附為補命門則以命門屬氣桂不得為補命門矣以桂為補命門則以命門屬血附不得為補命門矣前人加入地黃丸不特附桂一氣一血俱入兩腎非命門也以命門為陽者此命門與兩腎分陰陽則命門為陽兩腎為陰命門為始生之根本即是萬物資始之乾元故為先天之元陽非以火為陽也如以兩腎分析而論則左血為陰右氣為陽亦非以水火分也如專以一腎而論則左腎不獨有精氣亦有之右腎不獨有氣精亦有之精即為陰氣即為陽此兩腎各有陰陽故八味地黃丸各補其陰陽也六味地黃丸治肝腎不足真陰虧損精血枯竭羸弱憔悴腰痛足痠自汗水泛為痰發熱咳嗽頭昏目眩耳聾耳鳴遺精便血消渴淋瀝失血失音舌燥喉痛足跟作痛下部瘡瘍熟地八兩山藥四兩棗皮四兩白苓三兩丹皮三兩澤泄三兩此為補陰之主方補五臟之陰以納於腎也臟陰虧損以熟地大滋腎陰壯水之主以為君用棗皮之色赤入心味酸入肝者從左以納於腎山藥之色白入肺味甘入脾者從右以納於腎又用三味通腑者恐腑氣不宣則氣鬱生熱以致消爍臟陰故以澤泄清膀胱而後腎精不為相火所搖又以丹皮消血分中熱以主血之心藏血之肝俱不為火所爍又以茯苓清氣分之熱則飲食之精由脾輸肺以下降者亦不為火所爍矣然後四臟之真陰無所耗損得以攝納精液歸入腎臟腎受諸臟之精液而藏之矣此方之元妙將棗皮山藥分看一入心肝一入肺脾既極分明而氣味又融洽將熟地棗皮山藥三味總看既能五臟兼入不致偏倚又能將諸臟之氣盡行納入肺臟以為統攝臟陰之主而不致兩歧至澤泄丹皮茯苓與三補對看其配合之妙亦與三補同法制方妙義周備若此非臻於神化者其孰能之惟其兼補五臟故久服無虞偏勝而為萬世不易之祖方也酸棗湯虛勞虛煩不得眠此湯主之棗仁炒二升甘草一兩知母二兩分三服深師有生薑二兩虛煩者肝虛而火氣乘之也故特取棗仁以安肝膽為主略加川芎調血以養肝茯苓甘草培土以榮木知母降火以除煩此平調土木之劑也六味地黃湯加麥冬五味此六味補腎麥味補肺入六味湯仍是補腎補腎以治肺此善於治肺也蓋腎旺不取給於肺也補中益氣湯人參三分嗽者去之白朮三分土炒黃耆一兩炙當歸五分酒焙柴胡升麻陳皮各二分甘草五分炙是方以辛甘溫之品溫足太陰厥陰升足少陽陽明黃耆當歸和營氣以暢陽佐柴胡從左出陰之陽人參白朮實衛氣以填中佐升麻引春升之氣從下而上達陽明陳皮運衛氣甘草和營氣東垣以後天立論氣者後天之氣出於胃者也故為補中益氣云枳朮丸治痞消食強胃本方仲景為湯劑易老改為丸也白朮二兩枳實一兩麵炒為末用荷葉裹飯上蒸飯和丸梧子大白湯下五七十丸理中丸人參三兩炙草三兩白朮三兩乾薑三兩理中者理中焦之氣以交於陰陽也上焦屬陽下焦屬陰而中焦則為陰陽相偶之處仲景立論中焦熱則主五苓以治太陽中焦寒則主理中以治太陰治陽用散治陰用丸皆不及湯人參甘草甘以和陰也白朮乾薑辛以和陽也辛甘相輔以處中則陰陽自然和順矣四君子湯治一切陽虛氣弱脾衰肺損面白或黃飲食少思四肢無力皮聚毛落脈來細軟人參二錢白朮炒二錢茯苓二錢炙草二錢薑棗煎服經曰氣主煦之四味皆甘溫之品故專主氣分甘得中之味溫得中之氣猶之不偏不倚之君子也功專健脾和胃以受水穀之精氣而輸布於四臟一如君子成人之德也誠為生化良方加廣皮半夏名六君子不特為脾經治痰而半夏入胃有交通上下陰陽之神妙四物湯治一切血虛日晡發熱當歸酒洗生地各三錢白芍酒炒二錢川芎一錢經曰血主濡之四味皆濡潤之品故為血分主藥地黃入心腎以沃血之源入心脾而壯主血攝血之本芍藥入肝而斂疏泄之血海川芎通足三陰而行血中之氣然吳氏曰失血太多者禁勿與之四物皆陰得天地閉塞之令非所以生萬物者也本方加黃柏知母為知柏四物湯又蜜丸為坎離皆用為滋陰降火主劑要惟初病而實火大旺方可暫用病久亡血失精斷非所宜前于丹溪治法論之悉矣補血湯治傷於勞役肌熱面赤煩渴引飲脈大而虛黃耆五錢一方作一兩當歸二錢酒洗一方作四錢是方治因飢困勞役致面紅目赤身熱引飲脈洪大而虛重按全無此血虛發熱證似白虎惟脈不長實為辨耳誤服白虎湯必殆調中益氣湯治內傷大便飧泄時見白膿炙耆二錢人參蒼朮甘草各一錢陳皮升麻柴胡各四分木香二分升陽順氣湯治內傷春月口淡夏月雖熱猶畏寒胸膈滿悶飢常如飽黃耆炙二錢草豆蔻八分神麯炒當歸各一錢陳皮人參各六分升麻柴胡甘草各四分姜煎升陽補氣湯治飲食失節飢飽勞役胃虛氣短四肢倦怠早飯後昏悶要眠五心煩熱柴胡錢半生地一錢升麻澤泄防風羌活獨活甘草各七分厚朴炒五分薑棗煎服升陽益胃湯治脾胃虛弱怠倦嗜臥時值秋燥濕熱方退體重節痛口苦舌乾不思飲食不知味大便不調小便數兼肺病灑淅惡寒乃陽氣不升也羌活五錢防風五錢柴胡二錢獨活五錢黃連二錢白芍五錢黃耆二兩炙草一兩人參一兩白朮三錢茯苓三錢廣皮四錢半夏一兩澤泄三錢薑棗煎早飯午飯之間服此東垣治所生受病肺經之方也蓋脾胃虛衰肺先受病金令不能肅清下行則濕熱易攘陽氣不得升而為諸病當以羌防柴胡升舉三陽經氣獨活黃連白芍瀉去三陰鬱熱以六君子調和脾胃其重用參耆半夏炙草若輕於健脾重於益胃其升陽之藥分輕則易升仍宜久煎以厚其氣用於早飯午飯之間藉穀氣以助藥力總是升胃之陽耳至於茯苓澤泄方後注云小便利不淋勿用是滲泄主降非升陽也桃核承氣湯桃仁五十個去皮尖桂枝二兩去皮大黃四兩去皮芒硝三兩甘草二兩先煎四味後納芒硝溫分三服是方治太陽熱結解而血復結於少陽樞紐間者必攻血通陰乃得陰氣上承大黃芒硝甘草皆入血之品必主之以桃仁直達血所攻其急結仍佐桂枝泄太陽隨經之餘熱內外分解庶血結無留戀之處矣犀角地黃湯犀角三錢生地五錢連翹三錢甘草五分原方有丹皮澤泄無連翹甘草是治厥陰陽明藥也溫熱入絡舌絳煩熱八九日不解醫反治寒散之攻之熱勢益熾得此湯立效者非解陽明熱邪解心經之絡熱也犀角地黃走心經專解營熱連翹入心散客熱生甘草入心和絡血以治熱症熱邪入絡於理無悖也又回春於原方內加當歸黃芩黃連各一錢治衄血不止蔥豉湯蔥白豉煎服無汗加葛根此足太陽藥也蔥通陽而發汗豉升散而發汗邪初在表宜先服此解散之免用麻黃湯者之多所顧忌用代麻黃之所更紛也桂苓丸治暑月傷冷濕吐瀉桂心赤苓等分為末蜜丸一兩作八丸井水化下一丸既濟丸治膀胱虛小便不禁兔絲子酒煮益智仁炒茯苓韭子炒肉蓯蓉酒洗當歸熟地各五分黃柏知母鹽水炒牡蠣煅山茱萸酒蒸各五錢五味一錢為末酒麵糊丸梧子大空心鹽湯下百丸既濟湯治霍亂虛煩不得眠麥冬二錢人參竹葉半夏附子炮炙草各一錢姜五片粳米百粒煎服滋腎丸治胃虛蒸熱腳膝無力陰痿陰汗衝脈上衝而喘及下焦邪熱口不渴而小便祕黃柏酒炒二兩知母酒炒一兩肉桂一分蜜丸此足少陽藥也水不勝火法當壯水以制陽光黃柏苦寒微辛瀉膀胱相火補腎水不足入腎經血分知母辛苦寒滑上清肺金而降火下潤腎燥而滋陰入腎經氣分二藥每相須而行為補水之良劑肉桂辛熱假之反佐為少陰引經寒因寒用也甘草湯一藥治病是曰奇方甘草為九土之精生用則涼故用伐腎泄熱治咽痛者功在緩腎急而救陰液也甘草二兩炙甘湯一名復脈湯炙草四兩桂枝三兩去皮人參二兩麻仁半斤生地一斤阿膠二兩麥冬半斤去心生薑三兩大棗十二枚先煎八味後納膠是方仲景治心悸王濤治肺痿孫真人治虛勞三者皆是精涸燥淫之證至真要大論云燥淫於內金氣不足治以甘辛也第藥味不從心肺而主乎肝脾者是陽從脾以致津陰從肝以致液各從心肺之母以補之也人參麻仁之甘以潤脾津生地阿膠之鹹苦以滋肝液重用地冬濁味恐其不能上升故君以炙草之氣厚桂枝之輕揚載引地冬上承肺燥佐以清酒芳香入血引領地冬歸心復脈使以薑棗和營衛則津液悉上供於心肺矣十全大補湯治男婦諸虛不足五勞七傷此藥性溫補常服生血壯脾胃人參肉桂熟地白芍川芎白苓當歸黃耆炙白朮炙草各一錢二分薑棗煎補腎丸治腎水不足陰虛龜板酒炙四兩知母黃柏酒炒各二兩乾薑泡一兩為末粥丸梧子大空心鹽湯下五十七丸三才丸治血虛天門冬熟地黃人參等分為末蜜丸梧子大每服百丸酒下黃耆十補湯補虛勞養氣血炙耆當歸去尾酒洗熟地茯神去心皮各一錢沉香木香各五錢麥冬去心烏藥肉桂半夏薑汁炒五味炒棗仁炒白朮人參白芍炒陳皮炙草各八分薑棗煎坎離丸治陰虛嗽血遺精盜汗潮熱當歸白芍川芎生地黃柏知母蜜丸坎離膏黃柏知母各四兩生地熟地天冬去心麥冬去心各二兩杏仁去皮尖七分胡桃肉白蜜各四兩上銼先將知柏以童便三碗側柏葉一把煎三四碗去渣又將二冬二地入汁內添水二碗煎汁去滓再搗爛如泥另用水一二碗煎熬絞取汁入前汁將杏仁胡桃肉用水擂爛濾汁再擂再濾至無滓同蜜入前汁內慢火熬成膏入水內去火毒每三五匙以側柏葉湯調服忌銅鐵器人每徒服二地而不知用二冬為引何也蓋生地能生新血用麥冬引入所生之地熟地能補腎精用天冬引入所補之地故古方多四味互相為用也清肺湯治先痰後血為積熱也赤苓陳皮當歸生地赤芍天冬麥冬黃芩梔子紫菀阿膠炒桑白皮各七分甘草三分棗二枚烏梅一枚煎服鹿角膠丸治房室勞傷小便出血也鹿角膠一兩炒珠沒藥油發灰各六分為末取白茅根汁打糊為丸梧子大空心鹽湯下七十丸分消湯治中滿成鼓脹滿悶蒼朮白朮陳皮厚朴枳實赤苓各一錢香附豬苓澤泄腹皮各八分縮砂六分木香三分薑燈心煎服養營湯治脾肺氣虛榮血不足驚悸健忘寢汗發熱食少無味身倦肌瘦色枯氣短毛髮脫落小便赤澀人參一錢白朮一錢土炒茯苓七分廣皮一錢炙草一錢熟地七分當歸一錢白芍錢半黃耆一錢肉桂一錢志肉五分五味七分薑棗煎服是方調養營氣循衛而行不使其行之度數疾於衛也故於十全大補湯中減川芎行血之品獨用血分填補收斂之藥則營行之度緩於氣分藥中加廣皮行氣之品則衛行之度速觀其一減一加便能調乎營衛使其行度不愆復加遠志五味者經言營出中焦心經主之以遠志通腎使陰精上奉於心佐以五味收攝神明一通一斂則營有所主而長養矣鹿茸丸治腎虛消渴小便無度鹿茸二兩麥冬熟地炙耆五味子蓯蓉酒浸雞肫胵麵炒棗皮牛膝破故紙人參各七錢半白苓五錢地骨皮五錢元參五錢為末蜜丸梧子大空心米飲下五七十丸二仙膏鹿角十斤龜板五斤枸杞二斤人參一斤先將鹿角龜板鋸截刮淨水浸桑柴火熬煉成膠再將人參枸杞熬膏和入每早酒服三錢是方治瘦弱少氣夢遺泄精目視不明精極之證此足少陰藥也龜為介蟲之長得陰氣最全鹿角遇夏至即解稟純陽之性且不兩月長至一二十斤骨之速生無過此者故能峻補氣血兩者皆用氣血所謂補之以其類也人參大補元氣枸杞滋陰助陽此血氣陰陽交補之劑氣足而精固不遺血足則視聽明瞭久服可以益壽豈第已疾而已哉保元丸治老弱諸沉寒痼冷小便滑數大便時溏腰腿臍腹疼痛困倦虛瘦食減附子泡去皮臍白朮山藥肉豆蔻赤石脂乾薑泡各一兩肉桂去皮五錢為末麵糊丸梧子大每服一二十丸空心鹽湯下保元湯治營衛氣血不足黃耆蜜酒炙三錢至六錢人參三錢至六錢炙草一錢水煎四味鹿茸丸治肝腎皆虛咳嗽吐血脈虛無力上熱下寒鹿茸酥炙另搗成泥五味歸身各一兩熟地二兩酒糊丸梧子大每服四五十丸酒下濟生鹿茸丸治腎臟真陰久虛下體痿弱疼痛喘嗽水泛為痰鹿茸酥炙牛膝鹽水炒五味各二兩石斛巴戟附子炮川楝酒蒸山藥肉桂杜仲鹽酒炒澤泄鹽水炒各一兩沉香另研五錢酒糊丸梧子大每七十丸酒下歸脾湯治思慮過度勞傷心脾怔忡健忘驚悸盜汗發熱體倦食少不眠或脾虛不能攝血致血妄行及婦人崩帶人參二錢白朮二錢茯神二錢黃耆二錢炙炙草五分當歸二錢棗仁二錢炒遠志一錢去心炒木香五分桂圓七枚歸脾者調四臟之神志魂魄皆歸向於脾也蓋五味入胃必藉脾行其津液以轉輸於四臟而四臟亦必先承順乎脾而為氣化流行之根本參朮神草以健脾胃佐以木香醒脾氣桂元和脾血先為調劑中洲復以黃耆走肺固魄棗仁入心斂神固膈上二焦當歸入肝苦以悅其魂遠志入胃辛以通其志通調膈下二臟四臟安和其神志魂魄自然歸向於脾而脾亦能受水穀之氣灌溉四旁榮養氣血矣獨是藥性各走一臟足經方雜用手藥者以黃耆與當歸棗仁與遠志有相須之理且黃耆味入脾而氣走肺棗仁味入肝而色走心故借用不悖四君子用茯苓改用茯神者以苓為死氣而神得松之生氣耳四烏賊骨一藘茹丸治氣竭血結婦人血枯經閉男子陰痿精傷烏鰂骨四兩藘茹一兩丸以雀卵大如小豆以五丸為度飲以鮑魚汁內經僅留數方人多忽置前人誤作䕡茹殊失其旨按本草藘茹即茜草二味並走血分故以之治氣竭肝傷血枯經閉等症丸以雀卵飲以鮑魚汁取異類有情以暖腎調肝則虛中留結之乾血漸化黃水而下矣此雖搜血之品然非若大黃䗪蟲丸之猛峻也如無雀卵即雀肉或雞卵與肝亦可代花蕊石散治虛勞吐血五內崩損湧出升斗者服此使瘀血化為黃水後以獨參湯補之花蕊石火煅研如粉用童便一鍾煎溫服如男用酒一半如女用醋一半和服十灰散治嘔吐咯嗽血及虛勞大吐血大薊小薊側葉荷葉茅根茜根大黃梔子棕櫚皮牡丹皮等分燒存性出火毒研極細用生薑汁或蘿白汁磨松墨半碗調服五錢即止又丸方黃絹馬尾藕節艾葉蒲黃蓮蓬油發棕櫚赤松皮新棉各燒灰等分為末以醋煮糯米糊和丸梧子大米飲下百丸治崩血又一切失血聖愈湯治血虛心煩睡臥不寧五心煩熱人參川芎當歸熟地生地炙耆各一錢水煎服獨參湯治虛勞吐血後羸弱氣微少食等症人參一兩棗煎服異功散治脾胃虛弱飲食少進未能消化心胸痞悶人參白朮茯苓陳皮木香甘草各一錢薑棗煎服參蘇飲治內傷外感發熱頭痛嘔逆咳嗽痰逆中焦眩運嘈煩傷風泄瀉及傷寒已汗發熱不止人參紫蘇甘葛前胡半夏薑汁炒白苓各二錢半陳皮去白甘草枳殼麵炒桔梗各二錢木香五分薑棗煎外感多者去棗加蔥白肺中有火去參加杏仁桑白皮泄瀉加白朮扁豆蓮肉此手足太陰藥也風寒宜解表故用蘇葛前胡勞傷宜補中故用參苓甘草橘半除痰止嘔枳桔利膈寬腸木香行氣破滯使內外俱和則邪自散矣枳實理中湯治寒實結胸膈高起手不可近用大陷胸不瘥者白朮土炒二兩人參乾薑炮炙草各一兩枳實麵炒白苓各一兩蜜丸小烏沉湯治諸氣心腹刺痛香附制二兩烏藥一兩沉香甘草各二錢半為末每二錢鹽湯調服黑神散治傷損大吐血口鼻俱出百草霜二錢糯米飲調服取深村柴火鍋底上者為妙柴胡疏肝散治脅肋疼痛寒熱往來陳皮姜炒柴胡各二錢川芎枳殼麵炒白朮各錢半香附錢半炙草五分玉屑丸主治腸風臟毒椿根白皮曬乾四兩槐根白皮苦楝根寒食麵各三兩威靈仙一兩生南星生半夏各五錢為末滴水和丸梧子大每三十丸水一盞煎丸令浮以匙抄吞送下不嚼五苓散治暑濕風寒諸症豬苓去皮茯苓去皮澤泄白朮肉桂去皮為末以白飲和服方寸匕渴者去桂加黃連是方豬苓藉澤泄之咸以潤下茯苓藉白朮之燥以升精脾精升則濕熱散而小便不利者又難越膀胱一腑故以肉桂之熱因熱用內通陽道使太陽里水引而竭之此專治留著之水滲於肌肉而為腫滿若水腫與足太陰無涉者又非對證之方矣導赤散治小腸有火便赤淋痛面赤狂躁口糜舌瘡咬牙口渴生地甘草梢淡竹葉木通等分導引也小腸一名赤腸為四臟之一稟氣於三焦故小腸失化上為口糜下為淋痛生地入胃而能下利小腸甘草和胃而能下療莖中淡竹葉皆輕清入內之品同生地甘草則能從廣腸導有形之熱邪入於赤腸其濁中清者復導引滲入黑腸而令氣化故云導赤妙香散治夢遺失精驚悸鬱結人參一兩益智仁一兩龍骨一兩茯神五錢去心遠志五錢去心甘草水泡炙草二錢半硃砂水飛每服二錢空心溫酒調服水煎亦可良方加木香二錢五分麝香一錢是方治有夢之遺精經言手足少陰之厥令人妄夢良方加以二香通其神明使人不夢淫邪泮釋自無精泄之患而荊公之方無此二味或流傳日久而脫文耳夫精之藏蓄在腎統攝在脾至疏泄則為聽命於心故用茯苓遠志通腎以泄邪火人參益智固脾以攝真精茯神安神硃砂定氣龍骨祕精三者皆安鎮心經之藥甘草調和陰陽則心有所主而精不搖矣瀉青丸治肝實當歸膽草川芎梔子大黃煨羌活防風等分為末蜜丸芡實大每一丸竹葉湯同砂糖溫水化下一名涼肝丸逍遙散治血虛肝燥骨蒸勞熱咳嗽潮熱行來寒熱口乾便澀月經不調當歸酒洗白芍酒炒白朮土炒白苓柴胡各二錢炙草五分煨薑薄荷煎此足少陽厥陰藥也肝虛則血病當歸芍藥養血而斂陰木盛則土衰甘草白朮和中而補土柴胡升陽散熱合芍藥以平肝而使木得條達茯苓清熱利濕助甘術以益土而令心氣安寧生薑暖胃除痰調中解鬱薄荷疏肝泄肺理血消風疏逆和中諸症自己所以有逍遙之名本方加丹皮梔子名八味逍遙散治怒氣傷肝血少目暗臟連丸治遠年近日腸風臟毒下血川連八兩槐米二兩枳殼一兩防風甘草槐角香附牙皂木香各五分用陳米三合同香附一處為末余藥共為細末用豬大腸約長二尺洗淨入米香附於內縛定以水二大碗砂鍋炭火煮干即添水煮爛如泥取起和藥搗丸梧子大每早米飲下七八十丸忌面蒜生冷煎炙之物升陽除濕防風湯蒼朮米泔水浸四錢防風二錢白芍白苓各一錢如胃寒瀉泄腸鳴加益智仁半夏各五分薑棗煎是方治大便閉塞或裡急後重數至圊而不能便或有白膿或血慎勿利之利之則必重病反鬱結而不通矣以此升舉其陽則陰自降矣此足太陰陽明藥也蒼朮辛溫燥烈升清陽而開諸郁故以為君白朮甘溫白苓甘淡佐之以健脾利濕而升陽白芍酸寒斂陰而和脾也抵當湯水蛭三十個熬虻蟲三十個熬去翅足桃仁三十個去皮尖大黃三兩皮酒浸是方破無情之血結誠為至當不易之方毋怪乎藥之險也然水蛭非熬化即煮熟糜爛亦能復生未可輕用生脈散治熱傷元氣氣短倦怠口渴多汗肺虛而咳人參五錢麥冬三錢去心五味三錢凡曰散者留藥於胃徐行其性也脈者主於心而發原於胃也然脈中之氣所賴以生者必資藉於腎陰故內經言君火之下陰精承之也麥冬清肺金治節之司五味收先天發水之源人參引領麥冬五味都氣於三焦歸於肺而朝百脈猶天之雲霧精白露降故曰生脈按仲景抵當湯代抵當丸用治乾血勞之血枯經閉內用水蛭但此物最易化生雖以火炙焦研末若投水中露一宿必復變生許多小蛭此則未可輕用惟千金一方用發灰杏仁等分熬令紫色搗如泥以豬膏和為丸如梧子大每以酒下三丸日三服甚良然竊意以桃仁易杏仁更佳又一古方用白鴿子一隻去肝腸淨入血竭於內病一年者用一兩二年者二兩三年者三兩以針線縫住用無灰酒煮熟令病人吃之瘀血即行如心中恍亂者食白煮肉一塊即止此二方有同氣相求之妙較抵當湯丸甚遠用之可無虞也然此病已過三年必不可治矣
