body:
  text: 卷六內傷虛損方法援瘵湯當歸炒芍熟地各一兩棗皮茯苓鱉甲炙各五錢白微二錢服三月全愈此肝腎兩治鱉甲白微殺蟲能補能攻殺蟲於無形而諸藥大補肝腎其痰自化何用消痰逐穢傷脾胃也健脾殺蟲湯白朮五錢人參白微車前各二錢萬年青一片熟地一兩麥冬一兩棗皮生棗仁各三錢貝母一錢服三月愈此補胃不助陽消腎不損液腎足制心不刑肺實妙法也安肺湯麥冬五錢元參五錢桔梗蘇葉款冬各二錢生地白芍天冬黃芩熟地茯苓棗皮各三錢紫菀一錢貝母五分二劑愈此肺腎同治何名安肺蓋子母同氣安腎正所以安肺也倘但祛邪因傷益傷矣助功湯人參二錢茯苓三錢麥冬五錢甘草桔梗半夏各一錢黃芩五分三劑全愈此肺胃同治助胃即助肺泄肺火即泄胃火邪入肺必入陽明肺邪散寧遁入陽明乎利肺湯紫蘇甘草桔梗半夏各一錢人參二錢白朮三錢茯苓五錢神麯五分三劑全愈此不見利水水自從膀胱出因內傷致邪故不必治外感衛主生氣湯人參三錢白朮麥冬北味棗仁炒白芍元參各一兩白芥子二錢二劑愈此五臟兼補也倘補心不補各臟反致偏勝矣定神湯人參黃耆各一兩茯神白朮丹參棗仁生當歸各五錢丹砂末遠志柏子仁甘草各一錢巴戟淮藥各三錢白芥子二錢十劑愈此脾胃肺肝同治蓋心為孤主今四臟同治則扶助有力心神自旺勞傷自愈通泉飲棗仁炒麥冬各一兩天冬人參丹參柏子仁各三錢北味甘草遠志各一錢當歸五錢三劑愈此補心氣又生津液何必補腎以通源也衛心湯人參二錢白朮五錢茯苓三錢甘草石菖蒲蘇葉半夏桔梗丹參各一錢三劑愈此心與膻中俱補不可分治況原因喜樂而得憂愁乎故邪易散加減小柴胡湯柴胡甘草各一錢白芍一兩茯神五錢麥冬三錢陳皮五分三劑邪散此用柴胡和膽中實邪佐神麥白芍補膽弱即補心虛二經同補恐懼不畏又何有於外邪乎坎離兩補湯人參生地麥冬淮藥各五錢熟地一兩絲餅棗仁炒茯苓白朮各五錢丹皮二錢北味一錢桑葉十四片十劑愈此心腎兩補水上濟心心無亢炎自有滋潤也風火兩濟湯白芍一兩梔仁炒三錢柴胡花粉車前各二錢甘草一錢丹皮五分三劑愈此治肝經之內火內風然外之風火亦可兼治倘不用白芍為君單用柴梔雖風火亦能兩平而肝中氣血虛未能驟補風火散後肝木仍燥怒氣終不能解何如白芍能補肝又能泄風火之兩得加味逍遙散柴胡半夏甘草白朮梔仁炒各一錢當歸白芍各三錢陳皮五分茯苓二分三劑愈此解鬱祛風也郁解風自難留加半夏消痰梔仁退火更能相助為理故奏功如響又前方加荊芥三錢治肝血有損因大怒而致此善疏肝氣解鬱也滋肝飲元參一兩麥冬五分白朮一兩丹皮沙參當歸各五分甘菊茯苓各三錢五十劑愈此補腎滋肝肝得水滋則火不發也順適湯白芍一兩茯苓白朮各三錢人參甘草五分白芥鬱金香附各一錢當歸二錢陳皮五分川芎八分三十劑愈此入肝又入脾胃舒木宜土故奏功二白散芡實淮藥四兩萬年青四片各炒研細末白糖一斤滾水調服遇飢即服以愈為度二味健脾尤補腎萬年青殺蟲於無形入二味中蟲亦不知何以消藏但不可責近效加人參助胃尤妙清欲湯當歸白芍葳參元參熟地各一兩柴胡錢半丹皮三錢骨皮五錢白芥子一錢十餘劑愈此補肝兼補腎水旺木榮木平火息尤妙補中仍有開鬱藥若徒補血泄火尚隔一層益脾湯人參扁豆炒神麯各一錢淮藥五錢芡實巴戟白朮各三錢砂仁一粒半夏三分茯苓二錢肉蔻一枚服三月胃開六月脾健此補胃自益脾助火生土湯人參茯苓各三錢黃耆炙白朮巴戟各五錢甘草肉桂各一錢石菖蒲神麯各五錢山楂十粒志肉八分三十劑愈此上補心包下補命門中補脾胃火生土而食消倘補火不知命門心包之異故健脾脾不健開胃胃不開不至癆不止補中益氣湯加半夏神麯三劑愈此益脾聖藥況睡臥既久脾氣下陷正宜提之半夏神麯最醒脾故加之補中益氣湯加熟附三分十劑愈參耆歸術得附子其功益大加味四君子湯白朮五錢茯苓人參各三錢甘草柴胡各一錢枳殼五分二劑愈此因胃虛寒熱相戰故以健脾為主佐之和解也加味六君子湯人參乾薑炒各二錢白朮棗仁炒茯苓各三錢陳皮甘草各五分半夏一錢熟附一片二十劑愈此雖統治脾胃然棗仁薑附補心居重補脾居輕宜偏治胃也消酒散白朮棗皮苡仁各一兩葛花二錢肉桂三分茯苓三錢三十劑愈此脾胃兩補分解酒濕但酒性太熱宜先解熱何但治濕且用肉桂助熱不知濕不行由命門火衰真火衰邪火自盛真火盛邪火自衰邪火衰邪水自流邪水流邪火自散六君子湯加黃耆三錢熟附一分神麯五分十劑愈此補脾胃氣病原傷脾胃脾胃一轉後天無損先天自可接續故癆瘵易愈和順湯升麻炒炮姜五分防風白芷甘草各五分黃耆白芍茯神各三錢白朮五錢人參二錢午前服連十劑黑色除再十劑全愈此補中益氣之變也凡陽氣下陷此方提之倘陰氣上浮陽中則此方以升散陰氣皆奏功甚捷護內湯白朮茯苓各三錢麥芽甘草柴胡半夏各一錢山楂五粒枳殼三分神麯八分肉桂二分二劑愈此消食神劑又逐外邪不傷脾氣真治內傷外感之良法金水兩滋湯麥冬熟地各一兩天冬茯苓白朮各三錢桔梗甘草紫菀各一錢淮藥五錢肉桂三分白芥子三分十劑愈此見腎虛感邪最難愈以散邪藥不能直入腎經不知腎虛感邪邪不遽入腎仍在肺散肺邪仍補腎水腎得益肺又無損正善於散邪也脾腎兩益丹人參白朮巴戟各一錢茯苓五錢柴胡甘草各一錢肉桂五分棗皮三錢十劑愈此補土又補水補水又散邪有益無傷真神方也養陰辟邪方當歸白芍各五錢柴胡甘草花粉各一錢荊子五分茯苓川芎各三錢二劑愈此原因津虧而邪入方因補血養陰津自生邪自出況川芎蔓荊能祛頭風柴胡炙草更擅解紛花粉茯苓消痰利濕引邪從膀胱出陰虛內傷外感莫此為良倘用攻於補陽之中則陽旺陰消邪轉熾矣補中益氣湯加貝母一錢十劑愈此乃東垣一生學問全注於此妙在用升柴於參歸耆術內一從左旋升心肝腎氣一從右旋升肺脾胃命門氣非僅升上中二焦氣也陽升陰自降或疑陽氣未必盡陷反升陰氣干犯陽位為變非小不知陽氣不陷未有生病者陽陷人始病升陽而陰降陰亦何能犯陽哉八味地黃湯此水中補火補陽兼補陰故補火無亢補水不寒也起瘵至神湯熟地麥冬各一兩棗皮茯苓淮藥鱉甲炙各五錢芡實白朮各三錢杜仲炒一錢百部二錢肉桂三分十劑蟲死服二月愈此補腎安心惟鱉甲百部殺蟲鱉甲引百部入至陰內妙在補陽不傷髓蟲死腎無異氣心自受益又有麥冬苓術相扶自安奠中宮也涼髓丹骨皮丹皮各一兩麥冬五錢叉斛三錢牛膝茯苓各二錢服一月愈此用地骨丹皮不特補腎水且涼骨髓與消骨外血骨中熱骨外安有不熱骨中髓熱必耗骨外血骨外血熱必爍骨中髓用二味髓血兩治矣髓血既無大熱腎中寧獨熱哉況石斛牛膝補腎真陰陰旺則陽平水盛則火退骨蒸癆瘵又何能成救瘵湯熟地五錢白芍淮藥骨皮麥冬各二錢沙參三錢北味十粒白微人參各五錢白芥子鱉甲炙茯苓各一錢服一年愈必斷色欲此補陰居多再加人參以助胃氣則補陰而無膩滯之憂即殺蟲亦非毒藥配合精良治起初癆神效化石湯熟地二兩茯苓棗皮元參各一兩苡仁澤泄麥冬各五錢十劑愈此妙不治淋反補腎以苓淡滲解鹹味麥冬元參散火氣地黃棗皮滋腎水又取甘能化石咸能消石也又恐滯而不行留而不走益澤泄咸以入咸且善走攻堅引群藥入腎中又能出腎外迅逐於膀胱之裡而破塊倘不補腎惟治膀胱氣不得出又烏能化水也益肺湯人參白朮當歸淮藥芡實各三錢麥冬五錢北味柴胡荊芥各五分二十劑愈此因傷氣傷肺也補肺兼補脾胃雖益肺實益氣也肺衰則氣衰肺旺則氣旺氣衰可不補肺哉補肺又何能捨脾胃哉開胃填精湯人參麥冬棗皮茯苓各三錢白朮五錢熟地巴戟各一兩北味一錢肉蔻一枚三十劑愈補中益氣湯加元參三錢桑葉二十片十劑愈此多用參耆補氣氣旺血亦旺自能流行身癢多屬火加元參退浮游之火汗多發癢桑葉止汗癢自止也加減大補湯人參當歸茯苓白朮白芍熟地各三錢黃耆五錢川芎甘草柴胡各二錢陳皮五分數劑愈此氣血兼補但原方有肉桂呼盧鬥貝未免火有餘而水不足故易以柴胡補中和之邪尤易散養筋湯熟地白芍麥冬各一兩棗仁炒巴戟各三錢十劑愈此心肝腎三經同治凡三經病通治非獨治陽明筋症在人通變也充髓丹熟地棗皮各一兩石斛沙參各五錢骨皮牛膝茯苓各三錢北味一錢此填補真陰使水足精滿髓充骨健倘用寒藥治胃熱藥助陽愈熬津液必成癆瘵矣加味四物湯熟地一兩當歸白芍各五錢川芎柴胡白芥子各一錢牛膝三錢丹皮叉斛各二錢此用四物補水亦補髓邪因虛入補髓血邪自出故少加柴胡風邪隨散倘徒散邪非善治也內傷失血方法固氣生血湯治一時狂吐血黃耆炙一兩當歸五分荊芥炒二錢此即補血湯之變妙在荊芥引血歸於氣中引氣生於血內血氣之陰陽交水火之陰陽自濟臟腑經絡不致再沸至於有形之血不能速生無形之氣所當急固大約此方治初起嘔吐狂血最妙若吐血久不可以服三臺救命湯治肝腎失血熟地八兩麥冬三兩丹皮二兩此用熟地補腎滋肝麥冬清肺治肝丹皮去肝浮游之火又引火歸腎使血歸經然非重用不濟至火息血盡後以地黃丸服之良法也兩瀉湯治吐黑血白芍丹皮骨皮元參各一兩梔仁炒三錢服二劑血變紅四劑咳除血止此見黑北方水色黑血兼屬心火乃火極似水如火投水中必為烏薪方瀉肝仍瀉心包與腎火得水而解血得寒而化所以神效解暑止血湯治感暑嘔吐血塊青蒿石膏各一兩當歸麥冬元參各五錢荊芥炒大黃一錢二劑愈不可多此用青蒿於解暑中退陰火則陰陽濟拂逆自除石膏退胃火麥冬退肺火元參退腎火荊芥引火下行又得大黃不再停胃又恐血既上越大腸必燥加當歸助速行之勢故旋轉如環取效甚捷化絲湯治痰見血絲熟地麥冬各一兩貝母蘇子荊芥炒各一錢元參茯苓各五錢骨皮沙參各三錢此肺腎心三經兼治加去痰退火但愈後不可仍服宜用後方益陰地黃丸熟地一斤淮藥桑皮八兩麥冬骨皮十兩丹皮茯苓六兩北味三兩澤泄四兩蜜丸日服三錢壯水湯治久吐血不止熟地二兩生地一兩荊芥炒二錢三七末三錢二劑不發此二地補精寓止血之妙荊芥引血歸經三七隨斷路徑入不再出火得水消氣得水降此理為至微也平肝止血散治大怒吐血白芍二兩當歸一兩荊芥丹皮各三錢梔仁炒二錢甘草一錢此用白芍平肝又益肝同當歸用生血活血實有神效丹皮梔子不過少涼血以清火俟荊芥引經甘草緩急耳六味地黃湯治咯血加北味一錢此治水不須泄火也又方治咳嗽失血麥冬熟地各二兩骨皮丹皮各一兩白芥子三錢十劑愈此肺腎同治故麥地並用加骨皮丹皮蓋以咳血必損陰陰虛則火旺此火乃陰火二味解骨髓中熱則腎無煎熬不索肺金肺中滋潤自濟腎腎漸濡養肝治心外侮不侵何有耗散白芥子消膈膜之痰以陰氣虛耗必有痰取不耗真陰氣也止衄湯治鼻衄不止生地一兩麥冬三兩元參二兩一劑止此麥冬治肺虛生地元參解腎火火退氣自順氣順血歸經矣填竅止氛湯治耳出血麥冬一兩熟地二兩石菖蒲一錢一劑效此用熟地補腎麥冬息心包火菖蒲引二味直透耳中也護舌丹治舌上出血不止丹皮麥冬桔梗各三錢人參甘草北味各一錢元參五錢熟地一兩黃連三分肉桂一分四劑愈此專交心腎也六味地黃湯加麥冬五錢北味骨碎補各一錢四劑愈此用六味補水水足火自降火降血不妄行加麥北補肺水尤易生碎補透骨補漏血欲不止得乎兩止湯治臍中出血熟地三兩棗皮麥冬各一兩北味一錢白朮五錢四劑除根此用熟地棗皮補水麥味益肺白朮利腰臍腰臍利水火流通各取給於腎而不爭矣加味補血湯治九竅出血當歸一兩黃耆三兩人參荊芥炒各三錢白朮生地各五錢二劑愈此見血妄行火已泄不必清火而輒補氣蓋其妄行由氣虛不能攝血也倘用止抑則一竅閉安必衆竅盡閉況又加行氣涼血兼清火有不奏功哉三地湯治大便出血生地熟地當歸各一兩地榆三錢木耳末五分二劑愈此精血兩補腸中自潤既無乾燥自無滲漏況地榆涼木耳塞有不速效哉水火兩通湯治尿血痛澀車前子三錢梔子五錢茯苓當歸各五錢木通黃柏扁萹各一錢白芍生地各一兩三劑愈此通利水火又平肝補血蓋血證再懼肝木克脾胃脾胃氣下陷不能升血又何從升散乎今平肝肝舒脾胃亦舒脾胃氣舒小腸水火兩通敗精速去矣肺腎兩益湯治毛孔出血熟地二兩人參麥冬各一兩三七根末三錢一劑血止再用六味地黃加麥冬北味調理全愈此金水相資肺腎火息血自歸何至走入皮毛外泄況三七根原止血故宜效之捷也滋脾飲治唾血人參三分茯苓三錢元參芡實白茅根淮藥丹皮各三錢熟地一兩沙參五錢甘草五分二劑愈此輕治脾重補腎探本也倘止泄脾火必傷胃土胃傷脾更傷然後補腎則不能生腎水何能制脾胃火無論唾血難止吾恐胃關不閉血且傾盆此滋脾飲所以效耳助心丹治兩目流血熟地麥冬各一兩志肉二兩茯神元參丹皮當歸各三錢棗皮芡實五錢蓮子心一錢柴胡三分二劑愈此心肝腎藥補腎生肝即補腎生心或疑腎火動不宜補腎不知火動乃水衰況心火必得水資乃旺心肝腎火自平也補液丹治舌上出血人參生地淮藥各三錢麥冬當歸元參各五錢丹參二錢北味十粒黃連貝母各一錢外用炒槐花三七根末等分搽之即愈溫經湯治婦人經斷熟地白朮各一兩淮藥當歸各五錢棗仁生白芍沙參各三錢丹皮人參各二錢柴胡杜仲各一錢八劑經通一月受孕此心肝脾腎同治妙在補水以通之開鬱以解之倘徒補則鬱不開生火徒散則氣益衰耗精或用攻堅並辛熱之品無益反害蕩邪丹治室女月經不來如娠雷丸大黃各一錢桃仁三十粒當歸丹皮各五錢甘草生二錢一劑下穢物半桶再用調正湯白朮蒼朮苡仁各五錢茯苓三錢陳皮甘草貝母各一錢四劑經漸行或疑鬼胎必傷血故血枯經閉今墮其胎何不補血反補胃氣蓋鬼氣中人正虛可知且血不驟生補氣自易生血二術補陽氣陽旺陰自難犯倘徒補血則陰以招陰恐胎雖下鬼氣必再種也固本止崩湯治血崩目暗昏暈熟地白朮各一兩人參黃耆各三錢當歸五錢乾薑灰二錢十劑愈倘貴藥重減半必不能止此妙補血更補氣且補火蓋血崩至黑昏暈則血必盡去僅存氣一線若不急補氣則有形血不速生無形氣必盡散故補血先補氣然補氣不補血血不易生補血不補火血自凝滯不能隨氣速生況乾薑引血歸經補中有收故妙補血湯加三七末三錢桑葉十四片治老婦血崩此用三七根止血桑葉滋陰又收斂但年老陰精既虧此補精藥尚少其後宜加白朮五錢熟地一兩淮藥四錢麥冬三錢北味一錢多服固氣湯治受娠血崩胎墮人參白朮熟地各五錢當歸杜仲各三錢茯苓甘草棗皮各二錢遠志一錢北味十粒十劑愈此固氣兼補血凡因虛血崩皆效引精止血湯治交感血涓涓不止人參棗皮各五錢白朮熟地各一兩茯苓二錢車前荊芥炒各三錢黃柏五分乾薑炒一錢十劑愈此用參耆補氣地棗補精精氣旺血管自流動加苓前利水水利血竅自利加黃柏直入血管引出夙精加荊芥引出敗血又益黑姜止血管之口此實有調理曲折之妙然必慎房事三月乃善也平肝止血湯治血崩作渴吐酸白芍二兩當歸白朮各一兩柴胡一錢三七根末丹皮生地各三錢甘草荊芥各二錢四劑愈此妙白芍平肝得柴胡而鬱盡解白朮利腰臍血不積注荊芥通經絡血自歸還丹皮涼骨髓熱生地清臟腑熱當歸三七補中止血自郁散血止耳逐瘀止崩湯治跌僕血下如崩大黃龜板各三兩生地一兩當歸五錢白芍二錢丹皮一錢枳殼五分桃仁十粒不必四劑清海丸治每交感即如血崩熟地桑葉白芍白朮元參各一斤棗皮石斛各八兩北味三兩麥冬沙參骨皮丹皮淮藥各十兩龍骨煅醋淬二兩蜜丸滾水下早晚各五錢半年愈此補陰無浮動縮血無寒冷潛移默奪子宮清涼血海自固內傷備用選方香砂平胃散主治傷食蒼朮二錢陳皮去白香附制各一錢枳實麵炒藿梗各八分厚朴薑汁炒縮砂薑汁炒各七分木香另研甘草各五分姜煎腥脾育胃湯治中氣不足飲食不化虛痞吞酸人參白朮炒白苓各一錢半夏蒼朮縮砂姜炒白芍炒麥芽炒厚朴薑汁炒藿香陳皮去白各八分枳實麵炒五分薑棗煎健脾保和丸消導飲食有補有化不致傷脾白朮二兩枳實麵炒查肉陳皮麥芽炒各一兩神麯炒白蔻木香各五錢為末粳米飯和丸梧子大白湯下五七十丸養脾丸治脾胃虛冷飲食不消或腹脹嘔泄乾薑炮縮砂薑汁炒各四兩炙草二兩麥芽炒白苓人參白朮各一兩為末蜜丸每兩分作八丸薑湯下滋脾丸滋脾養胃消化飲食神麯炒麥芽炒半夏陳皮蓮肉去心枳殼炒縮砂薑汁炒甘草各一兩為末陳米飯和丸梧子大米湯下百丸葛花解酲湯治飲酒過傷嘔吐痰逆手足戰搖精神昏亂飲食減少葛花縮砂薑汁炒白蔻各五錢青皮三錢白朮乾薑神麯炒澤泄各一錢人參豬苓白苓陳皮各錢半木香五分為末每三錢白湯調服對金飲子治酒食傷和胃消痰陳皮三錢厚朴薑汁炒蒼朮甘草姜煎服加甘葛二錢赤苓縮砂薑汁炒神麯各一錢尤好人參散治飲食酒傷房勞酒入百脈令人恍惚失常熟地二錢人參白芍天花粉枳殼茯神棗仁炒甘草各一錢水煎龍腦湯醒酒消食縮砂薑汁炒二兩甘草兩半為末每五錢或一錢茶清下葛花散飲酒令不醉葛花小豆花等分為末每三錢白湯調服一名雙花散三豆解醒湯治中酒頭痛嘔吐煩渴善解酒毒多飲不醉因酒消渴尤宜服之葛根二錢蒼朮錢半陳皮赤苓木瓜半夏各一錢神麯炒七分澤泄五分生薑三分黑豆緑豆赤小豆各二錢夏月及酒渴者加川連五分人參湯人遇勞倦辛苦用力過多即服一二帖免生內傷發熱等症炙耆錢半人參白朮陳皮麥冬去心各一兩茯神八分炙草七分五味二十粒薑棗煎服一名補氣湯二曲丸治脾虛痰盛食不入妙甚神麯炒半夏等分為末以薑汁糊丸服香砂養胃湯治胃寒飲食不思痞悶不舒白朮一錢蒼朮縮砂厚朴陳皮白苓各八分白蔻人參木香甘草各五分薑棗煎服守中金丸治內傷脾胃虛冷腹中痞痛或腸鳴自利不思飲食蒼朮桔梗乾薑泡炙草各一兩為末蜜丸彈子大每一丸醋湯嚼下不換金正氣散蒼朮厚朴薑汁炒半夏陳皮藿香甘草薑棗煎服或加蘇葉縮砂參苓白朮丸養元氣補脾胃進飲食清火化痰白朮二兩半桔梗薏仁白蓮去心各二兩人參山藥白苓陳皮半夏扁豆炒當歸香附遠志去心甘草湯泡甘草各一兩縮砂五錢共為末薑棗煎湯打神麯一兩煮爛和丸梧子大白湯下百丸一方有黃連石菖蒲參苓白朮散治內傷脾胃虛弱飲食不思或吐瀉人參白朮白苓山藥炙草各三錢薏仁白蓮桔梗扁豆縮砂各錢半為末每一錢棗湯調服或銼一兩薑棗煎服瑞蓮丸治內傷脾胃虛弱少飲食或泄瀉山藥白朮白苓芡實白蓮陳皮白芍炒各一兩人參炙草各五錢為末用獖豬肚一個洗淨煮爛和藥搗丸梧子大每早米飲下百丸參朮調元膏扶元氣健脾胃進飲食潤肌膚生精血白朮一斤人參四兩並銼片入砂鍋內淨水十碗熬取汁二碗濾渣又添水熬取汁二碗去渣將二次汁濾淨和合慢火熬至二碗加入蜜半斤再熬至稠釅埋土中三日取出日服三四次白湯調下又方白朮一味不拘分如此熬法三次去渣和勻原汁慢火熬至滴水成珠為度或加蜜或不加蜜取出入磁瓶收貯退火毒每日白湯調服三四次甚妙大人可加黃耆熬膏九仙王道糕養精神扶元氣健脾胃補虛損生肌肉除濕熱蓮肉山藥白苓薏仁各四兩麥芽炒扁豆炒芡實各一兩柿霜四兩白糖二十兩為末入粳米粉蒸糕曬乾任意食之米飲送下白雪糕治內傷補養脾胃山藥芡實白蓮各四兩粳米糯米各一升共為粉砂糖斤半拌勻蒸糕食之妙天真丸治內傷脾胃俱虛津液枯竭形體羸瘁肉蓯蓉當歸山藥天冬各十兩四味為末用精羊肉七斤批開入人上藥末入內扎緊入糯米酒置瓶中煮令酒干再入水二升又煮候肉爛如泥乃入黃耆末五兩人參末三兩白朮末二兩熟糯米飯焙末十兩拌勻同搗作丸梧子大每服百丸日三服久服滋血添精生津液潤燥澀以上俱飲食傷用大補陰丸降陰火壯水要藥黃柏鹽酒炒知母酒炒各四兩熟地龜板炙各六兩為末豬脊髓和煉蜜為丸梧子大每鹽湯下五七十丸加味補陰丸補陰虛泄陰火黃柏知母酒炒各四兩牛膝杜仲炒巴戟熟地棗皮各三兩肉蓯蓉白苓枸杞遠志山藥鹿茸龜板炙各二兩為末蜜丸梧子大鹽湯下五七十丸虎潛丸治陰虛勞症龜板炙黃柏炒各四兩熟地知母炒各三兩白芍當歸鎖陽各二兩陳皮虎骨炙各一兩乾薑泡五錢為末酒糊和丸梧子大鹽湯下五七十丸一方煮羊肉汁和丸名龍虎丸補天大造丸壯陽光滋腎水為天地交泰若虛勞之人房室過度五心煩熱服之神效久服延年益壽紫河車一具熟地當歸茴香酒炒黃柏酒炒白朮炒各二兩生地酒炒天冬麥冬牛膝酒洗杜仲炒各兩半枸杞五味各七錢陳皮乾薑泡各二兩側柏葉向東枝者焙二兩為末入河車共搗丸梧子大米飲或酒下百丸入門大造丸治氣血虛陽痿面黃紫河車一具蒸生地二兩半白苓二兩縮砂六錢後三藥以紗絹包之入磁缸內酒煮再添酒煮七次取出去苓砂不用蓋地黃得砂仁茯苓則入胃經故也與河車加前方藥料搗丸服同法以上俱陰虛用參耆建中湯治虛損少氣四肢倦怠飲食少進當歸錢半人參黃耆炙白朮炒白苓白芍炒一錢生地酒炒一錢甘草五分五味三分薑棗煎鹿茸大補湯治虛勞少氣一切虛損肉蓯蓉杜仲炒各一錢白芍炒白朮炒製附子人參肉桂半夏石斛五味各七分鹿茸炙耆當歸白芍熟地各五分甘草二分薑棗煎桂附湯治陽虛血弱虛汗不止肉桂附子泡各三錢薑棗煎服茸附湯治氣血精虛耗潮熱盜汗鹿茸附子炮各二錢半薑棗煎服以上俱陽虛用雙和湯治心力俱勞氣血皆傷或勞役後房室及大病後虛勞氣乏自汗等症白芍二錢半熟地當歸川芎炙耆甘草各七分薑棗煎服一方同名乃建中四物合用治大病虛勞氣乏最效異類有情丸治虛勞氣血兩虛鹿角霜龜板炙各三兩六錢鹿茸炙虎脛骨炙各二兩四錢為末用雄豬脊髓九條同煉蜜搗丸梧子大每鹽湯下五七十丸鹿陽也龜虎陰也血氣有情各從其類也如膏粱善飲之人可加豬膽汁以寓降火之意是齊雙補丸平胃氣血不燥不熱熟地兔絲各八兩為末酒糊和丸梧子大酒下五七十丸以上陰陽俱虛用究源心腎丸治虛勞心腎不交水不濟火怔忡盜汗遺精赤濁兔絲酒浸三兩牛膝熟地肉蓯蓉鹿茸炙附子泡人參遠志茯神炙耆山藥當歸龍骨煅五味各一兩為末以浸兔絲酒糊和丸梧子大棗湯下五七十丸此主心虛黑丸治虛勞陰血耗竭面色黧黑耳聾目暗腰痛腳弱小便白濁當歸鹿茸炙一兩為末烏梅肉為膏和丸梧子大酒下五七十丸滋補養榮丸治虛勞氣血俱虧精神短少脾胃虛弱專補肝血遠志白芍炙耆白朮各二兩半熟地人參五味川芎當歸山藥各二兩陳皮八錢白苓七錢生地五錢棗皮四錢為末蜜丸梧子大米飲下五七十丸三方俱主肝血無比山藥丸補腎益精血五味六兩肉蓯蓉四兩兔絲杜仲炒各三兩山藥二兩赤石脂煅茯神棗皮巴戟牛膝澤泄熟地各一兩為末蜜丸梧子大米飲或酒下五七十丸小兔絲子丸治虛勞腎損陽氣衰少小便滑數兔絲子五兩山藥蓮肉各二兩白苓一兩為末山藥糊丸梧子大鹽湯或酒下三味安腎丸治腎虛氣不歸元變見諸症用此補腎令其納氣破故紙炒茴香炒乳香等分蜜丸梧子大鹽湯下三五七十丸補精膏治虛勞益真氣助胃潤肺山藥八兩另研胡桃肉四兩研如泥杏仁去皮尖炒四兩另研雄牛前腿髓四兩蜜一斤二味同煮去渣入三藥末和勻入缸封固重湯煮半日取出每一匙溫酒調服衛生湯補虛勞除煩熱和血脈炙耆二錢白芍酒炒當歸各錢半炙草七分水煎入酒服氣弱加人參一錢救陰理癆湯治陰虛火動皮寒骨熱食少痰多咳嗽短氣倦怠煩悶生地薑汁酒炒二錢當歸酒洗一錢白芍酒炒一錢五味三分麥冬去心一錢人參六分炙草四分蓮子去心三錢薏仁三錢陳皮八分丹皮一錢棗煎服救陽理癆湯治勞傷氣耗倦怠懶言動作喘乏表熱自汗心煩遍身作痛黃耆酒炒三錢人參二錢當歸酒洗錢半白朮炒二錢炙草五分陳皮去白八分五味四分肉桂七分薑棗煎服班龍丸常服延年益壽鹿角膠鹿角霜兔絲子柏子仁各八兩白苓破故紙各四兩為末酒煮米糊作丸梧子大姜鹽湯下五十丸何首烏丸治男子元藏虛損填精補髓首烏八兩肉蓯蓉六兩牛膝四兩將首烏用棗一層甑內蒸棗軟用竹刀切焙同為末以棗肉和丸梧子大每服五十丸嚼馬藺子服酒下食前一服加一丸日三服至四十丸即止其效如神麋茸丸治腎虛腰痛不能轉側麋茸一兩兔絲子一兩硫黃五錢為末以羊腎二對酒煮爛去膜研如泥和丸梧子大陰乾如羊腎不敷入酒糊佐之鹽湯或酒送服五十丸聚精丸治腎虛封藏不固鰾膠白淨者一斤碎切蛤粉或牡蠣粉炒成珠再用乳酥拌炒沙苑蒺藜五兩乳浸一宿隔湯蒸一炷香曬乾勿炒為末煉蜜中加入陳酒候蜜將冷為丸不可熱搗熱搗則膠黏難丸丸如緑豆大酒下八丸忌諸魚牛肉景嶽加五味子二兩以上皆擇録古方景嶽新方如歸腎飲丸左歸右歸飲丸及舉元煎等類亦多可用前醫學指要內備載茲不贅及習醫數十年研窮古聖經旨先賢名論因於虛勞失血之症裁訂方法加減施治獲效頗多附此以質高明培元養陰湯紋黨參三四錢至一兩若初見血或有火即用洋參泡於術用米泔水泡二日荷葉包飯上蒸過不用土炒三四錢初起不用淮山藥初用生後用鹽水洗蒸五六錢至一兩薏苡仁初用生後用蒸四五錢至七八錢一兩霍山石斛另煎濃汁沖服一錢至二三錢丹參酒洗桔梗泡廣陳皮去白一錢藕節水洗二三錢炙草一錢白蓮去心三錢白茅根一撮為引服數劑血不止可加黑薑炭五六分數服自止以後去藕節姜灰加玉竹蜜蒸四五錢至一兩真阿膠用蒲黃炒珠三四錢多服引去白茅根加白蓮南棗服至一兩月後無反復變易即用溫補滋陰等劑隨服能加保養自獲安全矣如咳嗽痰多加麥冬去心米炒一二錢或加冬蟲夏草一二錢或加貝母去心糯米拌炒一二錢若久嗽肺氣虛極即加北味二三錢紫菀百合一二錢亦可其餘止嗽之藥切勿妄加嘗見醫風寒咳嗽誤用止嗽等藥致成勞瘵而莫救比比然也慎之慎之此體經文補以味調以甘之意而扶脾助胃保肺益腎兼及之矣蓋詳究藥性山藥色白味甘入脾肺補不足瀉虛熱汪注云陰虛則內熱補陰故能清熱則山藥自能補陰且肺為腎母金水相生故又能益腎陰脾為心子子母相助故又能益心氣且稼穡作甘之本味可治虛損勞傷固宜用以為君而臣之者則有人參之益土生金養元泄火並治虛勞薏仁之益胃健脾補肺清熱主治血症或藉茯神之能守安養心神或資茯苓之微滲交通心腎甘草甘補脾胃瀉心火養腎陰共相協和惟白朮苦甘而溫本生津消痰但燥膩橫中血燥乃不相宜用之須慎若其佐使丹參入心與包絡去瘀生新除煩熱一味功兼四物石斛甘淡入脾而除虛熱鹹平入腎而澀元氣益腎強陰能補虛癆桔梗入肺心胃開提氣血載運藥力陳皮入脾肺氣分調中快膈導滯消痰用為輔治自能調劑適中至於導向蓮子交水火而媾心腎安靖上下君相火邪益十二經脈血氣而藕節澀平茅根甘寒皆能止吐衄諸血合成此劑不寒不燥補脾而不傷腎益腎而不妨脾彼此相資而有益以視沾沾於滋陰降火補陰抑揚相去為何如耶附素問濁氣歸心辨訛讀素問至食氣入胃濁氣歸心淫精入脈節此濁氣歸心不得其解因思心者君主之官神明出焉如果濁氣歸心焉得虛靈不昧具衆理而應萬事者乎按此心字必因千百年相傳之書脾字訛為心字考靈樞陰陽清濁篇曰受谷者濁受氣者清又曰營者水穀之清氣也調和於五臟灑陳於六腑又曰陰清而陽濁又曰諸陰皆清足太陰獨受其濁夫腑為陰藏為陽既曰諸陰皆清則心之受清可知既曰足太陰獨受其濁則濁氣歸脾之外更無一臟再受其濁可知是濁氣歸脾經文無不印合竊以為一字之訛願以質之高明附考正古方權量說古方自靈素至千金外臺所集漢晉齊宋諸名方凡云一兩者以今之七分六釐准之一升者以今之六勺七抄准之古方權量皆起於律古律侖容一千二百八十秠黍千金論一撮者四刀圭也六十四黍為圭半之為一刀圭十撮為一勺勺即侖也兩侖為一合合為升字之誤一升共二千五百六十黍也李時珍沿兩勺為一合之誤更增十合為一升則誤以傳誤矣幸千金及外臺原文俱無此五字可證二百四十黍為一兩者千金云十黍為一銖圖翼謂十黍當作百黍非也六銖為一分四分為一兩十六兩為一斤此則神農之稱也寸匕者作匕正方一寸錢匕者以五銖錢為之皆抄散取不落為度古人用散藥以刀圭抄取之匕亦刀圭之意也一刀圭為三十二黍方寸匕者十刀圭也方一寸匕之實容三百二十黍准今一錢千金論錢匕者以大錢匕抄之若云半錢匕者則是一錢抄取半邊耳並用五銖錢也按五銖錢與開元錢徑同一錢匕者五分六釐也半錢匕者准今一分四釐也一撮者以三指為度千金論一撮者四刀圭也得一百二十八黍准今四分凡丸藥如梧子大者准藥末一分如彈丸及雞子黃者准藥末一錢千金論刀圭者十分方寸匕之一准如梧子大也如彈丸及雞子黃者以十梧子大准之宋林億以古三兩為今一兩古三升為今一升龐安常亦云然此誤以漢之權墨為憑者於古方不相涉也故張介賓惑於鄭世子之樂書定為古方一兩今之六錢古之一升今之三合三勺者尤為大謬李時珍云古方一兩今之一錢古方一升今之二合半亦非也夫以藥稱藥斤農軒創造之法物孫真人祖述其意定千金方首今依四分為一兩為定亦不依隋人以三兩為一兩之法其述古藥斤制度中即曰今人分藥不復用此繼此有王刺史者輯外臺祕要每方必紀其所出凡六朝所定四分升合皆兢兢法守間有大升大兩必分別具明今良方具在顧權量難求棄若辨髦強作解事者從而式斷之而醫宗之微旨勢不至墮於地不止觀東垣方藥味多而分量輕又宋時一切作煮散者每服皆以五錢為例可知仍不貴多也蓋慎之也近世醫者任意重用為能反以輕劑為膽小殊不知重用而獲濟者幸也其或不濟而致害者罪何能逭也此皆不深考究以窮其理也仁人志士顧如是乎
