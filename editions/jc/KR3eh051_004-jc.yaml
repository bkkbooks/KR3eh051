body:
  text: 卷四內傷虛損失血經旨經曰黃帝曰何謂血岐伯曰中焦受氣取汁變化而赤谷入於胃脈道乃行水入於經其血乃成營者五穀之精氣也調和於五臟灑陳於六腑乃能入於脈也故循脈上下貫五臟經六腑也血為營營於內目得血而能視足得血而能步掌得血而能握指得血而能攝血脫者色白夭然不澤心主身之血脈諸血者皆生於心人臥血歸於肝肝藏血血有餘則怒不足則恐孫絡外溢則經有留血氣血以升陰陽相傾氣亂於衛血逆於經氣血離居一實一虛血並於陰氣並於陽故為驚狂血並於陽氣並於陰故為熱中血並於上氣並於下心惋善怒血並於下氣並於上亂而喜忘血氣者喜溫而惡寒寒則泣不能流溫則消而去之氣之所併為血虛血之所併為氣虛帝曰血併為虛氣併為虛是無實乎岐伯曰有者為實無者為虛故氣並則無血血並則無氣今血與氣相失故為虛焉絡之與孫脈俱輸於經血與氣並故為實焉血之與氣並走於上則為大厥厥則暴死氣復反則生不反則死血脈和則精乃居營衛者精氣也血者神氣也故奪血者無汗奪汗者無血故人有兩死而無兩生卒然多食飲而腸滿起居不節用力過度則絡脈傷陽絡傷則血外溢血外溢則衄血陰絡傷則血內溢血內溢則後血不遠熱則熱至血溢血泄之病生矣陽氣者大怒則形氣絕而血菀於上其人薄厥怒則氣逆甚則嘔血及飧泄故氣上矣脾移熱於肝則為驚衄胞移熱於膀胱則為癃溺血脈實血實脈虛血虛此其常也反此者病脈盛血少所謂反也脈少血多所謂反也谷入多而氣少者得之有所脫血濕居下也脈小血多者飲中熱也脈大血少者脈有風氣水漿不入此之謂也臂多青脈曰脫血安臥脈盛謂之脫血悲哀太甚則胞絡絕陽氣內動發則心下崩數溲血也腎足少陰也是動則病飢不欲食咳唾則有血喝而喘少陰所謂咳則有血者陽脈傷也陽氣走盛於上而脈滿則咳故血見於鼻也陽明厥逆喘咳身熱善驚衄嘔血陽明司天咳不止而血出者死結陰者便血一升再結二升三結三升婦人之生有餘於氣不足於血以其數脫也夫人之常數太陽常多血少氣陽明常多氣多血少陰常多氣少血太陰常多血少氣此天之常數也月事不來者胞脈閉也胞脈屬心而絡於胞中今氣上迫肺心氣不得下通故月事不來也咸走血血病無多食鹹陽病發於血目久視傷血苦走血血病無食苦凡太陽太陰少陽少陰司天在泉之年皆有見血等症凡血逆行難治順行易治無潮熱者輕有潮熱者重潮盛脈大者死九竅出血身熱不得臥者死凡血症陽盛則身熱多渴陰盛則身涼不渴身涼易愈如心肺血破血若湧泉口鼻俱出者不治淫而形脫身熱色夭然白反後下血血丕血衄篤重是為逆血溢上行或唾或嘔或吐皆凶也若變而下行為惡痢者順也上行為逆其治難下行為順其治易故仲景云蓄血症下血者當自愈若無病之人忽然下血痢者其病進無故忽然泄下惡血名曰心絕為難治傷寒太陽症衄血者病欲愈熱結膀胱而血自下者亦欲愈鼻頭黑白者亡血也蓄血為瘀血積蓄也血蓄上焦則善忘血蓄中焦胸滿身黃漱水不欲咽血蓄下焦則發狂糞黑小腹硬痛蓄血外症痰嘔燥渴昏憒迷忘常喜湯水漱口凡病日輕夜重便是瘀血發狂喜漱水而不欲下咽內傷虛損失血脈法經云脈得諸澀濡弱為亡血諸症失血皆見芤脈脈貴沉細浮大難治芤為失血澀為少血吐血之脈必大而芤大為發熱芤為失血衄血不止脈大者逆脈至而搏血衄身熱者死腹脹便血脈大時絕者死若吐衄血脈當沉細反浮大而牢者死失血而脈實者難治吐衄血脈滑數者難治諸失血症脈大且數者殆安臥脈盛謂之脫血失血脈數大為陽盛澀細為少血細數為陰火鬱於陰中芤為失血血虛氣不歸附也弦緊脅痛為瘀結諸血皆屬於肝也脈來寸口大尺內微為肺中伏火尺中盛則寸口虛大為腎虛陰火尺滑而疾為血虛有熱右手虛大為脾胃之火左手數盛為肝膽之火大抵失血脈微弱細而和緩易治洪數實大弦急或雖小按之如引葛如循刀及衄血身熱脈至而搏嘔血胸滿引背脈小而疾者皆不治肺脈搏堅而長當病少血心脈微澀為血溢肺脈微急為寒熱怠惰咳嘔血肺脈微滑為上下出血澀甚為嘔血肝脈大甚為內癰善嘔血脾脈微澀為痰多下膿血腎脈微澀為不月血泄者脈急血無所行也秋脈不及則令人喘呼吸少氣而咳上氣見血下聞病音衄而不止是為逆咳且溲血脫肉其脈小勁或搏是為逆身熱脈大者難治身涼脈靜者易治六脈弦細而澀按之空虛其色必白而夭然不澤者脫血也內傷虛損失血症治萬物生成之道惟陰與陽人有陰陽即為血氣陽主氣故氣全則神旺陰主血故血盛則神強人之初生必從精始血即精之屬也但精藏於腎所蘊不多而血富於沖所至皆是蓋其源源而來生化於心總統於脾藏受於肝宣布於肺施泄於腎灌溉一身無所不及也是以人有此形惟賴此血故血衰則形萎血敗則形壞而百骸表裡之屬凡血虧之處則必隨所在而各見偏廢之病倘至血脫則形何以立氣何以歸亡陰亡陽其危一也然血化於氣而成於陰陽虛固不能生血所以血宜溫而不宜寒陽亢則最能傷陰所以血宜靜而不宜動苟能察其精義而得養營之道又何血病之足慮哉血本陰精不宜動也動則為病血主營氣不宜損也損則為病蓋動者多由於火火盛則逼血妄行損者多由於氣氣傷則血無以存故有以七情而傷氣者有以勞倦色欲而動火者有以色欲勞倦而傷陰者或外邪不解而熱鬱於經或縱飲不節而火動於胃或中氣虛寒則不能收攝而注陷於下或陰盛格陽則火不歸源而泛溢於上是故妄行於上則見於七竅流注於下則出乎二陰或壅瘀於經絡則發為癰疽膿血或鬱結於腸臟則留為血塊血症或乘風熱則為斑為疹或滯陰寒則為痛為痹此皆血病之症也若七情勞倦不知節潛消暗爍不知養生意本虧而耗傷弗覺則為營氣之羸形體之弊此以真陰不足亦無非血病也故凡治血者當察虛實是固然也若實中有虛則於疼痛處有不宜於攻擊者此似實非實也熱中有寒則於火症中有速宜溫補者此似熱非熱也夫正者正治誰不得而知之反者反治則吾未見有知之者矧反症甚多不可置之忽略也失血於口者有咽喉之異蓋上焦出納之門戶惟咽與喉為胃之上竅故由於咽者必出於胃喉為肺之上竅故由於喉者必出於肺而肺總五臟之清道咽連於胃而實統六腑之濁道此其出入於肺者人之病在五臟而不知出於胃者亦多由於五臟也何也內經曰五臟者皆稟氣於胃胃者五臟之本而五臟之病獨不及於胃乎古人云嘔血者出於胃豈知亦由乎臟也蓋凡胃火盛而大吐者此本家之病無待言也至若怒則氣逆甚則嘔血者亦必出於胃脘此氣逆在肝木邪乘胃而然也又如欲火上炎甚則嘔血者亦出於胃脘此火發源泉陰邪乘胃而然也由此觀之則凡五志之火皆能及胃但咳而出者必出於喉出於喉者當察五臟嘔咯而出者必出於咽出於咽者五臟六腑皆能及之且胃為水穀之海故為多氣多血之腑而實為衝任血海之源故凡血枯經閉者當求生血之源源在胃也而嘔血吐血者當求動血之源源在臟也於此不明濟者鮮矣失血一發頗多咳嗽生痰上氣面青少澤其脈肝部獨傷原於忿怒之火無疑合色脈詳諦總是陰血不足也夫脈之充也色之華也皆氣與血之為也以脫血故致令氣亦脫每每上升胸膈喘促脹悶不利於言語行持誠欲氣不上升無過於血日滋長暗將浮游之氣攝入不息之中乃為良治然胸膈肺胃頑痰膠固似乎痰不亟除則無生血之法惟先以微陽藥開其痰繼以純陰峻投生其血久久血生而氣反血室如浪子歸家轉能興家所藉以驅膠結之痰者即此氣也庶幾痰去氣存而病自痊耳然飲食最宜致慎不特肥甘生痰厚味傷陰已也人身自平旦至日中行陽二十五度飲食易化自日中至夜分行陰二十五度飲食不消故易成痰故賢人常以秋冬養陰法天地之收藏況乎血欲不再脫尤貴退藏於密而厥陰肝木受病其憔悴之色見於三時者猶可諉之病色至春月發榮之時更何諉耶春月之榮不自春月始也始於秋冬收藏之固設冬月水臟所儲者少春月木即欲發榮其如泉竭不足以溉苞稂何故失此不治至春病危殆始圖之則萬無及矣人身血為陰男子不足於陰故以血為寶是以失血之症陰虛多致發熱面色多致枯黑肌肉多致消瘦彼嗜酒之人飲醇傷胃胃為水穀之海多氣多血平素水穀充養之精華以漸內虧而不外覺也胃脈從頭至足本下行也以嘔血之故逆而上行則呼吸之音必至喘急矣胃之氣傳入大小腸膀胱等處亦本下行也以屢嘔血之故上逆而不下達則腸腹之間必致痛悶矣胃氣上奔嘔逆橫決則胸中之氣必亂至緊逼痛楚則亂之甚矣胸中含有限之氣無處可容勢必攻入於背以背為胸之府也至於肩髃骨空鑽如刀刺則入之深矣故一胃而分三脘胃中既亂氣血混矣胃之上為膈其心煩多怒者正內經所謂血並於膈之上氣並於膈之下致然氣血倒矣所以內經又言血並於陽氣並於陰乃為熱中病者之嗜飲為熱積胃中而或嘔血者必以醉飽入房而得之蓋人身氣動則血動而媾精之時其血大動精者血之所化灌輸原不止胃之一經獨此一經所動之血為醉飽之餘所阻不能與他之血緝續於不息之途是以開此脫血一竇而竟成熟路矣然不惟胃之經也胃之大絡貫膈絡肺不辨其絡亦孰知膈間緊迸肺間氣脹痰膠為胃病之所傳哉失血診其脾脈大而空腎脈小而亂肺脈沉而伏此患在亡陰經云暴病非陽久病非陰失血數年其為陽盛陰虛無疑況食減而血不生漸至肌削而血日槁虛者益虛盛者益盛勢必陰火大熾上炎而傷肺金咳嗽生痰清肅下行之令盡壅由是腎水無母氣以生不足以蔭養百骸肢體瘦損每申酉時灑淅惡寒轉而熱至天明微汗始退也吐血者營氣溢入濁道留聚膈間滿則吐血名曰內衄然先哲皆以為熱其因於寒者理亦有之何則寒邪屬陰營血亦屬陰風傷衛寒傷營各從其類人果身受寒邪口傷寒物即入血分郁遏內熱無從發泄血乃沸騰在上則從口而出在下則從便而出若此者實病機之所有也但其血色之黑與吐血因熱極而反兼水化者相似茲則宜於脈症間求之脈微遲而身清涼者寒也洪數而身煩熱者熱也寒則溫之熱則清之治法大不同矣若吐血發渴者名為血渴宜四物湯十全大補湯凡古方純用補氣不入血藥何也蓋陽統乎陰血隨乎氣有形之血不能速生無形之氣所當急固也凡失血後發熱名曰血虛發熱古方用當歸補血湯黃耆一兩當歸四錢名為補血而以黃耆為君陽旺能生陰血也血之來也雖火以迫之然此火宜導以歸源則血亦歸經切忌寒涼則反激浮火上逆且傷胃氣脾愈不能統血矣更宜養肝使肝平而血有所歸切忌伐肝蓋肝為將軍之官而主藏血吐血者肝失其職也若再伐之則無力攝血收藏而血愈不止也更宜行血不宜止血蓋吐血者氣逆上壅而血不行經絡行血則血循經不止自止耳若勉強止之則瘀血凝滯胸脅脹滿發熱惡食反成痼疾況血生化於脾而脾又統血倘不調理脾胃為主而概用四物純陰傷胃徒增其病矣故失血諸症每以胃藥收功褚氏云血雖陰而運藥之其陽和乎觀時珍發明藥性謂童便性溫不寒飲之入胃隨脾之氣上歸於肺下運水道而入膀胱乃其舊路故能治肺病引火下行其味鹹而走血故治血病但當乘熱即飲則真氣尚存其行自速冷則惟有鹹寒之性而已彼用苦寒以為滋陰降火者曷弗思之甚也凡治血症前後調理須按三經用藥以心主血脾統血肝藏血而歸脾湯一方三經之主劑也遠志棗仁補肝以生心火茯神龍眼補心以生脾土參耆朮草補脾以固肺氣木香者香先入脾總欲使血歸於脾故以歸脾湯名有郁傷脾思慮傷脾者尤宜火旺者加山梔丹皮火衰者加丹皮肉桂又有八味丸以培先天之根治無餘法矣夫血病而用血藥亦必兼氣藥為主經曰無陽則陰無以生血血脫者益氣為血不自生必得陽和之藥乃生陽生則陰長也若單用血藥血無由而生反有傷犯中州之患矣東垣云人參甘溫補肺氣肺氣旺則四臟之氣皆旺精自生而形自盛也自王好古節齋之論出而天下皆以人參為虛勞毒藥殊不知肺家本有火右脈必大而有力東垣所謂鬱熱在肺者誠當勿用若肺虛而虛火乘之肺已被病非人參何以救之古方治肺寒以溫肺湯肺熱以清肺湯中滿以分消湯血虛以養營湯皆用人參自內經以至諸賢諄諄言之以氣藥有生血之功血藥無益氣之理可謂深切著明人亦奈何不察耶虛損吐血傷其陰也故或吐或衄所不能免但其火盛而載血逆上其脈症之間自有熱症可據急則治標不得不暫用清涼瀉之若陰虛而兼微火則當養血而不可過用寒涼若無實火而全屬傷陰則陰虛水虧血由傷動此宜純甘養陰之品以靜制動以和治傷使陰氣安靜得養則血自歸經矣若血而兼嗽者陰虛連肺也因勞役而動血者心脾腎三陰受傷也若陰虛於下格陽於上六脈無根而大吐大衄者此火不歸源真陰失守而然惟因思慮勞倦過傷者多有此症也若因勞倦而素易嘔泄者多有脾不攝血也若大吐大衄而六脈細脫手足厥逆危在頃刻而血不止者速用止血也若血脫至盛氣亦隨之因是厥逆昏憒者速當益氣也倘用寒涼則殆矣總之失血必其陰分大傷使非加意元氣培養真陰而或用寒涼則其陰氣益損血雖得止而病必日敗矣凡失血無論衄血出於經咳血出於心嗽血出於肺吐血出於胃咯血出於腎嘔血出於肝唾血出於脾但以色紫黑者為瘀積久血色鮮紅者為暴寒新血色淡青者為氣虛挾痰總屬炎火沸騰故治血以降火下行為首務不可驟用酸寒收斂使瘀積發熱轉增上炎之勢先用瑞金丹次用童真丸引血與火下行最速若血色甚赤吐出即凝剔起成片如柿皮者此守藏之血因真陰受損而脫雖能食倍常必驟脫而死若吐淡紅如肉如肺者謂之咳白血此肺腎並傷雖淹歲月亦終不救也內經論風寒暑濕燥火六氣之變皆能失血若不察其所因概與寒涼折之變乃生矣服寒涼後症雖大減脈反加數者陽郁也宜升宜補倘執迷不省復用寒涼者必死而後已七情妄動形體疲勞陽火相迫致血妄行脈洪多熱口乾便澀宜行涼藥若使虛氣挾寒陰陽不相為守血亦妄動必有虛冷之狀所謂陽虛陰必走也更驗其血之色必瘀晦不稠非若火盛迫血妄行之色濃厚紫赤也宜理中湯加肉桂收攝之因氣而發者加香附烏藥或飲食傷胃亦主吐衄加香附楂曲勞嗽吐血上熱下寒四味鹿茸丸選用之久病虛勞失血血枯發熱及女人經閉血竭者宜四烏賊骨一藘茹丸或四物換生地加桃仁虻蟲為丸服吐血成升斗者花蕊石散然必陽虛不能制陰氣暴逆者為宜若氣虛血隨火湧者誤用必殆宜十灰散若胃脘蓄血者吐血多而久不止者並宜獨參湯主之氣虛有熱保元湯加童便藕汁即有血亦無礙一切失血或血虛煩渴燥熱不寧五心煩熱宜聖愈湯血症既久古人多以胃藥收功異功散加丹皮山藥澤瀉咳嗽更加萎蕤此虛家神劑也凡治血症須知其要而動血之由惟火與氣耳故察其有火無火氣虛氣實而得其所以則治血之法無餘義矣凡憂慮過度損傷心脾以致吐血咯血其症當見氣短氣怯形色憔悴或胸懷鬱怒食飲無味或腹雖覺飢而不欲食神魂驚困而臥不安若素多勞倦思慮或善嘔吐或常泄瀉而致吐血下血者是皆脾虛不能攝血非火證也治當培其中氣切不可用清寒等藥格陽失血之症多因色欲勞傷過度以致真陽失守於陰分則無根之火浮泛於上多見上熱下寒或頰紅面赤或喘促躁煩而失血不止但其六脈細微四肢厥逆或小水清利大便不實者此格陽虛火證也治當引火歸源若用寒涼陽絕則死矣凡所吐之血色黑而黯必停積失位之血非由火逼而動也或面白息微脈見緩弱身體清涼者此必脾腎氣虛不能攝血而然若用寒涼必致殆矣暑氣逼心火毒刑金多令人吐衄失血然暑熱傷心又能傷氣證必脈虛氣弱體倦息微若但知為熱而過用寒涼則氣必愈傷而害斯甚矣凡血逆上焦紫黑成塊或痛或悶結聚不散者惟宜行散大都治血之法多忌辛散恐其動血也惟此留滯之血不妨用之或韭汁亦善行瘀也吐血不能止者惟飲童便最妙或搗側柏葉汁以童便二分酒一分和而飲之大能止血凡鼻口見血多由陽盛陰虛二火逼血而妄行也蓋血隨氣上有升無降惟宜補陰抑陽則火清氣降而血自靜矣凡火盛逼血妄行者或上或下必有火脈火症可據乃可以清火為先若以假火作真火則害不旋踵矣凡氣逆於上則血隨氣亂而錯經妄行此必有氣逆喘滿或脅痛脹或尺寸弦緊等症脈則當以順氣為先氣順則血自寧也其或實中有虛則消耗斷不可用矣若火不盛氣不逆而血動不止者乃其元氣受損營氣失守病在本根而然經曰起居不節用力過度則絡脈傷陽絡傷則血外溢血外溢則吐衄陰絡傷則血內溢血內溢則後血此二言最得損傷失血之源故凡治損傷無火無氣而失血不止者不宜妄用寒涼以伐生氣又不宜妄用辛燥以動陽氣而治此之法但宜純甘至靜之品培之養之則營氣自將寧謐不待治血而自安矣且今人以勞傷而病者多屬此症若不救根本終致敗亡矣失血之症凡見喘滿咳嗽及左右胸脅間有隱隱脹痛者病在肺也若胸膈膻中間覺有牽痛如縷如絲或懊憹嘈雜有不可名狀者病在心主包絡也若胸腹膨脹不知飢飽飲食無味多嘔沫者病在脾也若脅肋牽痛或躁擾喘急不寧往來寒熱者病在肝也若氣短似喘聲啞不出骨蒸盜汗動氣怔忡者病在腎也若大嘔大吐煩渴頭痛大熱不得臥者病在胃也於此而察其兼症則病有不止一臟者皆可參合以辨之也吐血之病在偶有所傷而根本未搖者但隨其所傷宜清則清宜養則養隨藥可愈無足慮也惟積勞積虛以致元氣太虛真陰失守乃為危證凡患此者非加意慎重而徒恃藥力以求活則誠難矣凡成盆無聲為吐或咯而出血屑甚咯而出帶紅絲為咯血因勞損而氣虛脈靜或微弦無力既非火證又非氣逆而血妄行者此真陰內損絡脈受傷而然惟用甘醇補陰培養絡脈俟營氣漸固而血自安也此證最忌寒涼吐血咯血凡兼口渴咽痛躁煩喜冷脈滑便實小便赤熱等證此水不濟火陰虛陽盛而然治當滋陰壯水而大忌辛溫也吐血全由火盛逼血上行而根本多傷宜察其火之微甚而治之若胃火熱甚而煩渴頭痛氣壅或兼便結腹脹者治當瀉火若兼陰虛水虧則宜慎之也吐血而傾盆盈碗或鮮散中兼帶紫黑大塊吐後不即凝結蓋血出於胃以其雜水穀也皆勞力內傷中氣而得亦有醉飽接內而致者治法不可驟止亦不宜峻攻只宜清理胃氣以安其血若血色瘀晦如汙泥為陽不致陰宜花蕊石散溫以散之吐血初起脈洪數者屬外因須用參蘇飲加當歸茯苓蓋茯苓能守五臟真陰瀉腎中伏火去脾胃中濕數劑後脈數退而洪不退者用六味地黃加沉香以納氣歸源若洪退弱極用異功散以補脾生肺慎不可用寒涼耳吐血脈洪大弦長按之有力上膈壅熱胸似滿痛精神不倦或血似紫黑塊者用荊芥丹皮當歸阿膠酒大黃桃仁泥之屬從大便導之不知此而用四物湯加芩連知柏行之使氣血俱傷脾胃俱敗百無一生也若飲酒過多傷胃吐血四君子加香砂甘葛因食太過不能消化煩悶強嘔因傷胃吐血腹中絞痛自汗其脈緊而數者難治枳實理中湯加丹皮扁豆灰勞心太過吐血不止歸脾湯去木香加麥冬阿膠有時吐血兩日隨即無事數日又發經年累月不愈者小烏沉湯送黑神散不時常服吐甚不止者柏葉乾薑等分加艾葉少許入童便服暴吐血新止後用燕窩冰糖各四錢同煮服之五七日永不發吐血發渴名血渴十全大補湯生脈散加乾葛量胃氣虛實用之吐血脈微細為順洪大為逆血若暴湧如潮喉中汩汩不止脈見虛大此火勢未斂急以熱童便或藕汁服之俟半日許脈勢稍緩可進調養之藥倘寸關雖弱而尺中微弦為陰虛須防午後陰火上升上午宜獨參保元以統其血下午與六味丸加童便以濟其陰服後脈漸調和飲食漸進肢體輕爽面色不赤足膝不冷身不灼熱額無冷汗溲便如常雖有紫黑血塊時欲咯出而無鮮血上行尚屬可治若血雖止而脈大不減或雖小而弦細數疾或弦硬不和勿輕許為可治亦有他部柔和而左關尺弦強者為陰虛火旺最為危兆其變有三一則陰火引血復上而暴脫一則虛陽發露而發熱一則火上逼肺而喘咳此終不救也諸失血後倦怠昏憒面色憔悴懶於言語宜獨參湯加陳皮所謂脫血益氣也失血後頭昏發熱此虛火上炎外擾之故不可誤認外感婦人倒行血溢於上蒸熱咳嗽不已及男子精未完而御女而成虛勞失血並宜烏骨雞丸選順丸選用之若血色晦淡不鮮無論上吐下失但當用溫熱之劑如甘草乾薑溫理中氣切忌寒涼若至血丕血血水則難已矣血脫用人參益氣以固氣血惟血色鮮明或略見紫塊者宜之若見晦淡者為血寒而不得歸經須兼炮黑乾薑溫之尺部脈弦用生料六味加肉桂引之亦有用肉桂為末和獨參湯服者若血色如珠光亮如漆吐出即干以指甲剔之成片而起者雖能食不倦後必暴脫而死若血中見似肉似肺如爛魚腸此胃中脂膜為邪火所爍凝結而成方書咸謂必死然吐後凝結既去而不發熱能進飲食今服小劑異功保元大劑六味都氣多有得生者不可盡委之不救也嘔血成碗而有聲怒氣傷肝動肝火則火載上行動肝氣則氣逆血奔所以皆能嘔血肝火盛者必有煩熱脈證肝氣逆者必有胸脅痛滿等症但凡肝氣為邪每多侮土故常致脾胃受傷及營血失守而脈虛神困治宜理其中氣勿謂始因怒氣而專意伐肝也然血從腹脅而上大嘔而出本肝火內旺鼓激胃中之血上湧也而症治猶有三焉一或暴怒火逆傷肝其症胸脅痛甚則厥逆柴胡疏肝散加酒大黃亦或極勞奔馳傷肝其症遍身疼痛或時發熱犀角地黃湯加當歸肉桂桃仁泥亦或竭力房勞傷肝其症面赤足冷煩躁口渴生脈散加減八味丸若陽衰不能內守而嘔者異功散研服八味丸然不戒房室思慮勞役終不救也唾血者平時津唾中有鮮血或如絲或浮散者此屬思慮傷脾脾虛不統血也有兼心兼胃兼腎之不同兼心加味歸脾湯兼腎六味丸加肉桂兼胃四君子湯加黃耆山藥粟米名七珍散食少溲清者異功散加扁豆灰胃中痰食不清吐血加半夏生薑即白扁豆散咳血者因咳嗽而見血或乾咳或痰中見紅絲血點一兩口氣急喘促此雖肺體自燥亦為火逆咳傷血膜而血隨痰出也其脈微弱平緩易治弦數緊實氣促聲嘶咽痛者不治得此症者若能靜養庶有生理治宜清金壯水為主咳血久而成癆或勞成而咳血肌肉消瘦四肢倦怠五心煩熱咽乾頰赤心中潮熱盜汗減食異功散加阿膠或四君子加鱉甲麥冬黃耆五味陰虛火動而咳血或痰中有血星如珠者生料六味丸加茜草根烏賊骨童便咳血不止至夜發熱吐痰或帶血絲者六味丸加蛤粉童便臨臥服咳唾膿血咳即胸中隱隱痛脈反滑數或數實者此為肺癰也咯血者不嗽而喉中咯出小塊或血點是也其症最重而其勢甚微常咯兩三口即止蓋緣房勞傷腎陰火載血而上亦有兼痰而出者腎虛水泛為痰也陰虛多火黑瘦之人最忌犯此初起宜清手足少陽厥陰諸經遊散之火後以六味丸加牛膝滋補腎陰以安其血不可用攻血藥也滑伯仁曰咯血為病最重以肺金為陰火所制水虧火旺逼而上行逆之甚矣經謂上氣見血下聞病音言喘出於腎而咯出於肺也宜用生料六味丸加麥冬五味下靈砂丹治之然多有兼於風寒飲食而發者若兼風寒則人迎緊盛或見弦緊宜黃耆建中湯不可誤認本病而與前藥亦不可妄用他藥也溲血經云胞移熱於膀胱則癃濁可知溺血之由無不本諸熱者多欲之人腎陰虧損下焦結熱血隨溺出脈必洪數無力治當壯水以制陽光溺血不止牛膝一味煎熬不時服之有氣虛不能攝血者玉屑膏最妙方用人參黃耆等分為末以白萊菔切片蜜炙不時蘸食之豈非虛火宜補宜緩之意歟惟痛屬火盛謂之血淋不痛屬虛謂之溲血二者不可不辨溲血先與導赤散加茯苓作湯服若不效此屬陰虛五苓散加膠艾下四味鹿茸丸小便自利後有血數點者五苓散加桃仁赤芍暴病脈滑實者大黃滑石甘草延胡索下之元氣大虛而挾虛熱所下如砂而色紅有如血淋之痛神砂妙香散加澤瀉病久滑脫者去黃耆山藥桔梗木香加煅飛龍骨益智仁即王荊公妙香散虛寒以此湯合四味鹿茸丸老人溲血多是陰虛亦有過服助陽而致者多難治惟大劑六味丸加紫菀茸作湯服咳血溲血形脫脈小勁而搏逆也溲血日久形色枯萎癃閉如淋二便引痛喘急虛眩行步不能者與死為鄰矣下血血之在身有陰有陽陽者順氣而行循流脈中調和五臟灑陳六腑如是者謂之營血也陰者居於絡脈專守臟腑滋養神氣濡潤筋骨若是臟感內外之邪傷則循經之陽血至其傷處為邪氣所阻漏泄經外或居絡之陰血因蓄留之邪擗裂而出則皆滲入腸胃而泄矣世俗每見下血率以腸風名之不知風乃六淫中之一耳或有風從腸胃經脈而入客者或外淫風木之邪內乘於腸胃者則可謂之腸風若其他不因風邪而腸胃受火熱之淫與寒燥濕怫鬱其氣及飲食不節用力過度傷其陰絡之血者亦謂之腸風可乎蓋腸風所下之血清而色鮮四射如濺乃風性使然素問所謂久風入中則為腸風飧泄是也先與瀉青丸一二劑後與逍遙散加酒煮黃連羌活烏梅虛人人參胃風散最提人所不知若肛門射血如線或點滴不已者乃五痔之血當詳本門治之血濁而色黯者為臟毒蘊積毒氣久而始見也宜小烏沉湯下黑神散脈實便秘勢盛者臟連丸腸風挾濕毒者下如豆汁兼紫黑瘀血此醇酒厚味所釀由足陽明隨經入胃淫溢而下也脈細而有寒者升陽除濕防風湯脈數有熱者去二術加黃連當歸甘草腸風下血以劉寄奴草二兩芽茶一兩墨灰三粒為散分三服烏梅湯送下其血止後宜多服歸脾湯下血久而不已面色萎黃下元虛憊者四君子加黃耆歸芍下斷紅丸虛甚十全大補湯去茯苓加防風潔古云下血防風為上使黃連為中使地榆為下使陰結便血者厥陰肝血內結不得陽氣統運滲入腸間而下非謂陰寒內結也補中益氣倍黃耆加炮姜血枯大便燥結而下鮮紫血者此大腸燥結而下也一味槐角膠涼潤之又方真麻油衝入腐花空腹食之三日而愈腸風便血一味旱蓮花濃煎蔥白湯服立效又方劉寄奴半兩松蘿茶一錢烏梅肉一枚煎服效中蠱臟腑敗壞下血如雞肝如爛肉心腹絞痛者是也治用馬藺根末水服方寸匕匙即吐出蓄血夫人飲食起居失節皆能使血瘀滯不行也衄血者血蓄上焦犀角地黃湯心下手不可近者血蓄中焦桃核承氣湯臍腹下腫大便黑者血蓄下焦抵當湯丸下瘀血湯代抵當湯血如泉湧不止者外用杏仁研細拌白麵水調塗之人有一時狂吐血必本於火然吐多火必為虛況血去無血養身又用泄火重傷胃氣無論血不驟生氣亦不轉必致氣脫而亡法禁止血當活血不僅活血急固氣蓋氣固則已失之血漸生未失之血再旺用固氣生血湯若吐血久者不可服人有久吐血未止或半月或一月一吐或三月數次或經年一次雖咳嗽吐痰不已委困殊甚此肝腎病也吐血未必皆肝腎病然吐久未有不傷肝腎者腎枯肝燥龍雷之火不安本宮下克脾胃脾胃虛寒火逆衝上肺金挾胃血沸騰隨口而出必腎肝肺三經統補為妙用三臺救命湯後以地黃丸服之人有吐黑血雖未傾盆痰咳必甚口渴思飲此腎經實火腎有虛無實蓋腎火又挾心包相火併起上衝耳腎火禁泄心包火亦禁泄乎然泄心包火必致傷腎惟肝為心包母泄肝則母虛而子弱矣用兩泄湯人有冒暑一時氣不及轉狂嘔血塊此暑邪犯胃必頭痛如破汗出如雨口大渴狂叫作虛治反劇宜清暑熱佐下降歸經藥則氣血自安用解暑止血湯人有痰中吐血絲日少夜多咳嗽不已多不能眠此腎火沖咽喉不歸命門故沸為痰上升心火又欺肺弱復來相刑故痰中見血絲用化絲湯此肺腎心三經兼治加去痰退火藥愈後用益陰地黃丸人有大怒吐血色紫氣逆兩脅脹滿作痛此因怒傷肝也蓋肝藏血怒則肝葉開張血即不藏肝氣急怒則更急血自難留故湧出往往有傾盆者血湧肝無所養自兩脅痛輕則脹滿急宜平肝少加清涼龍雷並收一味止血反拂火性動其嘔逆之機用平肝止血散人有咯血血不驟出先咳嗽覺喉下氣不能止必咯其血而後快此乃腎氣逆非肺逆也蓋腎氣者腎中虛火也虛火盛由於真水衰水衰則不能制火火逆衝上血宜大吐何以必咳而出蓋肺氣阻也肺乃腎母腎本有水火肺乃生水不生火而腎火上奪肺血肺不遽予故兩相牽而咯血用六味地黃湯加麥味滋水益肺以制火也人有咳嗽出血多因勞傷耗腎水水不能分給各臟又多房勞水益涸水涸金生已泄肺氣無如腎取給無已肺求救於胃胃受肝凌不暇生肺肝木生火心火太旺心旺必乘肺而腎水不能制火火凌肺愈甚故咳嗽吐血治宜救肺然救肺腎涸肺仍顧腎治須補腎腎足肝平心火息而肺安用麥冬熟地地骨皮丹皮白芥子人有鼻衄經年不止或愈或不愈此較葉血少輕然不治或不得法皆殺人吐血犯胃衄血犯肺胃濁道肺清道犯濁道五臟反復犯清道止肺逆然氣逆則一逆則變生宜調肺氣但肺逆成於肺火肺無火肺火仍是腎水肺因心逼腎水來救久之水涸腎火來助二火斗血從鼻上越則調氣舍調腎無他法調腎在補水制火用止衄湯人有耳出血涓涓不絕三日人斃此病少實有其症耳腎竅耳流血自是腎虛然血不走胃從口出乃從耳出心包火引之耳心包與命門火相通胃為心包子胃恐腎火害心兼害胃故引火上走於耳耳竅雖細原無沖決之處而涓涓不絕其能久乎用填竅止氛湯人有舌上出血不止舌必紅而爛裂紋中有紅痕血從痕出久亦必殺人此心火炎腎水不濟也邪水犯心則死真水養心則生故心腎似相剋實相生今水不交心欲求腎養而不得乃求救於舌下之廉泉然腎足廉泉亦足今腎水既不濟心又何能上升於唇口此廉泉欲自養方寸舌而不能又濟心乎故泉脈斷而井甃裂亦無濟於心並爛其舌舌爛必流血大補心腎使交濟舌血自斷用護舌丹人有齒縫出血如線摽此腎火沸騰也蓋齒屬腎齒若堅固無隙可乘然腎為本齒為末腎中龍雷之火直奔咽喉宜從口出何以入齒蓋腎火走任督上超唇齒乘隙而出火性急齒縫隙小故摽如線用六味地黃加味治人有臍中出血不多如水流出蓋臍通氣海關元命門烏可泄氣雖但血流日日如此氣必隨泄可不急治此大小腸火斗於腸中小腸火欲趨於大腸大腸火欲升於小腸兩不相受火乃無依上下莫泄直攻臍隙而出血即隨之似宜急安二腸火然火動腎枯無水潤也故治二腸火仍須治腎用兩止湯人有九竅出血氣息奄奄欲臥不欲見日頭暈身困此血熱妄行上走九竅症較狂血走一經反輕人身無非血九竅出血由近而遠非盡從臟腑出法仍治臟腑不可止治經絡以臟腑統經絡也用當歸補血湯加味治人有大便或前或後出血人謂糞前屬大腸火糞後屬小腸火其實皆大腸火腸本無血因大腸火燥干腸液腸薄開裂血從外滲入腸裂在上血來遲腸裂在下血來速非小腸出血也小腸出血人立死蓋小腸無血出血則心傷安能活乎宜單治大腸然腎主二便腎水無濟於大腸故火旺致便血用三地湯人有尿血痛澀馬口如刀刺人謂小腸火不知小腸出血人立死安得痛楚猶生此因不慎酒色欲泄不泄受驚而成精欲泄因驚縮入精已離宮不能仍返腎內小腸因驚不能直泄其水則水積火生熱極煎熬所留之精化血而出實本腎精非小便血也法宜解小腸火然不利水則水壅火仍不出用水火兩通湯人有毛孔出血或摽或滲如線或頭身或兩脛皆肝腎虧火乘隙越出舍補腎無二法然補腎功緩當急補氣氣旺肺自旺皮毛自固用肺腎兩益湯人有唾血止唾一口人謂似輕不知實重蓋唾出脾不出於胃也脾胃相表裡血犯胃後天已虧況更犯脾陰乎胃主受脾主消脾傷不能為胃化其津液雖糟粕已變但能化粗不能化精以轉輸於臟腑而皆困是脾唾甚於胃唾也然脾之所以唾仍責胃虛不特胃虛尤責水衰蓋胃為腎關門腎衰胃不能司開闔脾血上吐胃無約束任其越出故脾唾雖脾火沸騰實腎胃二火相助法平脾火必須補脾土補脾土以平脾火必須補腎水以止胃火用滋脾飲人有兩目流血甚直射出女經閉男口乾唇燥此腎中火動非丹血妄行也蓋腎相火也君火寧相火不敢上越於目惟君火衰心動嗜欲相火即挾君以令九竅心系通於目肝竅開於目肝命門心包同為相火同氣相助沸騰上走心肝之系竅法似宜補心以制腎火然心既虛補不易旺必補腎生心則心火不動腎火亦靜用助心丹人有舌上無故出血不止細觀有小孔摽血此心火上升克肺也鼻衄犯氣道舌衄止犯經絡之小者耳然血出於舌無異血出於口出於口犯胃不犯心出於舌犯心不犯胃胃腑心臟烏可忽視哉宜內補心液外填舌竅之孔心火自寧舌血易止用補液丹婦人有年未七七經先斷此為血閉乃心肝脾氣鬱也若血枯則必死也經水乃天一之水出腎經至陰精有至陽之氣故色紅似血非血以經水為血千古之誤果是血何不名血水古聖呼經水者以水出腎經名之也是經早斷必腎水衰涸何謂心肝脾氣鬱蓋腎水生雖不由三經而腎非肝氣相通腎氣不能開非心氣相交腎氣不能上非脾氣相養腎氣不能成一經鬱則氣不入腎腎氣即閉塞不通況三經同郁乎腎水足尚格格難出況腎氣原虛何以構精盈滿化經外泄此經閉似血枯耳必散三經鬱火補腎仍補三經氣則精隨經自通用溫正湯室女有月經不來腹大如娠面乍赤乍白脈乍大乍小此為鬼憑非血枯經閉也蓋心邪則鬼來或夢裡求親日中相狎或托戚屬貪歡或言仙子取樂久之精神僅供腹中邪邪旺正衰必經閉血枯欲導經邪據腹經難通欲生血邪引精血難長因成癆瘵至死不悟悲夫宜先去邪後補正用蕩邪丹下穢物後再用調正湯婦人有血崩雙目黑暗昏暈於地此非火盛動血乃虛火也世治血崩每用止澀然虛火不補易於衝擊必隨止隨發終不能愈須補中行止用固本止崩湯婦人年老血崩眼黑昏暈此不慎房帷也婦人七七天癸絕宜關閉不戰倘如少年浪戰必血室大開崩決而下用當歸補血湯加味治婦人受娠三月血崩胎墮此乃房事太過也蓋氣衰不奈久戰久戰泄精必多則氣又衰不能攝血況久戰虛火內動精門不關血室亦不關胎必不固內外齊動血又何能固自當補氣少佐止血用固氣湯婦人有交感雖不如血崩然涓涓不已未免氣血兩傷久必血枯經閉此因前月水來貪歡交戰精沖血管也血管不可精傷受孕乃血管已淨經來血正旺彼欲出精射之則血退縮既不受孕以成胎勢必聚精而化血交感淫氣觸動舊日之積兩氣相感精欲出血隨出須通胞氣引精外出益以填精補氣血管之傷可再補用引精止血湯此方實有調理曲折之妙故除舊疾然必慎房事三月則破者不重損補者不再傷慎之婦人有甚郁作渴嘔吐吞酸而血崩以火治或時效或不效此肝氣結也肝藏血氣結宜血結何反崩蓋肝性急氣結則更急急則血不藏法宜開鬱然不平肝則肝氣大開肝火更熾血何能止用平肝止血湯婦人每戰即如血崩人謂胞胎有傷觸即動血此乃子宮血海因熱不固也子宮在胞胎下血海在胞胎上血海衝脈也衝脈寒血虧衝脈熱血沸血崩正衝脈熱然衝脈熱何以交戰始血來蓋人未入房君相二火不動雖衝脈熱血不外泄及戰子宮大開君相火齊動以鼓精房血海泛溢不可止遏肝欲藏血而不能脾欲攝血而不得故經水隨交感而至必絕色三月用滋陰降火藥涼血海則終身之病可半載愈用清海丸喻嘉言曰虛勞病而至於亡血失精消耗津液枯槁四出難為力矣內經於針藥所莫制者調以甘藥金匱遵之而用小建中湯黃耆建中湯急建其中氣飲食增而津液旺以致充血生精而復其真陰之不足但用稼穡作甘之本味而酸鹹辛苦在所不用蓋舍此別無良法也又曰失血病有新久微甚無不本之於火然火有陰陽不同治法因之迥異經云暴病非陽則其為火也即非陽火甚明陽火者五行之火也可以五行之火折之惟夫龍雷之火潛伏陰中方其未動不知其為火也及其一發暴不可御以故載陰血而上溢故凡用涼血清火之藥未有不轉助其虐者大法惟宜溫補其陽以制陰火之僭經謂咯血者屬腎明乎陰火發於陰中其血咯之成塊而出不比咳嗽痰中帶血為陽火也此義從前未有發明惟仲景云誤發少陰汗動其經血者下厥上竭為難治下厥者陰氣逆於下也上竭者陰血竭於上也蓋氣與血兩相維附氣不得血則散而無統血不得氣則凝而不流故陰火動陰氣不得不上奔陰氣上奔而陰血不得不從之上溢而竭矣血既上溢其隨血之氣散於胸中不得復返於本位則下厥矣厥陰逆於下勢必龍雷之火應之血不盡竭不止也仲景所以為難治者非直不治也吾則以建脾中之陽氣為第一義是一舉而有三善一者脾中之陽氣旺而龍雷之火潛伏也一者脾中之陽氣旺而胸中窒塞如太空之不留纖翳也一者脾中之陽氣旺而飲食運化精微復生其已竭之血也今方書妄引久嗽成勞痰中見血之陽症不敢用健脾增咳為例不思咯血即有咳嗽不過氣逆氣下則不咳矣古方治龍雷之火每用桂附引火歸源之法然施之於暴血之症可暫不可常蓋已虧之血恐不能制其悍而未動之血恐不可滋之擾耳此宜崇土為先土厚則濁陰不升而血患自息也繆仲醇曰吐血有三訣宜行血不宜止血血不循經絡者氣逆上壅也行血則循經絡不止自止止之則血凝血凝則發熱惡食病日痼矣宜補肝不宜伐肝經曰五臟者藏精而不瀉者也肝主藏血吐血者肝失其職也養肝則肝氣平而血有所歸伐肝則肝虛不能藏血血愈不止矣宜降氣不能降火氣有餘便是火氣降則火降火降則氣不上矣血隨氣行無溢出上竅之患矣降火則必寒涼之劑反傷胃氣胃氣傷則脾不能統血血愈不能歸經矣今之醫者專用寒涼往往傷脾作泄以致不救或專用人參肺熱還傷肺咳嗽愈甚也亦有用參而愈者此是氣虛咳嗽氣屬陽不由陰虛火熾所致要亦百中之一二耳劉默生曰吐血一證人惟知氣逆血溢火升血泛不知血在臟腑另有隔膜隔定其血不能滲溢然隔膜極薄極脆凡有所傷則破破則血溢於上矣故有陽絡傷則血上溢陰絡傷則血下滲隔膜雖傷傷處有陰血凝定血來則緩若陰火驟衝破瘀積之血血來如潮之上湧自覺瀝瀝有聲彼時喘息不定面色如醉煩躁不寧心神昏亂一皆龍雷使然脈亦急疾難憑少傾火退神清面白氣平血亦漸止方可診切用藥此時不可驟壅亦不可用耗氣之藥能知此義治血有本矣按繆氏三訣而謂宜補肝不宜伐肝伐肝固不宜也補肝亦未為盡善惟養之和之則可也謂宜降氣不宜降火降火固不宜也降氣亦未可盡行惟調之順之則可也按內傷勞損而不致失血者蓋亦鮮矣夫血從上竅出者為上溢從二陰出者為下滲下滲為順上溢為逆理固然也然上溢者因火逼血而上逆要自有陽火陰火之分大抵由於六淫之邪氣多屬陽火而根於七情之逆氣即系陰火陰火者龍雷之火也相火也相火本主命門而寄於肝膽所以為乙癸同源故有龍火雷火之稱肝屬木居於東配震震為雷所以為雷火也命門之火居於水中龍藏海底動則火騰所以為龍火也故凡勞傷肝腎則相火無不煽動也相火煽動而陰分之血有不隨之而逆上者乎矧以房勞過度雖傷在腎而肝與諸臟亦與之俱損者矣是以內傷勞損之血溢原由陰火所迫而逆上其病至重至危也然則治勞損之血症豈可苟焉已哉嘗觀方書不曰滋陰降火則曰引火歸源夫泥於滋陰降火則恣用知柏歸地究致敗胃傷脾悶心泥膈欲止血而反耗血竟至百不一救此不知先哲垂戒諄切亦已久矣即在泥於引火歸源而遽用附子肉桂究致藥偏溫熱大能燥血欲息火而反激火亦竟十無一生此不知名賢機用靈活貴得當耳試觀內經所云精不足者補之以味針經所云調以甘藥明以脾胃為主務在崇培中土俾飲食增而津液旺以致生血化精而復其真陰之不足也善哉嘉言深會其旨謂用稼穡作甘之本味而酸鹹辛苦在所不用舍是別無良法誠得神聖之心傳為後世振聾覺憒者矣然不特此也即彼叔和景岳士材路玉亦何嘗不互相發明也哉要之古人制方原有加減自是圓通如四君四物六味八味建中補脾養營大補大造何一非以治虛損者然參耆補氣歸地補血白朮補脾桂附補火以及升柴之散芍藥之斂茯苓之滲用之不當詎不足以釀禍須知相其先後緩急輕重而權衡適合斯能有濟此所為用藥如用兵以予因病虛損而攻醫殫心數十年研求前賢治法誠見成方未可拘泥常體嘉言所發金匱之意創立方法不外補之以味調之以甘惟以培元養陰為務於扶脾保肺中微寓調氣泄水或煎或丸服之大有裨益於臟軀今幸年臻七十矣至其治內傷虛損濟人獲效亦難更僕數也即或萬難挽回亦未致令其生煩發喘少食作瀉而皆以善終此則生平所謂用藥無過者爾茲因詳述勞損失血之症治用附管見以質高明未知其果悉有當否內傷虛損宜耐醫說嘗觀先哲有言凡治虛損如奉魯哀朝惟導以法祖而已昔魯哀公問政孔子知公柔弱不能驟行王道並難成其霸業惟道以上法文武漸致振興以庶幾於安全已爾以此而喻虛損之調理洵為切當矣何則病至虛損血氣大虧陰陽不和孱弱之至勢甚危篤此時用藥攻之不可以輕攻補之亦難於驟補惟有溫養一法漬漸以培之調之庶有生理耳王節齋嘗言治此者輕則數十劑重則期以歲年慎柔思訓謂至調攝二三年方愈誠以虛損之培養必須日積月累以奏成功非若外感之可邀速效也嘗見病者多求速效不能堅心定志委任良工明明用藥適中毫無變症乃或以延久為嫌反疑其醫無奇功因而庸庸者流乘間抵隙以圖僥倖遂令更醫數四竟致戕賊斃命而後已殊不觀先哲有言用藥而病不增即是減何弗思受病之已深而歸咎於醫術之未至每至自誤而罔覺也良足惜哉內傷虛損宜重保養說嘗觀王節齋云人若色欲過度傷損精血必生陰虛火動之病睡中盜汗午後發熱咯咯咳嗽倦怠無力飲食少進甚則痰涎膠固咳血吐血衄血泄血脈息澀數肌肉消瘦此為勞瘵最難以治輕者用藥數十劑重者期以歲年然必病人惜命堅心定志絕房室息妄想戒惱怒節飲食以自培其根此謂內外交治庶可保全而張景岳亦云病者不善保養惟徒恃藥力以求活斯誠難矣觀二公之言如此不可知內傷虛損珍重保養非為第一切要者乎夫保養莫重於絕房室嘗見富貴子弟既由色欲致病猶不離房闥即或各移床第而究竟豔冶當前朝夕供奉恐或欲念一生而相火隨動雖不交合必有真精數點即時溜出此乃便為發泄則向之藥力仍歸烏有其陰精損益加損而不自覺也惟善保養則必退藏於密即病愈尚自珍惜矣保養莫要於節飲食不但肥甘生痰厚味傷陰之必戒即飢飽亦宜兢兢致意人身自平旦至日中行陽二十五度飲食易消不妨於飽自日中至夜分行陰二十五度飲食不消宜於微飢嘗見膏粱素慣至病更多嗜好藥之誤不敵飲食之誤應如桴鼓因口腹不慎而至傷殘比比然也惟善保養則必謹節所欲即終身不敢稍忽矣保養莫善於息妄想戒惱怒其為妄想也好名好利往往病篤而惓戀不忘因而憂愁抑鬱愈傷愈損莫可救藥此雖云有志究亦太愚至若淫於酒色迷於佚樂敝精竭神於冥索之中致令病終不起則又為愚之愚者矣其為惱怒也嘗見生長富貴之人一役使一供俸稍不如意輒至叱吒呼號逞忿傷懷毫無顧忌此皆由驕恣成性忘乎病之所由來致令愈傷愈損以及於危殆而不知悔矣惟善保養則必能養心養氣有畢生不忘者矣嗚呼內傷虛損人每不知保養而徒恃藥餌亦思草木之資果有回天之力也哉以予本因內傷虛損而習醫迄今年至七十雖常服藥並無峻補所堪自信者實在乎保養云爾且於閱歷中見夫病之死於不保養而生於善保養者亦云多矣故為是說以正告竊願人之知所保養以長享其年壽焉耳
