body:
  text: 自序維昔先嚴樂思公大人先慈曾太君晚年生予負體羸弱由童而冠而壯廿餘年間每患外感者十常二三患內傷者十常七八屢瀕於危均賴陳學周先生極力調救三旬外始安健而陳先生嘗勸勉習醫於是自補弟子員後輒殫心醫道上溯靈素奧旨遍及方書微言旁搜博採務窮其要而治己治人多歷年所似覺胸有把握差無貽誤爰舉先賢所言脈理於蒙晦處則汰之於明確處則錄之輯成醫學指要欲以明乎脈之要斯得其治之要爾嘉慶壬申荷陳觀察顧廬先生捐金倡助慫恿授梓鐫行有年矣洎由都梁署旋寓省暇日竊思醫之關鍵外感莫重於傷寒瘟疫而治不容混內傷莫重於虛勞失血而治不可苟乃復研求經旨脈理剖晰證治方法條分縷晰詳明其要輯成二編一為抉要一為集要洵為現身說法和盤托出務期觀者瞭然心目庶不致膠柱鼓瑟刻舟求劍而固執亦不至捕風捉影指鹿為馬而瞀亂又何致憾於草菅人命也哉丁丑冬承友人易麗昭等醵金玉成刊版惜以費資不敷只得刻就傷寒瘟疫抉要一帙而虛勞失血集要則仍藏之篋笥而已予今年及七十有二適獲諸友劉錫祺楊廣先鍾昌言蔡磻溪等利濟為懷欣然樂助付諸剞厥得與抉要合編俾內傷外感之間見予夙昔研究之苦心因總而顏之曰內傷集要並以質證於同人是又予生之厚幸也夫道光三年癸未歲仲夏月夏至前三日葵貽績乃庵氏自識凡例是書專明內傷述經旨究其蘊也晰脈理探其本也詳證治及方法明其用也總期醫之得其要耳學者詳玩之是書惟舉虛癆失血以闡其微雖為錯綜參伍究自條分縷析熟玩之則於治內傷無遺蘊矣是書言虛損夫血雖未分男婦若何究之婦人惟產有異其餘病證治法何嘗有異然不異而異異而不異會心不在遠耳是書本只明內傷虛損失血未及詳其雜證然雜證孰有重於此者矧能細心會通則凡雜證之治療自無不得其要矣是書凡脈要用記凡病症用記凡經絡用記觀者詳之
