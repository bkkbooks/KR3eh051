body:
  text: 卷三內傷虛損證治內傷始於熱中病似外感陽證頭痛大作氣高而喘身熱而煩上焦鼻息不調四肢困倦不收無氣以動或煩躁悶亂心煩不安或渴或不渴心火上炎克肺則渴血脈中有濕則不渴或表虛不任風寒目不欲開口不知味氣口脈大於人迎兩三倍但急大而時見一代此內顯脾氣不續之脈也宜補中益氣湯有宿食則右關獨沉而滑宜枳朮丸內傷未傳寒中病似外感陰證腹脹胃脘當臍痛四肢與兩脅拘急膈噎不通或涎唾或清涕或多溺足下痛不能任身履地骨乏無力兩丸多冷陰莖作痛或妄見鬼狀腰背肩髀脊膂皆痛不渴不瀉脈盛大以澀名曰寒中宜枳朮理中加桂附益智草蔻兼腎藏火衰面黑足寒小便不利者八味丸加鹿茸五味子內傷似外感陽明中熱證天氣大熱時勞役得病與陽明傷寒白虎湯證相似此脾胃太虛元氣不足之證肌熱燥悶煩渴引飲口鼻氣促目赤面紅壯熱晝夜不息脈大而虛重按全無經曰脈虛則血虛血虛則發熱誤服白虎必危宜當歸補血湯內傷似外感惡風寒證因勞役心苦腎中陰火沸騰後因脫衣或沐浴歇息於陰涼處其陰火不行還歸皮膚腠理極虛無陽被風與陰涼所遏以此表虛不任風寒與外感惡風寒相似其證少氣短促懶於言語困弱無力不可同外感治補中益氣湯加紫蘇羌活甚者加桂枝最當勞倦所傷虛中有寒脾胃虛弱不能運化致寒物冷痰膠固於中焦時時痞悶不覺飢飽其脈雖弦而按之不鼓當溫暖以助脾健運宜理中丸若臍下築者腎氣動也去朮加桂上多者氣上壅也下多者氣泄而下收也還用術悸者飲聚也加桂苓渴欲飲水者津液不足也倍用術腹中痛者倍人參寒者倍乾薑腹滿者去朮加附子勞倦所傷虛中有熱飢飽勞役損傷脾胃元氣不足之人其脈多弦或洪緩按之無力中時一澀其證身體沉重四肢困倦百節煩疼胸滿短氣膈噎不通心煩不安耳聾耳鳴目熱如火視物昏花口中沃沫飲食少味忽肥忽瘦怠惰嗜臥溺赤或清利而數上飲下便或時飧泄腹中虛痛不思飲食調中益氣湯如時顯熱燥是下元真火蒸蒸然發也加生地黃柏如大便虛坐不得或了而不了腹中常逼迫氣血虛澀也倍當歸飲食勞倦所傷腹脅滿悶短氣遇春則口淡無味遇夏雖熱猶有惡寒飢則常如飽不喜食冷物升陽順氣湯勞倦所傷寒溫不時身熱頭疼自汗惡寒脈微而弱黃耆建中湯飢飽勞役胃氣不足脾氣下溜氣短無力不時寒熱早飯後轉增昏悶須要眠睡怠惰嗜臥四肢不收懶於動作五心煩熱先服升陽補氣湯二三劑後服補中益氣湯辨內傷外感證內傷外感乃病之大關鍵於此昧焉何足云醫人迎脈大於氣口為外感氣口脈大於人迎為內傷外感則寒熱俱作而無間內傷則寒熱間作而不常外感惡寒雖近火不除內傷惡寒得暖則解外感惡風乃不禁一切風寒內傷惡風卻惡門隙中風外感顯證在鼻故鼻息不利而氣壅有力雖不能食而不惡食內傷顯證在口故口不知味而腹中不和怯弱妨食惡聞食氣外感則邪氣有餘發言壯厲先輕而後重內傷則元氣不足出言懶怯先重而後輕外感頭痛常常而痛多見於腦後額上以及遍身肢體腰脊筋骨攣痛內傷頭痛時作時止不離兩太陽額顱多兼肩背脅胸腰腿骨節痠痛外感則手背熱而手心不熱內傷則手心熱而手背不熱外感小便赤澀而痛終日難得內傷小便必短而煩外感便燥則發熱腹中硬痛內傷祕則虛坐或見些小白膿外感則腹絞痛而痛不可按內傷有時胃脘當心痛而上支兩脅外感則手足動搖煩擾不寧內傷則四肢不收倦怠嗜臥外感傳經入里則大渴內傷邪在血脈中故不渴間有渴亦不甚東垣辨法如此丹溪云內傷症皆以補元氣為主看所挾而兼用藥則引伸其意若顯外感症多者則外感重而內傷輕宜以發散為急然既兼內傷矣則發散中能無斟酌乎虛損之因有五勞七傷症分營衛臟腑然總之斯人賴以生者惟此精氣而病為虛損者亦惟此精氣氣虛者即陽虛也精虛者即陰虛也凡病有火盛水虧而見營衛燥津液枯者即陰虛之症也有水盛火虧而見臟腑寒脾胃敗者即陽虛之症也此惟陰陽偏困所以致然凡治此者但當培其不足不可伐其有餘惟是有似陽非陽似陰非陰者不可不詳察也且復有陰陽俱虛者則陽為有生之本而所重者又當在陽氣耳知乎此則虛損之治思過半矣陽虛者多寒非謂外來之寒但陽氣不足則寒生於中也若病見虛弱別無熱症者便是陽虛之候即當溫補元氣也蓋陽虛之候多得之憂愁思慮以傷神或勞役不節以傷力或色欲過度而氣隨精去或素稟元陽不足而寒涼致傷等證皆陽氣受損之所由也欲補陽氣惟甘溫而兼辛燥為宜萬勿兼清涼寒滑之品以殘此生髮之氣耳陰虛者多熱水不濟火而陰虛生熱也此病多得於酒色嗜欲或憤怒邪思流蕩狂勞以動五臟之火而先天元陽不足者尤多此候凡患虛損而多熱多燥不宜熱食者便是陰虛之候欲滋其陰惟宜甘溫而加醇靜之品凡陰中有火者大忌辛燥蓋恐陽旺則陰愈消熱增則水愈涸耳然又忌寒涼蓋苦劣之性斷非滋補之物且多傷胃也虛損夜熱或午後發熱或喜冷便實者此皆陰虛生熱水不制火也若火在心腎而驚悸失志者或外熱不已而內不甚熱則但宜補陰不可清火其有元氣不足而虛熱不已者則又當培其元氣也東垣云仲景論內傷不足發熱自汗之症認作有餘誤用表藥汗大出而表益虛也手足不和兩脅俱熱如火先少陽也從內而之外者為內傷傷食令人頭痛發熱脈數但左手和平身不疼痛是也人迎氣口俱緊盛或舉按皆實大發熱而惡寒腹不和而口渴此內外俱傷也中脘有痰令人增寒發熱惡風自汗寸口脈浮胸膈痞滿有類傷寒但頭不痛項不強為異耳虛煩與傷寒相似身熱脈不浮緊不惡寒不頭痛但熱而煩是也四肢發熱口舌咽乾煩躁悶亂者心與小腸之火乘脾土脾主四肢脾熱四肢發熱也經云陰虛則發熱夫陽在外為陰之衛陰在內為陽之守精神外馳嗜欲無節陰氣耗散陽無所附遂致浮散於肌表間而發熱也實非有熱當作陰虛治而施補養之法可也丹溪論晝夜發熱晝重夜輕口中無味為陽虛午後發熱夜半則止口中知味為陰虛至於或晝或夜或作或止不時而熱者此脾胃氣血俱虛火氣不寧之症不可拘於晝夜之候也陽虛則在胃陰虛則在腎蓋飢飽傷胃勞役則兼傷脾陽氣虛矣房勞傷腎竭力則傷肝陰血虛矣腎虛火不歸源遊行於外而發熱者煩渴引飲面目俱赤遍舌生刺兩唇黑裂喉間如煙火上衝足心似烙痰涎壅盛喘急氣促脈洪大數疾無倫按之微弱者是也法當導火歸源倘用寒涼必殆即或知其本虛而用補益不辨陰虛陽虛漫投參術則陽愈盛而陰愈虛壯熱轉增八味桂附之屬愈不敢施不得已而用知柏芩連折之必致燥渴咽痛腹痛泄瀉而死也潮熱有作有止如潮水之來不失其時若日三五發者即是發熱非潮熱也惟傷寒日晡發熱乃胃實別無虛證其餘有潮熱者當審其虛實若大便堅澀喜冷畏熱心下愊然睡臥不著此皆氣盛所謂實而潮熱也若胃氣消乏精神憔悴飲食減少日漸尪羸病雖暫退而五心常有餘熱此屬虛證有每遇夜身發微熱病人不覺早起動作無事飲食如常既無別症可疑只是血虛陰不濟陽也有潮熱似瘧胸膈痞塞背心疼痛氣弱脈弦服補藥不效者此屬飲證隨氣而潮故熱亦隨飲而潮於痰飲門求之氣口脈滑內有宿食常暮發熱明日復止者於傷食門求之經云陽虛則外寒奈何曰陽受氣於上焦以溫皮膚分肉之間今寒氣在外則上焦不通而寒氣獨留於外故寒栗惡寒者雖當夏月若遇風寒欲得重綿時覺懍懍戰栗如喪神守此熱伏於裡反覺自冷實非寒也仲景云心下有留飲其人背惡寒冷如冰指迷茯苓丸身前寒屬胃經曰胃足陽明之脈氣虛則身以前寒栗掌中寒者腹中寒魚上白肉有青血脈者胃中有寒理中丸表虛惡賊風上焦不通陽氣抑遏而皮膚分肉無以溫故寒栗升陽益胃開發上焦以升陽氣出外溫之也外感內傷傷食濕痰火鬱皆有惡寒非獨陽虛也若脈浮緊頭痛拘急身疼微惡寒熱起是外感審時令輕重發散之脈緩或氣口虛大按之無力兼見倦怠心下熱是內傷元氣證脈弦滑噁心頭痛飽悶溢酸是內傷宿食或脈澀伏腹滿煩熱喘促者是冷食結滯於內者也脈滑或沉周身冷痛而惡寒者屬痰濕乃痰在上焦遏絶陽氣而然肥人多此內虛里急惡寒少氣手足厥逆少腹攣急足脛疼此陽不足也背惡寒脈浮大而無力者為氣虛脈弦數寒熱兼作乃瘡腫之候大抵惡寒症除陽虛外屬表症者多也然惡寒而不發熱者亦多火鬱之症一概以陽虛為治則誤矣背惡寒瘀血內滯而頭汗目黃小便清利大便溏黑小腹偏左或左脅中脘有疼處脈必關尺弦緊或帶芤桃核承氣犀角地黃隨上下虛實清理之上熱下寒上寒下熱熱發於上陽中之陽邪也熱發於下陰中之陽邪也寒起於上陽中之陰邪寒起於下陰中之陰邪也脈經云陽乘陰者腰以下至足熱腰以上寒梔子豉湯吐以升之陰氣上爭心腹滿者死陰乘陽者腰以上至頭熱腰以下寒桂苓丸利以導之陽氣上爭得汗者生若雜上熱下寒既濟湯兼大便祕既濟解毒湯火不歸源八味丸上寒下熱五苓散送滋腎丸陽虛下陷者加減八味丸凡似損非損之症惟外感寒邪者乃有之蓋以外邪初感不為解散而誤作內傷或用清涼或用消導以致寒邪入腹久留不散而為寒熱往來或為潮熱咳嗽其症則全似勞損用治損之法以治之則滋陰等劑愈以留邪熱蒸既久非損成損矣然辨此者但當詳察表裡而審其致病之由若身有疼痛而微汗則熱退無汗則復熱或見火聲咳嗽脈雖弦緊而不甚數或兼和緩等象則雖病至一兩月而邪有不解病終不退者本非勞損無誤治也陰虛多火人偶感客邪其蒸熱咳嗽雖異平時然察其脈不能便顯浮緊之象但較平時必然稍旺慎勿輕用疏風散表以風藥性皆上升咳嗽咸非所宜亦不可妄與清肺止嗽轉傷胃氣為害不淺當此宜停補藥靜以養陰邪自退聽內本多火腠理必疏或啜熱湯稀粥汗氣隨通邪解散先哲有云陰虛火旺人元氣傷損雖有客邪切忌升發散表設不知此誤用風藥則風乘火勢火助風威以煽動其陰邪輕則虛揚擾亂不寧重則氣隨汗脫而斃蓋邪氣方張遏之愈逆不得已而用藥只宜小劑蔥白香豉以解散之若陰火原不大盛小建中黃耆建中亦無妨礙誤用保肺藥必咳嗽益甚即如建中湯稍加萎參細辛以搜散之俟其勢衰脈虛如六味合生脈去萸肉倍地黃人參加萎蕤大劑作湯晨夕兼進合標本而為施治服後咳嗽稍減蒸熱未除此陽虛不能斂制也加牛膝鱉甲以滋下源分先後而為處裁若飲食過傷者亦宜暫停補藥慎勿輕為消導戕伐其胃以招虛虛之謗耳虛勞不足汗出而悶脈結心悸行動如常不出百日危矣甘草湯主之婺婦師尼所欲未遂陰陽離絶鬱火亢極不得發泄而成失合證較之房勞更甚始則肝火鬱熱繼則龍火上煽致心肺受傷而喘嗽煩熱甚則迫血驟亡者有之經閉不行而吐衄者有之此症先宜開鬱降火後服滋養之藥若鬱火不泄血氣不榮而發癰疽者去生遠矣虛損咳嗽雖五臟皆有所病然專主則在肺腎蓋肺為金臟金之所畏者火也金之化邪者燥也燥則必癢癢則必嗽正以腎水不能制火所以剋金陰精不能化氣所以致燥故為咳嗽喘促咽痛喉啞等證治宜甘平至靜之劑資養金水使肺腎相生不受火制則真陰漸復而咳嗽愈矣人有終日咳嗽吐痰微喘少動短氣不足以息此乃肺氣自損也蓋肺主氣心火刑肺氣必損而形寒飲冷肺亦自損且臟腑雖各有氣要皆仰肺中清肅之氣分布今肺損自衛不足何能分布但雖不能分布而臟腑之取給自若是肺氣愈耗且肺為腎母腎水非肺氣不生肺不分布各臟忍見腎子渴死不救乎惟杯水難濟腎枯卒之子病母氣亦盡矣治宜大補肺而兼滋腎水也六味湯加麥冬五味人有目䀮䀮面無血色腳隱隱痛熱則吞酸寒則作嘔痰如臭涕或清或黃臭眥淚乾澀常欲合目睡臥不安多驚怖此肺勞傳肝也蓋肺本克肝肝旺則肺何能克無如腎勞久不生肝肺乘肝弱將蟲氣交之肝不能拒遂受其蟲氣而蟲氣久居腎腎欲生肝蟲隨以入之蟲蝕肝血肝又何養也治宜救腎生肝兼殺蟲也援瘵湯服三月全愈此不宜消痰逐穢以傷脾胃也人有咳嗽吐痰氣逆作喘臥更甚鼻口乾燥不聞香臭噁心欲吐肌膚枯燥時疼痛干皮如麩片起肺管內似蟲行此乃心癆傳肺也蓋肺嬌臟最噁心火克心正火刑肺尚有金實不鳴之症況尸蟲病氣移而刑肺乎然肺為腎母肺自能交腎腎之蟲氣何不交肺乎治宜消心中蟲氣尤須消腎中蟲氣要必健胃以分布津液庶心腎有益而胃無損蟲自得誅也健土殺蟲湯此補胃不助陽消腎不損液腎足制心心不刑肺實妙法也人有日日向火致汗出不止久則元氣大虛口渴引飲而發熱此乃肺受火傷也蓋肺金最畏火肺為外火所逼必致暗損氣內火又乘虛而爍之肺則虛而益虛也並不能生其腎水勢必皮膚不充而風邪易入矣治宜補肺滋腎倘徒祛風因傷益傷有不至成癆怯哉安肺湯甚效人有勤於功名勞瘁飢飽不時忽感風邪咳嗽身熱此乃內傷於肺也蓋肺主氣誦讀傷氣則肺虛肺虛則腠理亦虛邪自易入腎因肺虛而亦虛無力上灌邪氣往來於肺腎之間故身熱而咳嗽也治宜補肺氣亦兼補腎胃亦生肺亦必於胃中散邪而邪乃遁矣助功湯甚效人有終日捕魚時發熱畏寒此乃肺氣閉塞也蓋肺主氣氣旺則周流一身皮毛外衛邪不能侵惟肺虛氣尚停住身入水中遏抑皮毛虛氣難舒濕宜中之從皮毛而入使氣閉塞不通故畏寒而肺與濕相戰故身熱矣此熱乃肺虛不能敵邪非風邪入之而身熱也治宜補肺兼利水濕水自從膀胱出也利肺湯甚效人有勞心經營太過心火沸騰先則夜夢不安久則驚悸健忘心神憔悴血不華色此乃心血太虧也蓋心君宜靜不宜動靜則火不炎腎水自來相濟若動則腎與心氣兩不相交火升水降漠不相關也夫腎水得心火溫則生腎水得烈火熬則竭過勞火動腎畏之而不敢升水不升心愈躁且自焚而虛損必成不必外邪耗也五臟損至心而亡今心雖先損而諸臟腑不損則心有所取給猶有生機也治宜補脾腎肝肺氣以救心也衛主生氣湯甚效人有用心思慮太過精神恍惚懶言語忽忽若失腰腳沉重肢體困倦此乃心勞傷神也蓋心藏神神久安於心者心血旺也思慮無窮則心勞心勞則血沸血沸則漸耗血耗則神無所養故恍惚無定也治宜肝肺脾胃並培則扶助有資心神自旺而勞傷自愈矣定神湯甚效人有過喜大笑不止致唾干津燥口舌生瘡渴欲引水久之形槁心頭汗出此乃陽火上炎也蓋心屬火乃陽火腎屬水乃陰水陰水得陽火而爍干陽火須陰水以灌溉心火非腎水相交不能止炎上之性惟腎水有時不交心心中無液則必燥喜主心而喜極則心氣大開反傷乎心而津不上於唇口盡越於心頭之皮肉故腎津即化汗何能上濟於廉泉也治宜補心氣不必補腎水而廉泉自通矣通泉飲甚效人有盡情喜笑遂致感寒畏風口乾舌苦此乃內傷心包絡也蓋心包膻中也臣使之官喜樂出焉惟大笑不止則津干液燥而心包必盜心氣以自肥則心氣虛空邪自易入也治宜極補心心旺則心包亦旺其邪不易散乎倘用苦寒降火則大誤矣衛心湯效人有恐懼遂致感冒風寒畏寒作顫此乃內傷心膽也蓋過恐則膽氣寒過懼則心氣散膽寒則精移心喪則精耗精移精耗心膽愈虛邪乃易入也治宜急救膽氣膽不寒心亦不喪協力同心祛邪自易耳倘徒用祛邪則心膽之氣愈耗邪豈肯輕出乎加減小小柴胡湯甚效人有怔忡善忘口淡舌燥多汗發熱四肢厥軟小便白濁脈虛大而數此乃思慮過度所致也蓋心本君火也相火膻中火也膻中手厥陰經主熱古以厥陽名以其火不可遏也越人云憂愁思慮則傷心心氣傷心血自耗而心火不寧心包火必不安故有多汗發熱諸症矣治宜補心氣滋腎水使水上濟心火無亢炎也倘徒用寒涼則心氣益虛激動焦焚之害豈有底乎坎離兩補湯甚效人有動多氣惱遂致感觸風邪身熱胸脅脹此乃內傷肝經也蓋肝性急氣惱則肝葉開張氣愈急而不能順而逆作逆則氣不得舒而脹氣既不舒血亦不暢氣既不順血亦不能藏木鬱欲泄木乃生火火鬱欲宣火乃生風內外風動火焚風邪易入也治宜平肝經之風火而外之風火亦兼治也倘徒泄風火而不顧肝之氣血虛未及調養將風火雖散肝木仍燥怒氣終不能解豈盡善哉風火兩濟湯甚效人有懷抱素郁忽感風寒身熱咳嗽吐痰不已此乃肝氣不舒也蓋肝木喜條達憂鬱則肝氣結塞必生火故感風寒則風火相合而熱熾所以作熱且肝反凌肺肺必與肝相戰而肺畏火刑呼救腎子咳嗽生矣胃來援肺津液上升又為肝中風火所耗變痰涎矣治宜舒肝鬱則火息而風尤易散也加味逍遙散甚效人有動則大怒兩脅脹滿頭痛面熱胸膈脹痛此乃肝血損也蓋肝得血以藏之則性不急惟肝血不藏則肝無血養而肝氣不舒遂易怒是肝氣藏肝血必外越肝血藏肝氣必外疏肝氣泄肝血內生肝血泄肝氣內郁二者相反而相成也易怒者血欲藏不得藏氣欲泄不得泄也治宜補肝血使之藏平肝氣使之泄也加味逍遙散甚效人有血虛面無色澤肌肉焦枯大腸乾燥怔忡健忘飲食少思羸弱不堪夜熱無汗此乃肝燥生火也蓋肝屬木木中火盛每自焚然肝生火由於腎水不足木無水潤則木變為火非失血吐於內即耗血燥於外也治宜補腎水以滋肝木耳滋肝飲甚效人有抑鬱不伸致兩脅脹悶食減顏色沮喪肢瘦形凋畏寒熱此乃肝氣不足下克脾胃也蓋肝木喜飛揚一遇風寒憂愁便鬱而不伸上不生心乃下侮脾胃而飲食難化何能分灌臟腑也治宜舒肝鬱而補脾胃也順適湯甚效人有胸前飽悶時不消化吐痰不已時溏泄肚腹疼脹空則雷鳴唇舌焦乾毛髮乾聳面黃而黑短氣難續便如黑汁痰似緑涕此乃肝勞傳脾也蓋肝癆傳脾本為不救但胃氣未絶尚有生機治宜助胃氣胃氣健則脾有援也二白散甚效人為僧尼寡婦未字女久離妾有欲不遂內火爍干陰水致血枯經斷潮熱夜熱盜汗鬼交飲食少思體倦肌削面黑此乃肝血癆瘵也蓋肝藏血肝火動則血不能藏而泄屢動屢泄血安得不枯此似宜泄肝火然可暫泄以止炎不可頻泄以損肝也治宜補腎滋肝兼開鬱也消欲湯效人有不食則飢食又飽悶吞酸溏泄面色萎黃吐痰不已此乃脾氣損也蓋脾為胃行傳化胃氣全藉脾氣運動胃化其精微不特脾益各臟腑皆受益矣今脾氣傷不能代胃行其傳化不特胃氣無主脾不得胃氣之化則脾亦損至脾胃損何能分津液以注臟腑也治宜大健胃兼補脾也益脾湯甚效人有飲食太過以致食不能化胸中飽悶久成痞滿似塊瘕非塊瘕惡食每飯不飽面黃體瘦此乃脾衰不化也蓋胃強則未食多思脾弱則已食難受人恃胃強不論精粗生冷未免損胃而胃傷未有脾不傷者但腎火旺則胃雖傷脾不能傷蓋腎火生脾而心包火生胃也此乃脾衰治宜補心包命門火也助火生土湯效人有終日貪臥致風寒襲之頭痛背疼發熱惡寒此乃內傷脾氣也蓋脾主四肢四肢倦怠欲睡脾不能運動也略睡亦足以養脾氣惟久於睡臥則脾氣不醒轉足傷氣因氣虛而思睡後因睡而傷氣則為虛虛安得不招外風乎治宜補脾以益氣也補中益氣湯效人有色白神法秋間發熱熱熾頭痛吐泄少食兩目喜閉不開喉啞昏昧不省粥飲俱礙手常捫著陰囊此乃勞倦傷脾也蓋人本陽和身勞則陽和之氣變為邪熱不必風襲而身始熱諸陽皆會於頭陽虛則清氣不升邪熱乘之作頭痛不必外風犯之而作頭痛清濁拂亂安得不吐泄人身之脈皆屬於目眼眶脾之所主脾傷不能養目所以閉不欲開脾絡連舌本散布舌下脾傷則舌絡失養此言語所以難也喉雖通於肺然脾虛肺氣先絶肺虛難司出入故致啞脾虛無氣以輸四臟故心之神明亦為之昏瞀也陰囊屬肝脾虛肝欲侵之故風火動而頻按其囊也治宜大健其脾斯風邪自消也補中益氣湯效人有忍飢腹空遇天氣時寒時熱致胸膈悶塞如結胸狀此乃內傷胃氣也蓋胃為水穀之海多氣多血然必受水穀氣血始旺今忍飢則胃無水穀而胃火沸騰乃遏抑不舒則胃氣消故天時不正之氣乘虛而入盤踞胃中因致悶塞治宜助胃則邪自退也倘拘於寒熱用熱祛寒用寒祛熱則胃氣虛而寒熱相戰胃何能堪也加味四君子湯效人有貪用飲食甚至難化之物過寒之味胸膈飽悶已而疼痛後至起噯吞酸見美味生嗔供苾芬意憎此乃胃氣損也蓋脾胃相為表裡然能入不能出者脾氣衰能出不能入者胃氣乏雖胃傷必損脾脾傷必損胃要必辨其何經使損者多獲其益則胃易開脾易健脾虛腎火寒胃虛心火冷故補脾必補腎火補胃必補心火今惡食乃不能食非不能受明是胃虛也治宜補心火則胃氣自開也加味六君子湯效人有貪飲成酒積脾氣損傷五更作泄久之飲食少思多嘔吐盜汗此乃脾胃虧也蓋酒從胃入宜傷胃但脾受之脾惡濕酒性正濕乃移於腎腎雖水臟藏精不藏濕酒氣熏蒸腎受酒毒仍傳於脾脾又不受遂傳大腸而出大腸惡酒濕而遄發下泄甚多亡陰也治宜先戒酒後解酒毒仍健脾益胃也消酒湯甚效小兒多食瓜果肥甘成疳身黃瘦毛豎膚焦此乃脾胃虛也蓋小兒脾胃本嬌恣食果物肥甘以傷之臟腑之氣不能運化勢必積滯而成疳成癆也治宜補脾胃氣也倘徒泄火降痰消食殺蟲反損真元必致危殆矣加味六君子湯效如蟲疳椒梅理中湯效人有憂思不已加飲食失節脾胃有傷面黑環唇尤甚如飢而見食則惡氣短促此乃陰陽相逆也蓋心肺居上焦行營衛而光澤於外肝腎居下焦養筋骨而強壯於內脾胃居中焦運化精微以灌注四臟脾胃傷四臟無所取資則俱病矣今憂思不已則脾胃氣結飲食不節則脾胃氣損必致陰氣上溢於陽中而黑色遂著於面矣而脾氣通於口而華於唇今腎侮土故黑色著於唇非陰陽相反而成逆乎是脾胃陰陽之氣虛治宜急救中土也和順湯甚效人有多食肥甘積久不化偶遇風邪便覺氣塞不通此乃傷食因而外感也蓋胃強則土能生金肺氣必旺食本助胃而多食則反傷胃胃氣虛肺亦必虛肺主皮毛不能外衛無怪風寒易襲也治宜內消食而外逐邪又不傷胃若徒治外感則非也人有傷感冒風寒咳嗽而臥不安此乃內傷於腎也蓋腎為肺子腎泄過多必取給於母然腎虛肺亦必虛肺氣不能充於皮毛故邪易入要知腎虛感邪最難愈以散邪藥不能直入腎經然邪不遽於腎仍在肺散肺邪仍補腎氣腎得益肺又無損斯善於散邪也治宜補腎更補肺使子母兩旺則反邪自遁矣倘徒用散邪則肺氣益虛腎又取資將內外盜肺氣是肺氣太傷不惟不生腎且反耗腎遂至成為癆瘵矣金水兩滋湯效人有終日思慮憂愁面黃體瘦忽感風寒此乃內傷脾腎也蓋脾胃為後天腎為先天最不宜病亦最易病天下無不思不愁之人但過於思慮則胃氣不升脾氣不降食積不化何能生津液以灌諸臟且思慮傷脾憂愁傷腎腎傷則水不灌肝肝無以養仍克脾胃憂思相合脾腎兩傷外邪尤易深入也治宜脾腎並補但須補土無妨水補水無礙土耳脾腎兩益丹效人有飢飽勞役損其津液口渴舌乾又感風寒頭痛發熱此為內傷於陰也蓋人身血足津液自潤血傷津液自少血少皮膚無養毛竅空虛故風寒易入然風入皮膚不能驟進經絡以陰虛陽未衰也陽與邪戰而發熱故頭痛治當補其陰血少佐祛風也倘用攻於補陽之中則陽旺陰消邪轉熾矣養陰辟邪丹效人有氣虛者氣息短促不足以息迥殊勞役氣急促者懶於言語飲食無味體倦此乃陽虛下陷也蓋人身之氣陽升陰降陽氣主升何以降由於內傷元氣也元氣藏關元中上通肺下通腎元氣不傷腎中真陽自升肺肺氣始旺得行清肅分布臟腑若元氣一傷不特真陽不能升且下陷至陰中而發熱此乃虛熱非實熱也是宜甘溫以退虛熱然非用升發以提下陷之陽則陽沉於陰氣不能舉雖補氣無益也治宜於補中提氣也加味補中益氣湯人有任情房戰初則鼓勇不輕泄精久則陽衰而易走泄後乃頻舉頻泄而骨軟筋麻飲食少而畏寒此乃腎中水火兩衰也蓋腎中無火水不生無水火難養久戰不泄命門火旺也頻泄者水去火亦去也過於泄精乃腎火不能藏也火不藏水始泄泄精不多正腎火不太動也火動極水泄極泄極火無以養水火更易動腎之損可知矣治宜大補腎水不可遽補火也六味地黃湯效人有夜臥常驚或多恐怖心煩不安氣吸吸欲盡浮夢時作盜汗不已食不知味口內生瘡胸中煩熱無力思眠唇如朱塗顴如脂抹手足心熱液燥津干此乃腎傳心心初受病也蓋心主寧靜邪不可侵邪侵則神必外越腎勞生蟲豈蟲亦傳心腎氣無日不交腎中蟲氣烏得不上交蟲氣交心心受其損矣治宜仍在腎必須殺蟲則心能救也起瘵至神湯效人有陰虛火動夜熱如火五更身涼汗時有時無骨髓蒸炎飲食漸少痰如白沫此乃腎水不能制火也蓋腎中水火必須兩平火有餘水不足也惟水足制火則腎既不熱骨髓內又何致熱也骨中熱骨外安得不熱骨中髓熱必耗骨外血骨外血熱必爍骨中髓矣治宜補腎水且涼骨髓以消骨外血熱也涼髓丹甚效人有恣欲傷精兩腿痠疼腰背拘急足弱遺精陰汗神倦飲食減少耳如聽風雨聲此乃傷腎而癆瘵初起也蓋房勞傷腎勢便成癆成癆必失血因而吐痰咳嗽夜熱盜汗畏寒畏熱似瘧非瘧飲食不思食亦不化見色動意思色降精鬼交夢遺於是寒熱不已骨髓中生癆蟲矣治宜補真陰固腎氣加殺蟲也救瘵湯甚效人有小便中溺砂石其色不一堅實如石投熱湯中不能即化又或閉塞溺孔中不下溺時疼痛欲死用盡力溺始出日稀夜數此乃腎火煎熬也蓋腎火盛由於腎水衰凡入房必泄精精泄水虧矣水虧後火未能遽息加之行役勞筋骨鴉片提真陽火且大動此腎火乃虛火又或沐浴涉水外水乘腎氣虛直入遏火火不能外散反閉守腎宮自熬腎水腎水本至陰水猶如海水海水得火可成鹽塊腎水得火必成石淋但腎原有水火而外水淡腎水咸腎火喜咸畏淡一遇淡水腎火遂結不伸乃行於膀胱煎熬鹹水成石治宜通腎氣利膀胱膀胱利腎火亦解腎火解砂石自化化石湯甚效人有多言傷氣咳嗽吐痰久則氣怯短氣嗜臥不思飲食骨節拘急痠疼夢遺滑精潮熱汗出腳膝無力此乃傷乎氣也蓋肺主氣傷氣傷肺也肺傷則金不生水腎無化源何以滋養臟腑乎此肺所以生熱也肺熱而清肅之令不行斯膀胱之氣不化脾胃亦失運化之機而土虧金益弱金弱水亦虛水難養肝則木燥水不濟心則火炎木燥侮土火炎克肺欲氣之旺可得乎氣衰則不能攝精精涸不能收汗汗出不能生力故以前諸症所由作也治宜補肺兼補脾胃也益肺丹甚效人有入房縱欲不知葆澀形體瘦削面色萎黃足軟膝細腿搖皮聚毛落不能任勞難起床蓐盜汗淋漓此乃因於損精也蓋陰精足者其人必壽治宜填精補髓也然泄精既多不特傷腎且傷脾脾傷而胃亦必傷是填精藥須合三經同治也開胃填精湯甚效人有勞倦中暑服香薷飲反虛火上炎面赤身熱六脈洪數無力此乃內傷中氣也蓋人正氣足暑邪不能犯今暑氣侵皆氣虛招之也夏月伏陰在內重寒相合反激虛火上炎此陰盛格陽之證也治宜補陽以退陰但驟用陽藥入至陰必扞格不入惟熱因寒用為妙也順陰湯甚效人有素虛忽感風寒遍身淫淫循行如蟲或從左腳腿起漸上至頭下行至腳自覺身癢有聲此乃內傷氣不足也蓋人氣行則血行惟氣血俱虛身欲作汗邪又留而不去兩相爭鬥拂抑其經絡皮血作癢不啻如蟲之行非真有蟲也傷寒汗多亡陽亦有蟲行證傷寒本外感至亡陽變為內傷矣今非傷寒而現蟲行證非內傷而何治宜大補氣血也加味補中益氣湯妙人有日夜呼盧鬥貝筋骨痛足重腹飢致冒風邪遍身痛發寒熱此乃內傷氣血也蓋呼盧則液干鬥貝則神瘁損傷氣血尤甚必至敗壞臟腑也治宜大補氣血而少加和解也倘徒治外感則正益虛邪益旺定成勞瘵矣加減十全大補湯效人有行役勞苦不休致筋拳不伸縮不弛臥床呻吟身疼痛肢痠麻此乃損筋也蓋筋屬肝損筋損肝也然腎足則肝旺腎虛則肝衰肝得腎滋枝葉條達筋自潤矣但心亦取給於腎而盜泄於肝也治宜心肝腎三經同補也養筋湯甚效人有久立腿痠立而行房足必無力久之面黃體瘦口臭肢熱盜汗骨蒸此乃傷其骨也蓋骨全賴乎髓無髓則骨空而傷骨亦能耗髓立而行房骨與髓兩傷矣然髓足者精必足腎水涸而精少不能化髓故骨空也治宜填精以充髓也倘用寒藥補腎熱藥助陽愈熬津液必成癆瘵矣充髓丹甚效人有好勇或赤身不顧血流不知致風入皮膚發寒熱頭疼脅痛此乃內傷筋骨也蓋筋屬肝骨屬腎肝足筋舒腎滿骨健是筋骨必得髓血之充人至鬥毆必怒怒則肝葉開張血多不藏而太耗肝血耗必取給於腎腎水供肝木火內焚又易乾燥腎滋肝不足又何能充潤於髓血髓兩虧筋安能舒骨安能健則風邪乘虛易入矣治宜補其血髓也加味四物湯效內傷傳尸勞瘵證治夫傳尸勞者男子自腎傳心心而肺肺而肝脾女子自心傳肺肺而肝肝而脾脾而腎五臟復傳六腑而死矣雖有諸候其實不離乎心陽腎陰也若明陰陽用藥可以起死回生黃遊論曰傳尸之候先從腎起初受之兩脛痠疼腰背拘急行立腳弱飲食減少兩耳颼颼直似風聲夜臥遺泄陰汗痿弱腎既受傷次傳於心夜臥心驚恐怖心懸懸氣吸吸欲盡夢見先亡有時盜汗飲食無味口內生瘡心氣煩熱惟欲眠臥朝輕夕重兩顴口唇悉皆紋赤有時手足五心煩熱心受已次傳於肺咳嗽上氣喘臥並甚鼻中乾燥不聞香臭如或忽聞惟覺臭腐有時噁心欲吐肌膚枯燥時復疼痛或似蟲行干皮細起狀如麩中肺受已次傳於肝兩目䀮䀮面無血色常欲皺眉視不能遠目常乾澀又時赤痛或復睛黃常欲閣眼及時睡臥不著肝受已次傳於脾兩脅虛脹雷鳴唇口焦乾或生瘡腫毛髮乾聳或時上氣撐肩喘息利赤黑汗見此證者乃不治也紫庭方云傳尸伏尸皆有蟲須用乳香薰病人之手乃仰手掌以帛覆其上熏良久手背上出毛長寸許白而黃者可治紅者甚難青黑者即死若熏良久無毛者即非其證屬尋常虛勞也又法燒安息香令煙出病人吸之嗽不止乃傳尸也不嗽非也按內傷勞損之病因於酒色者固多而因於思慮憂悶鬱結者亦不少治之原未可或誤也如酒傷肺則濕熱熏蒸肺陰消爍色欲傷腎則精室空虛相火無制思慮傷心則血耗而火亦上炎勞倦傷脾則熱生而內伐真陰惟忿怒傷肝者一為鬱怒則肝火內熾而灼血一為暴怒則肝火上升而逼血道經云涕唾津精血汗液七般靈物皆屬陰陰火內熱而勞瘵成矣其為病也在腎則為腰脊腿痠或攸隱而痛為骨蒸盜汗或至夜發熱為遍身骨痠或疼痛如折為夢遺泄精為耳中鳴足心熱在心則為驚悸怔忡為掌中灼熱或魘夢不寧為口苦舌乾或口舌糜爛在肺則為痰嗽乾咳為氣逆喘促為鼻中燥熱為顴紅吐衄甚則吐涎白沫側眠咽痛音啞聲嘶在肝則為寒熱如瘧為頭項瘰癧為脅脹肋痛為兩目澀痛為頭暈眼花為多怒為吐血在脾則為食減不化或噁心嘔吐為腹滿腹痛為腸鳴泄瀉肌膚消瘦此皆五臟虛勞之本症經曰治病必求其本須審因何而損何臟受傷如因於色者則知腎傷縱有他經現症亦當補腎為主而兼治他證因於酒者必當清肺為主此為正治然又當明其傳變如腎傳心心傳肺肺傳肝肝傳脾脾再傳腎此傳其所勝之臟侮而乘之謂之賊克大凶之兆經曰諸病以次相傳者死謂五臟以次相傳則克遍也難經曰七傳者死謂如病始於腎而脾復傳腎是謂六傳已盡不可再傳也又如腎病不傳心而傳肺此間一臟而傳於生我之母以母子氣通也如腎病不傳心肺而傳肝此間二臟而傳於己生之子以母及子也如腎病不傳心肺肝而傳脾此間三臟而傳己所不勝之臟經所謂輕而侮之也傳乘不明豈能療病虛勞一證方書皆以血虛氣虛陰虛陽虛混同論治而不知偏於陰虛者居多夫氣虛者面白無神言語輕微四肢無力脈來微弱陽虛者體冷畏寒手足逆冷溲清便溏脈沉小遲惟能服參耆溫補乃為受補可治也而其陰虛之誤治者可詳而指之一在乎誤認陽虛命門之火龍火也亦謂真陽如果腎中陰盛龍火不得安其位而為上焦假熱面赤煩躁口雖渴而不欲飲足冷過膝小便清長右尺脈沉小而遲或浮大無根此陰盛逼陽之假證宜用八味之屬冰冷與服以引火歸源也至若虛勞之症是因腎水真陰虛極水不濟火火因上炎而致面赤唇紅口鼻出血齒痛齒衄雖亦龍火上炎與虛陽上浮不同縱有下部虛寒足冷要因虛火上升所致非真陽衰而然故其小便必黃赤其脈必帶數有內熱的證可據設用引火歸源之法是抱薪救火上焦愈熱而咳喘燥渴益甚咽痛喉爛諸症至矣一在乎誤認中寒腹痛之屬於虛寒者水穀不化而澄徹清冷必有寒虛之脈可憑今人一見腹脹腹痛食不消化腸鳴泄瀉等症便誤認為虛寒而投理中溫燥之劑再補其陽則陽益亢而陰亦竭矣更有見其脹滿泄瀉遂引經文清氣在下則生飧泄濁氣在上則生䐜脹而用補中益氣反提陰氣上逆以致咳喘頻增吐衄交至而立見危亡也一在乎誤認外感世之真陰虛而發熱十之六七亦與外感無異火逆衝上則頭微脹痛火熱壅肺則時亦鼻塞陰虛陽陷入里則灑淅惡寒陰虛陽無所附則浮越肌表而熱但其發時必在午後先灑淅惡寒少頃發熱至寅卯時微汗而熱退或無惡寒而午後發熱必現腎虛之證或兼唇紅顴赤口渴煩躁六脈極數或虛數無力此宜大劑滋陰若誤作外感表之則魄汗淋漓諸虛蜂起有失血之人表亦無汗經所謂奪血者無汗也再強發之必然吐衄為下厥上竭之證此尤人多孟浪者也一在乎誤用苦寒瀉火實火為病可以直折虛火為病非寒可清非惟不能清熱抑且敗其胃氣食少泄多將何以救甚者見其燥結妄用硝黃不知腎主二便腎主五液腎液既虧自不濡潤滋其陰潤其燥而使自通彼既虧之陰豈能勝硝黃之攻伐乎一在乎誤用二陳攻痰痰在脾經為濕痰滑而易出若稀如清水為痰飲濕者燥之半夏自為正治若陰水不足肺受火傷津液凝濁不生血而生痰此當潤肺滋陰使上逆之火得反其宅痰自消矣二陳之燥立見其殆一在乎誤用參耆助火凡虛勞之可用參耆者肺必無熱也肺脈按之而虛必不見數故有土旺生金勿拘拘於保肺之說若其火已爍金而發咳火蒸津液而為濃痰君相亢甚而血隨上逆矣猶引陽生陰長虛火可補之言漫用參耆因之陽火愈旺金益受傷所以好古有肺熱還傷肺節齊有服參必死之叮嚀也至於血脫者益氣而用之則又不在此例矣此內傷虛損之所為難治也醫可不細審而明辨之哉按孫真人云補脾不如補腎許學士云補腎不如補脾兩先生深知二臟為生人之本而有相贊之功故其說似背而其旨實同也救腎者必本於陰血血主濡之血屬陰主下降虛則上升當斂而抑也理脾者必本乎陽氣氣主煦之氣屬陽主上升虛則下陷當升而舉之是內傷虛損之治補腎健脾法當並行經曰腎者主水受五臟六腑之精而藏之精藏於此氣化於此精即陰中之水也氣即陰中之火也故命門之水火為十二經之化源火不畏其衰水則畏其少所以保陰六味左歸之屬皆甘寒滋水添精之品補陰以配陽正王太僕所謂壯水之主以制陽光朱丹溪所謂滋其陰則火自降也則可知因於色者固當補腎矣而因於酒者清金潤燥為宜而保陰之屬仍不可廢蓋補北方正所以瀉南方而救肺也因於思慮者清心養血為宜而佐以保陰所謂壯水而火熄勿亟亟於清心是也因於勞倦者培補脾陰為宜而佐以保陰經曰有所遠行勞倦逢火熱而渴渴則陽氣內伐熱舍於腎故知勞倦傷脾內熱者必及於腎也若忿怒傷肝動血保陰六味丸為正治蓋水旺則龍火不炎雷火亦不發乃肝腎同治之法而脾胃為後天根本經曰安穀則昌蓋精生於穀飲食多自能生血化精雖有邪熱藥得以制之久則火自降而陰自復也若脾胃一弱則飲食少而血不生陰不能以配陽必五臟齊損故越人歸重脾胃而言一損損於肺皮聚而毛落二損損於心血脈不能榮養臟腑三損損於脾飲食不為肌膚四損損於肝筋緩不能自收持五損損於腎骨痿不能起於床從上而下者過於腎則不治至骨痿不能起於床者死從下而上者過於脾則不治至皮聚而毛落者死所以仲景治虛勞惟用甘藥建立中氣以生血化精一遵精不足者補之以味之旨也味非獨藥也補以味而節其勞則精貯漸富大命不傾而經云陰陽形氣俱不足者補之以甘藥故中氣不足者非甘藥不可況土強則金旺金旺則水充又男子以脾胃為生身之本女子以心脾為立命之根故治虛損當以調養脾胃為主耳然以甘寒補腎不利於脾辛溫扶脾愈妨於腎貴宜於補腎之中不脫扶脾補脾之中不忘滋腎斯為善也要以兩者並衡而較重脾土以脾土上交於心下交於腎故也若或腎火虛而勢危困者則於補水之中再補其火則不獨腎家之水火相濟而補脾之功亦寓於中矣是在人之神而明之已耳豫嘗深為內經精不足者補之以味與陰陽形氣俱不足者調以甘藥之旨酌取甘而不寒溫而不燥諸品合成方劑用治虛損漬漸與服頗多濟益也矣按內傷勞損病之至劇至危者也自內經難經明其根源脈證治法賴仲景金匱闡發其義始得以窺其微妙至東垣主於補中益氣丹溪主於滋陰降火究亦舉一節以立言非以概其全體也逮後喻嘉言深體金匱之旨誠得治虛損之良法耳而薛立齊張景嶽李士材諸公又何嘗非遵內典以著論施治也近世醫流未能融會貫通往往膠柱鼓瑟物而不化豫嘗見其治虛損也每執乎滋陰降火而奉知柏四物為神丹不知丹溪所以用之者為救其偏於扶陽之弊也彼不嘗用人參斤許以為治療乎其全書原自可考焉抑又有重用地黃為滋陰補腎者不知此惟景嶽用之但彼多有人參以相斡旋藉以固其元氣而鼓舞藥力不至有泥膈壞胃之愆今則無參可用安能重用地黃耶此皆不善讀書以明其理何漫以醫任而夭枉人命也哉然而補陽則又未可苟矣古方用桂附以補命門之真陽若虛損而至失血則辛熱之藥大非所宜故嘉言深契金匱建中之義惟在補脾中之陽氣而謂桂附之用恐已虧之血無能制其悍而未動之血不可滋之擾也試深繹其言惟用稼穡作甘之本味而酸鹹辛苦在所不用舍是別無良法則可知勞損而不失血成方有可專施勞損而至失血成方未可盡泥也豫所以於乾血勞證而不存金匱之大黃䗪蟲湯百勞丸以其過於峻劫未敢輕用勿令昧昧者之貽害無窮也謬為僭削仁人君子諒有以明其心者矣
