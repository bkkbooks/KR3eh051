body:
  text: 卷一內傷虛損經旨經曰帝曰願聞五虛五實岐伯曰脈盛皮熱腹脹前後不通悶瞀者謂五實脈細皮寒氣少泄利前後飲食不入者謂五虛帝曰其時有生者何也曰漿粥入胃泄注止則虛者活身汗得後利則實者活此其候也久視傷血久臥傷氣久坐傷肉久立傷骨久行傷筋邪之所湊其氣必虛陰虛者陽必湊之五臟主藏精者也不可傷傷則失守而陰虛陰虛則無氣無氣則死矣邪氣盛則實精氣奪則虛邪之所在皆為不足故上氣不足腦為之不滿耳為之苦鳴頭為之苦傾目為之眩中氣不足溲便為之變腸為之苦鳴下氣不足乃為痿厥心悗營氣虛則不仁衛氣虛則不用營衛俱虛則不仁且不用肉如故也人身與志不相有曰死得守者生失守者死得強者生失強者死言而微終日乃復言者此氣奪也氣海有餘者氣滿胸中悗息面赤氣海不足則氣少不足以言血海有餘則常想其身大怫然不知其所病血海不足亦常想其身小狹然不知其所病水穀之海有餘則腹滿水穀之海不足則飢不受穀食髓海有餘則輕徑多力自過其度髓海不足則腦轉耳鳴脛酸眩冒目無所見懈怠安臥下虛則厥上虛則眩三焦者並太陽之正入絡膀胱約下焦實則癃閉虛則遺溺陰陽不和則使液溢而下流於陰髓液皆減而下下過度則虛虛則腰背痛而股酸心藏神神有餘則笑不休神不足則悲肺藏氣氣有餘則喘咳上氣不足則息利少氣肝藏血血有餘則怒不足則恐脾藏肉形有餘則腹脹涇溲不利不足則四肢不用腎藏志志有餘則腹脹飧泄不足則厥內奪而厥則為喑痱此腎虛也精奪者耳聾氣脫者目不明津脫者腠理開汗大泄液奪者骨屬屈伸不利色夭腦髓消脛酸耳數鳴血脫者色白夭然不澤其脈空虛此其候也身熱如炭頸膺如格人迎躁盛喘息氣逆此有餘也有癃者一日數十溲此不足也太陰脈細微如發者此不足也今外得五有餘內得二不足此其身不表不里亦正死明矣帝曰何謂五奪岐伯曰形肉已奪是一奪也大奪血之後是二奪也大汗出之後是三奪也大泄之後是四奪也新産及大血之後是五奪也此皆不可寫肝虛則目䀮䀮無所見耳無所聞恐懼如人將捕之心虛則胸腹大脅下與腰相引而痛脾虛則腹滿腸鳴飧泄食不化肺虛則少氣不能報息耳聾嗌乾腎虛則胸中痛大腹小腹痛清厥意不樂氣之所並為血虛血之所並為氣虛有者為實無者為虛故氣並則無血血並則無氣今血與氣相失故為虛焉血之與氣並走於上則為大厥厥則暴死氣復反則生不反則死帝曰陰之生實奈何岐伯曰喜怒不節則陰氣上逆上逆則下盛下盛則陽氣走之故曰實矣帝曰陰之生虛奈何岐伯曰喜則氣下悲則氣消消則脈虛空因寒飲食寒氣熏滿則血泣氣去故曰虛矣陽虛則外寒陰虛則內熱氣實形實氣虛形虛此其常也反此者病谷盛氣盛谷虛氣虛此其常也反此者病脈實血實脈虛血虛此其常也反此者病氣虛者熱此謂反也谷入多而氣少此謂反也谷不入而氣多此謂反也脈盛血少此謂反也脈少血多此謂反也夫實者氣入也虛者氣出也氣實者熱也氣虛者寒也形氣不足病氣有餘是邪勝也急寫之形氣有餘病氣不足急補之形氣不足此陰陽俱不足也俱不足也不可刺之刺之則重不足重不足則陰陽俱竭血氣皆盡五臟空虛筋骨髓虧老者絶滅壯者不復矣形氣有餘病氣有餘此謂陰陽俱有餘也急寫其邪調其虛實故曰有餘者寫之不足者補之此之謂也智者之養生也必順四時而適寒暑和喜怒而安居處節陰陽而調剛柔如是則僻邪不至長生久視內傷虛損脈法經云平人脈大為勞極虛亦為勞氣虛則脈弦弦血虛則脈大凡脈虛細弱為勞脈弦而大弦則為減大則為芤減則為寒芤則為虛虛寒相搏此名為革婦人則半産漏下男子則亡血失精寸口脈微而澀微者衛氣衰澀者營氣不足衛氣衰面色黃營氣不足面色青營衛俱微則寒栗咳逆唾腥吐涎沫脈軟者為虛緩者為虛微者為虛弱者為虛弦者為中虛脈細而微者血氣俱虛脈小者血氣俱少脈大而芤者脫血血虛脈大如蔥管脈沉者遲者脫氣平脈弦大營損血虛大而無力陽衰易扶數而無力陰火難除寸弱上損浮大里枯尺寸俱微五勞之軀血羸左濡氣弱右虛左右微小氣血無餘男子久病氣口脈弱則死強則生女人久病人迎脈弱則死強則生虛勞之脈大抵多弦或浮大或數大者易治弦者難治若雙弦則為賊邪尤為難治如數極則殆寸口脈浮而遲浮則為虛遲則為勞凡診虛弱細數皆為不足陰陽俱虛之脈惟平旦見之日中則必洪數浮而大浮而弦者皆為火盛陰虛之脈暮多見之至數多而數者為至脈即陰虛勞症也至脈緩而無力屬氣虛數而無力屬血虛凡六部重手沉取損小輕手浮取實大謂之陽盛陰虛以寸尺論之陽主寸陰主尺寸浮者損小尺沉者實大謂之陰盛陽虛寸浮者實大尺沉者損小謂之陽盛陰虛脈浮屬陽沉屬陰陰虛則浮之洪大沉之空虛脈沉緩無力者陽虛脈多弦數者陰虛氣口脈大無力為中氣虛久病形肉俱脫客邪雖去元氣虧極故脈雖似和緩實無神也多不治久病脈沉細數者死脈結者三年死脈代者三月內死左手脈細右手浮大徑急為正虛邪盛必死脈細數骨蒸乾咳聲啞寒熱似瘧者死氣口大而虛者為內傷於氣氣口脈大而時顯一澀者為內傷於血氣口脈大而澀人迎及尺弦者為醉飽入房肝脾氣血俱傷人迎脈弦而數為瘀血氣口脈滑而實為宿食也內傷左脈常細而澀右脈多浮而大陽氣下陷不能生陰故血枯而左脈細澀脾胃虧損不能生金故氣虛而右脈浮大內傷寸口大於尺內此陽盛脈也男子平人脈大為勞極虛亦為勞脈浮者裡虛也脈虛浮弦為短氣目瞑衄血脈大者春夏劇秋冬瘥男子脈弱而澀者為無子精氣清冷虛弱微細者善盜汗出脈沉小遲者溏泄食不化脈虛芤遲及諸芤動微緊者男子失精女子夢交緊數之脈表裡俱虛緊為寒傷營數為血不足脈見短數則無胃氣細數緊數俱非吉象脈洪大按之虛者須防作泄凡見數脈難治病久脈數尤非所宜脈忽浮澀而數忽沉弱而緩變易不常虛火之故也虛損潮熱泄瀉脈短澀者不治虛損脈浮大者屬陽虛細數者屬陰虛芤為失血若兩手俱芤而中有一部猶弦者為有瘀蓄若見數大者為火旺必難治若見澀亦不可治弦數為骨蒸自上而下者必寸口浮數自下而上者必尺中弦急若關尺俱弦細而急者不治尺中弦強必因房室發熱若更犯房室明日反暫軟後日弦強必愈甚不可不察也氣口脈浮大按之反澀者有宿食也脈數而滑者有宿食也脈遲而滑者宿食作脹也氣口脈緊寒食停滯胃中也脈沉緊而細冷食停脾也兩手脈模糊不清此宿食積滯胃氣不行也脾不能鼓運胃不能熟腐故脈不滑而澀澀甚模糊不清若人迎緊盛而氣口滑者停食感冒也虛損之脈凡甚急甚數甚澀甚滑甚短甚長甚弦甚緊甚洪甚實者皆虛勞太甚然惟漸緩則有生意若弦甚病甚數甚病危若弦細而加緊數則百無一生脈芤為血虛沉遲而小為脫氣大而無力為陽虛數而無力為陰虛大而芤為脫血微細為盜汗寸弱而軟為上虛尺弱軟澀為下虛尺軟滑疾為血虛兩關沉細為胃虛脈來軟者為虛緩者為虛弱者為中虛細而微小氣血俱虛喻嘉言曰虛勞之脈為不足之候為精氣內奪也黃帝問何謂重虛岐伯對以脈氣上虛尺虛是謂重虛謂其上下皆虛也氣虛者言無常也尺虛者行步𠊓然謂其步履之不正也脈虛者不象陰也謂其脈全不似乎太陰脈之充盛也然以脈之無常從來謂是上焦陽氣虛故其脈無常果爾則下焦陰氣虛脈更無常矣觀下文云如此者滑則生澀則死澀脈且主死而寸脈之無常寧復有生理哉故氣虛者言無常也此一語明謂上氣之虛由胸中宗氣之虛故其動之應手者無常耳乃知無常之脈指左乳之動脈為言有常則宗氣不虛無常則宗氣大虛而上焦之氣始懨懨不足也後之論脈者但宗越人所述損脈而引伸觸類曰脈軟者為虛緩者為虛澀為虛芤為血虛弦為中虛脈細而微者氣血俱虛脈小者血氣俱少脈沉小遲者脫氣虛損之脈實未足以盡其底裡惟賴仲景云虛勞之脈多兼浮大前人所以謂男子平人脈大為勞極虛亦為勞又謂脈浮者裡虛又謂勞之為病其脈浮大手足煩春夏劇秋冬瘥男子脈浮弱而澀為無子脈得諸芤動微緊男子失精女人夢交脈極虛芤遲為消穀亡血失精脈虛弱細微者善盜汗而總括其義曰脈弦而大弦則為減大則為芤減則為寒芤則為虛虛寒相搏此名為革婦人則半産漏下男子則亡血失精可見浮大弦緊外象有餘其實中藏不足不專泥遲緩微弱一端以驗脈也內傷虛損病源經曰人之血氣精神者所以奉生而周於性命者也經脈者所以行血氣而營陰陽濡筋骨利關節者也衛氣者所以溫分肉充皮膚肥腠理司開闔者也志意者所以御精神收魂魄適寒溫和喜怒者也是故血和則經脈流行營覆陰陽筋骨徑強關節清利矣衛氣和則分肉解利皮膚調柔腠理致密矣志意和則精神專直魂魄不散悔怒不起五臟不受邪矣寒溫和則六腑化谷風痹不作經脈通利肢節得安矣此人之常平也五臟者所以藏精神血氣魂魄者也六腑者所以化水穀而行津液者也兩神相搏陰陽夫婦合而成形常先生身是謂精上焦開發宣五穀味熏膚充身澤毛若霧露之溉是謂氣腠理發泄汗出溱溱是謂津谷入氣滿淖澤注於骨骨屬屈伸泄澤補益腦髓皮膚潤澤是謂液中焦受氣取汁變化而赤是謂血壅遏營道約束也令無所避是謂脈夫人身中精乃臟腑之真非榮血之比故曰天癸氣為臟腑之大經為動靜之主故曰神機脈為天真委和之大氣經謂命之本氣之神形之道其機運升降皆隨氣而動因血而榮精氣資始相生不失為人之司命形質之體用也若精不足則氣失資化氣不足則血失所營血不足則氣無所附天真散亂而病生焉內經之論虛勞惟是氣血兩端蓋以人過於勞氣血受傷傷則五臟六腑氣血不足為虛虛甚而臟腑經絡有虧為損故勞有七情之傷而遂致五極之應勞傷乎肝者應乎筋極勞傷乎心者應乎脈極勞傷乎脾者應乎肉極勞傷乎肺者應乎氣極勞傷乎腎者應乎骨極毋論勞心勞力皆能損其精血而其房勞更甚者則以形與神俱勞而精與氣均損矣凡勞傷虛損五臟各有所主而惟心臟最多蓋心為君主之官一身生氣所繫而五臟之神皆稟於心故憂生於心者肺必應之憂之不已則陽氣日索營衛日消勞傷及肺弗亡弗已如經言嘗貴後賤之為脫營嘗富後貧之為失精暴樂暴苦始樂後苦皆傷精氣精氣竭耗形體毀沮蓋因脫勢而慮竭將來追窮已往故二陽並傷潛消暗爍於冥冥之中矣喜因欲遂而發似乎無傷而經曰喜傷心又曰暴喜傷陽又曰喜樂者神憚散而不藏又曰肺喜樂無極則傷魄魄傷則狂狂者意不存人皮革焦毛悴色夭死於夏蓋心藏神肺藏氣二陽藏也故暴喜過甚則傷陽而神氣因以耗散矣或縱喜無節則淫蕩流亡以致精氣疲竭不可救藥矣思本乎心經曰心怵惕思慮則傷神神傷則恐懼自失破䐃脫肉毛悴色夭死於冬然思生於心脾必應之故思之不已則勞傷在脾經曰思傷脾又曰思則心有所存神有所歸正氣留而不行故氣結矣脾氣結則為噎膈為嘔吐而飲食不能運飲食不運則血氣日消肌肉日削精神日減四肢不為用而生脹滿泄瀉等症矣然思本傷脾而憂亦傷脾經曰脾憂愁而不解則傷意意傷則悗亂四肢不舉毛悴色夭死於春蓋人之憂思本多兼用而心脾肺所以並傷故致損上焦陽氣而二陽之病發自心脾以漸成虛勞之病耳淫欲邪思又與憂思不同而損惟在腎蓋心耽欲念腎必應之凡君火動於上則相火應於下相火者水中之火也靜而守位則為陽氣動而無制則為龍雷而涸澤燎原無所不至故其為病則為遺淋帶濁而水液漸以乾枯炎上入肝則逼血妄行而為吐衄血或為營虛筋骨痠疼又上於脾則脾陰受傷或為發熱而飲食悉化痰涎再上至肺則皮毛無以扃固而亡陽喘嗽甚至音啞聲嘶是皆無根虛火陽不守舍而光焰滔天自下而上由腎至肺本原漸槁上實下虛是誠剝極之象也凡男婦失偶之輩雖非房室之勞而私情繫戀思想無窮而欲不遂則欲火搖心真陰日削遂至虛損不救凡五勞之中莫此為甚也七情傷腎恐亦居多蓋恐畏在心腎則受之故經曰恐傷腎又曰恐則精卻又曰恐懼而不解則傷精精傷則骨節痿厥精時自下或陽痿而終不能療或陰縮而遺尿然恐固傷腎經曰腎藏志盛怒而不止則傷志志傷則喜忘前言腰背不可以俯仰屈伸毛悴色夭死於季夏是怒本傷肝而腎亦受其害也怒生於心肝必應之故經曰怒傷肝又曰怒則氣逆甚則嘔血及飧泄故氣上矣蓋肝為陰中之陽藏故肝之為病如火因怒動而逼血妄行以致氣逆於上而脹滿喘急者此傷其陰也又或氣以怒傷而木鬱無伸以致侵脾氣陷而為脹痛嘔泄飲食不行者此傷其陽也然怒本傷肝而悲哀亦最傷肝經曰肝藏魂悲哀動中則傷魂魂傷則狂妄不精不精則不正當陰縮而攣筋兩脅不舉毛悴色夭死於秋蓋怒氣傷肝肝氣實也悲哀傷肝肝氣虛也但實不終實而虛則終虛虛必至於勞損也驚氣本以入心而實通於肝膽經曰驚則心無所依神無所歸慮無所定故氣亂矣又曰東方色青入通於肝其病發驚駭此所以驚能動心而尤能傷及肝膽心為君主固不可傷而膽以中正之官實少陽生氣所居故十二經陽剛之氣皆取決於膽若或損之則諸臟生氣皆同消索致敗其危立見若發驚畏日積或一時大驚致膽汁泄而通身發黃默默無言者皆不可救此臟腑勞傷虛損之源不可不察也夫勞倦不顧者多成虛損經曰陰虛生內熱有所勞倦形氣衰少穀氣不盛上焦不行下脘不通而胃氣熱熱氣熏胸中故內熱又曰喜怒不節起居不時有所勞倦皆損其氣氣衰則火旺火旺則乘脾土脾主四肢故胃熱無氣以動懶於言語動則喘乏表熱自汗心煩不安又曰勞則氣散氣短喘乏汗出內外皆熱故氣耗矣又曰飲食不節起居不時陰受之陰受之則入六腑身熱不時臥上為喘呼此可見過於勞倦必致脾胃氣虛而肝腎陰火得以乘其土位遂至氣高而喘身熱而煩其為虛損無不至矣夫以貧賤之子奔走食力終日營勞竟未有因勞生病者則以其作息有常無關榮辱初不至過勞其心而悴精敝神以致虛損耳惟膏粱柔脆之流而苦竭心力斯為害矣蓋或勞於名利而不知寒暑之傷形或勞以淫欲而不知旦暮之傷命或勞於遊蕩而忍飢受凍於呼盧博戲之場或勞於勇敢而角力逞強於爭競暴戾之地則一任強作妄為陰謀狡計皆致傷氣傷血傷精傷脈以及皮毛肌肉筋骨無不受傷所以臟腑虛損而勞瘵成矣夫色欲過度者多成勞損人身之真陰腎水也真陽相火也相火為龍雷之火居於水中晝則應施受於心夜則盡歸藏於腎過於房勞而宵歡縱欲致傷真陰水既虧而火必旺故有陰虛火動之症若火衝於上焦則必生寒熱而兼喘嗽痰血或至肺痿肺癰火結於下焦則必生寒熱而兼遺濁淋泄腹痛燥澀盜汗驚悸也人惟知百病生於心而不知百病生於腎腎水空虛不能平其心火心火縱炎傷其肺金是絶水之源金水並衰不能勝其肝木肝木發則克脾土火獨旺而不生化所以為壯火食氣耳夫人自有生以後惟賴精氣以為立命之本故精強神亦強神強必多壽精虛氣亦虛氣虛必多夭其有先天所稟原不甚厚者能知自珍而培以後天則無不獲壽設稟賦本薄而又恣情縱欲戕伐後天則必成虛損勞瘵也又有年未及冠壬水方生保養正在此時而無知孺子遽搖其精竟如苞萼未成而蜉蝣旦暮良足悲也獨異為父母者往往不明保生之道急欲為兒圖其婚育致令稚幼罔識利害以戕其生及病成勞瘵乃為之懇禱呼號悲戚誠何濟耶然不止此也近世愚昧無知研喪亡身固不足惜乃有富豪中文學才藝者流往往縱其淫欲昵娼狎頑藥餌丹石煙燻鴉片以助陽火煎熬陰精至死不已誠何心哉是太可憫也矣夫少年縱酒多成勞損酒本狂藥大損真陰雖少飲之未始無益而耽飲則受其害矣凡人之稟賦藏有陰陽而酒之質性亦有陰陽蓋酒成於釀其性則熱汁化於水其質則寒若以陰虛者縱之飲則質不足以滋陰而性偏動火故熱者愈熱而病為吐血衄血便血尿血喘嗽燥煩狂悸等症此酒性傷陰而然也若陽虛者縱之飲則性不足以扶陽而質流為水故寒者愈寒而病為膨脹泄瀉腹痛吞酸少食亡陽暴脫等症此酒質傷陽而然也故縱酒者既能傷陰尤能傷陽害有如此矧酒能亂性每致因酒妄為則凡傷精竭力動氣失機及遇病助欲等事無所不至而陰受其損多罔覺也酒之困人若此能勿慎乎夫病後誤治失於調理者多成勞損蓋病有虛實治有補瀉必補瀉得宜斯為上工惟醫不知邪正緩急每致伐人元氣敗人生機而隨藥隨斃者已無從訴或幸而得免而受其殘剝以致病後多成虛損而不能復振者比比然也至於失於調養或病初愈或輒縱欲以及寒暑不慎勞倦不節是乃自作之而自受之其又何尤焉顧常見富貴子弟素來放縱驕淫成性而病已及身延醫調治日服藥餌日食海參燕窩而究不知保養之道惟靜居密室起居不時喜怒無常不尋樂趣不順人情甚且少婦不離左右不知欲念一動即不交合必有真精泄出此必虛而益虛損之又損不自覺也故或服藥有濟病亦少安而未幾反復再三彼乃歸咎於醫而不知為自速其死矣傷哉夫虛損之由無非酒色勞倦七情飲食所致故或先傷其氣氣傷必及於精或先傷其精精傷必及於氣而精氣在人無非謂之陰分蓋陰為天一之根形質之祖故凡損在形質者總曰陰虛然分而言之則有陰中之陰虛者其病為發熱燥煩顴紅面赤唇乾舌燥咽痛口瘡吐血衄血便血尿血大便燥結小便痛澀等症有陰中之陽虛者其病為怯寒憔悴氣短神疲頭運目眩嘔惡食少腹痛飱泄二便不禁等症甚至咳嗽吐痰遺精盜汗氣喘聲喑筋骨痠疼心神恍惚肌肉盡削夢與鬼交婦人經閉等症此皆由於真陰之敗耳夫真陰惟腎為主蓋腎為精血之海而人之生氣即同天地之陽氣無非自下而上所以腎為五臟之本故腎水虧則肝失所滋而血燥生腎水虧則水不歸源而脾痰起腎水虧則心血不交而神色敗腎水虧則盜傷肺氣而喘嗽頻腎水虧則孤陽無主而虛火熾凡勞傷等症使非傷人根本何以危篤至此故凡病甚於上者必其竭甚於下者也飲食傷病源經曰五臟者藏精氣而不瀉也故滿而不實六腑者傳化物而不藏也故實而不滿又曰胃者水穀之海六腑之大源也五穀入口藏於胃以養五氣氣口亦太陰也是以五臟六腑之氣味皆出於胃變見於氣口又曰五穀之寒熱感則害人六腑又曰陰氣者靜則神藏躁則消亡飲食自倍腸胃乃傷此乃混言之也分之為二飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行合於四時五臟陰陽揆度以為常也食氣入胃濁氣歸心滋精於脈脈氣流經經氣歸於肺肺朝百脈輸精於皮毛毛脈合精行氣於府府精神明留於四臟氣歸於權衡權衡以平氣口成寸以決死生經曰谷始入於胃其精微者先出於胃之兩焦以溉五臟別出兩行營衛之道其大氣之薄而不行者積於胸中命曰氣海又曰平人谷入於胃脈道乃行水入於經其血乃成水決則營散谷消則衛亡神無所依凡水穀入胃其濁者為渣滓下出幽門達大小腸而為糞以出於穀道其清者倐然而化為氣依脾氣而上升於肺其至清而至精者由肺而灌溉乎四體而為汗液津唾助血脈益氣力為生生不息之運用也夫飲養陽氣食養陰氣過於大飲則氣逆形寒飲冷則傷肺肺傷氣逆則為喘滿咳嗽水瀉等症矣過於飽食而脾與胃並傷形與神俱困則為嘔吐痞滿筋脈橫解腸澼痔漏等症矣此飲食不節而為內傷如此可不謹哉
